              -DLIBSPDM_ENABLE_CAPABILITY_MEAS_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_HBEAT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_MUT_AUTH_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_CSR_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_SET_CERT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_CHUNK_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_ENDPOINT_INFO_CAP=0
              -DLIBSPDM_SEND_GET_CERTIFICATE_SUPPORT=0
              -DLIBSPDM_SEND_GET_ENDPOINT_INFO_SUPPORT=0
              -DLIBSPDM_ENABLE_MSG_LOG=0
              -DLIBSPDM_FIPS_MODE=1
            extra_tests: test_spdm_fips

          # == ASan and UBSan elsewhere ====================================
          # configs runs these with Clang on x64. GCC instruments the code
          # differently, and aarch64 differs in ABI.

          - name: gcc-asan-defaults
            sanitizer: address
            os: ubuntu-24.04
            arch: x64
