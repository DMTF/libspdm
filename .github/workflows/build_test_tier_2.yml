            extra_tests: test_spdm_fips

          - name: gcc-asan-record-transcript
            sanitizer: address
            os: ubuntu-24.04
            arch: x64
            toolchain: GCC
            cflags: -DLIBSPDM_RECORD_TRANSCRIPT_DATA_SUPPORT=1

          - name: linux-aarch64-asan-defaults
            sanitizer: address
            os: ubuntu-24.04-arm
            arch: aarch64

          - name: linux-aarch64-asan-defaults-openssl
            sanitizer: address
            os: ubuntu-24.04-arm
            arch: aarch64
            crypto: openssl

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # See the posix family.
          submodules: false
          persist-credentials: false

      - name: cmocka revision
        id: cmocka
        shell: bash
        run: |
          echo "sha=$(git ls-tree HEAD unit_test/cmockalib/cmocka | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: Cache cmocka
        id: cmocka-cache
        uses: actions/cache@v6
        with:
          path: unit_test/cmockalib/cmocka
          key: cmocka-${{ steps.cmocka.outputs.sha }}

      - name: Fetch submodules
        shell: bash
        run: |
          fetch() {
            local path=$1
            shift
            for attempt in 1 2 3; do
              if git submodule update --init "$@" "$path"; then
                return 0
              fi
              echo "fetch of $path failed, attempt $attempt"
              sleep $((attempt * 15))
            done
            return 1
          }

          if [ "${{ steps.cmocka-cache.outputs.cache-hit }}" != "true" ]; then
            fetch unit_test/cmockalib/cmocka --recursive
          else
            # The cached .git file points into .git/modules, which this
            # checkout does not have, and git submodule commands fail on it.
            rm -f unit_test/cmockalib/cmocka/.git
          fi
          fetch os_stub/mbedtlslib/mbedtls --recursive
          # libspdm builds OpenSSL from the pinned commit's source alone, so
          # neither its history nor its own submodules are fetched.
          if [ "${{ matrix.crypto || 'mbedtls' }}" = "openssl" ]; then
            fetch os_stub/openssllib/openssl --depth 1
          fi

      - name: OpenSSL revision
        if: matrix.crypto == 'openssl'
        id: ossl
        shell: bash
        run: |
          echo "sha=$(git -C os_stub/openssllib/openssl rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      # The same key as the posix family's jobs on the same runner and
      # toolchain: OpenSSL takes neither the macros nor the sanitizer flags, so
      # their trees are interchangeable.
      - name: Cache OpenSSL build
        if: matrix.crypto == 'openssl'
        uses: actions/cache@v6
        with:
          path: build/os_stub/openssllib
          key: openssl-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.toolchain || 'CLANG' }}-${{ steps.ossl.outputs.sha }}-${{ steps.ossl.outputs.image }}
          restore-keys: |
            openssl-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.toolchain || 'CLANG' }}-${{ steps.ossl.outputs.sha }}-

      # The commands are written to a script so that the reproducer runs exactly
      # what this step ran.
      #   memory   MemorySanitizer reports a read of uninitialized memory
      #            reliably only if every object is instrumented, and Mbed
      #            TLS's assembly cannot be. Every target reads Mbed TLS's user
      #            configuration file, so it turns the assembly off.
      #            -fsanitize-memory-track-origins would also name where each
      #            value came from, but it doubles the run time, so add it to
      #            the reproducer to trace a report.
      #   address  configs' flags, with alignment checks off until #3852 is
      #            fixed.
      - name: Select sanitizer
        shell: bash
        run: |
          if [ "${{ matrix.sanitizer }}" = "memory" ]; then
            cat > sanitizer.sh <<'SANITIZER'
          cat > msan_mbedtls_user_config.h <<'MBEDTLS'
          #undef MBEDTLS_HAVE_ASM
          #undef MBEDTLS_AESNI_C
          #undef MBEDTLS_AESCE_C
          #undef MBEDTLS_PADLOCK_C
          MBEDTLS
          export SAN_CFLAGS="-fsanitize=memory -fno-omit-frame-pointer -DMBEDTLS_USER_CONFIG_FILE=\\\"$PWD/msan_mbedtls_user_config.h\\\""
          export SAN_LDFLAGS="-fsanitize=memory"
          SANITIZER
          else
            cat > sanitizer.sh <<'SANITIZER'
          export SAN_CFLAGS="-fsanitize=address,undefined -fno-sanitize=alignment -fno-omit-frame-pointer"
          export SAN_LDFLAGS="-fsanitize=address,undefined"
          SANITIZER
          fi
          cat sanitizer.sh

          # Under MSan, the RSA key generation in test_crypt can take longer than
          # the test timeout, so MSan neither builds nor runs it.
          tests=""
          for t in $UNIT_TESTS ${{ matrix.extra_tests }}; do
            if [ "${{ matrix.sanitizer }}" != "memory" ] || [ "$t" != "test_crypt" ]; then
              tests="$tests $t"
            fi
          done
          echo "SAN_TESTS=${tests# }" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          # A stalled mirror can outlast apt-get's own timeouts, so each attempt
          # is bounded, and a failed one is retried.
          apt_install() {
            for attempt in 1 2 3; do
              if sudo timeout -k 10 300 apt-get update &&
                 sudo timeout -k 10 300 apt-get install --no-install-recommends -y "$@"; then
                return 0
              fi
              echo "apt-get install $* failed, attempt $attempt"
              sleep $((attempt * 15))
            done
            return 1
          }

          # The CLANG toolchain archives static libraries with llvm-ar, which is
          # not present on the stock Linux image. The same package provides
          # llvm-symbolizer, which the sanitizers need for function names.
          apt_install llvm

          . ./sanitizer.sh
          export CFLAGS="$BASE_CFLAGS $SAN_CFLAGS ${{ matrix.cflags }}"
          export LDFLAGS="$SAN_LDFLAGS"
          cmake -B build \
            -DARCH=${{ matrix.arch || 'x64' }} \
            -DTOOLCHAIN=${{ matrix.toolchain || 'CLANG' }} \
            -DTARGET=${{ matrix.target || 'Debug' }} \
            -DCRYPTO=${{ matrix.crypto || 'mbedtls' }}

      - name: Build
        shell: bash
        run: |
          jobs=$(getconf _NPROCESSORS_ONLN 2>/dev/null || nproc 2>/dev/null || echo 2)
          echo "Building with --parallel $jobs"
          cmake --build build --target copy_sample_key
          cmake --build build --parallel "$jobs" --target $SAN_TESTS

      - name: Prepare test runner
        shell: bash
        run: |
          # The reports name functions only with the symbolizer.
          if ! command -v llvm-symbolizer >/dev/null 2>&1; then
            echo "::error::llvm-symbolizer is not on PATH"
            exit 1
          fi

          # halt_on_error makes a UBSan report fail the test, as ASan's and
          # LSan's reports already do.
          if [ "${{ matrix.sanitizer }}" = "address" ]; then
            {
              echo "ASAN_OPTIONS=detect_leaks=1"
              echo "UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1"
            } >> "$GITHUB_ENV"
          fi

          cat > run_test.sh <<'RUNNER'
          #!/usr/bin/env bash
          set -uo pipefail
          t="$1"

          if [ ! -x "build/bin/$t" ]; then
            echo "::error::$t was not built"
            echo "- \`$t\`: **not built**" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 1
          fi

          ( cd build/bin && timeout 600 "./$t" )
          rc=$?

          if [ "$rc" -eq 0 ]; then
            echo "- \`$t\`: pass" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          else
            echo "- \`$t\`: **FAIL** (exit $rc)" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            echo "::error::$t failed with exit $rc"
          fi
          exit $rc
          RUNNER
          chmod +x run_test.sh
          echo "### ${{ env.JOB_NAME }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Test Requester
        shell: bash
        run: ./run_test.sh test_spdm_requester

      - name: Test Responder
        shell: bash
        run: ./run_test.sh test_spdm_responder

      - name: Test Common
        shell: bash
        run: ./run_test.sh test_spdm_common

      - name: Test SPDM Crypt
        shell: bash
        run: ./run_test.sh test_spdm_crypt

      - name: Test Crypt
        if: matrix.sanitizer != 'memory'
        shell: bash
        run: ./run_test.sh test_crypt

      - name: Test Secured Message
        shell: bash
        run: ./run_test.sh test_spdm_secured_message

      - name: Test Transport
        shell: bash
        run: ./run_test.sh test_spdm_transport

      - name: Test FIPS
        if: contains(matrix.extra_tests, 'test_spdm_fips')
        shell: bash
        run: ./run_test.sh test_spdm_fips

      # As in the posix family, generated from the job's own variables so that
      # it cannot drift from what ran.
      - name: Generate reproducer
        if: always()
        shell: bash
        run: |
          mkdir -p repro

          ccfile=""
          if [ -d build/CMakeFiles ]; then
            ccfile=$(find build/CMakeFiles -name CMakeCCompiler.cmake -print -quit)
          fi
          cid=$(sed -n 's/^set(CMAKE_C_COMPILER_ID "\(.*\)")/\1/p' "$ccfile" 2>/dev/null || true)
          cver=$(sed -n 's/^set(CMAKE_C_COMPILER_VERSION "\(.*\)")/\1/p' "$ccfile" 2>/dev/null || true)
          compiler="${cid:-unknown} ${cver:-unknown}"
          image="${ImageOS:-unknown} ${ImageVersion:-unknown}"
          osname=$(grep -m1 '^PRETTY_NAME=' /etc/os-release 2>/dev/null | cut -d= -f2- | tr -d '"' || true)
          kernel=$(uname -srm 2>/dev/null)
          url="${{ github.server_url }}/${{ github.repository }}"
          run_url="$url/actions/runs/${{ github.run_id }}"
          pins=$(git submodule status 2>/dev/null | awk '{print $2" "$1}' || true)

          header="Reproduces: ${{ env.JOB_NAME }}
          Run:        $run_url
          Runner:     ${{ matrix.os || 'ubuntu-24.04' }} (image $image)
          OS:         ${osname:-unknown}
          Kernel:     ${kernel:-unknown}
          Compiler:   $compiler
          NOTE: this restores the source tree, not the toolchain. If your
                compiler differs from the one above, a non-reproduction is
                inconclusive rather than a refutation."

          f=repro/repro.sh
          { echo "#!/usr/bin/env bash"
            echo "$header" | sed 's/^/# /'
            echo "set -euo pipefail"
            echo
            echo "git clone $url.git libspdm-repro"
            echo "cd libspdm-repro"
            echo "git checkout ${{ github.sha }}"
            echo "git submodule update --init --recursive unit_test/cmockalib/cmocka os_stub/mbedtlslib/mbedtls"
            if [ "${{ matrix.crypto || 'mbedtls' }}" = "openssl" ]; then
              echo "git submodule update --init --depth 1 os_stub/openssllib/openssl"
            fi
            echo "$pins" | sed 's/^/# pinned: /'
            echo
            if [ -f sanitizer.sh ]; then cat sanitizer.sh; fi
            echo "export CFLAGS=\"${{ env.BASE_CFLAGS }} \$SAN_CFLAGS ${{ matrix.cflags }}\""
            echo 'export LDFLAGS="$SAN_LDFLAGS"'
            echo "cmake -B build -DARCH=${{ matrix.arch || 'x64' }} -DTOOLCHAIN=${{ matrix.toolchain || 'CLANG' }} -DTARGET=${{ matrix.target || 'Debug' }} -DCRYPTO=${{ matrix.crypto || 'mbedtls' }}"
            echo "cmake --build build --target copy_sample_key"
            echo "cmake --build build --parallel \"\$(getconf _NPROCESSORS_ONLN)\" --target $SAN_TESTS"
            echo
            if [ "${{ matrix.sanitizer }}" = "address" ]; then
              echo "export ASAN_OPTIONS=detect_leaks=1"
              echo "export UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1"
            fi
            echo "cd build/bin"
            for t in $SAN_TESTS; do echo "./$t"; done
          } > "$f"
          chmod +x "$f"

          echo "$header"
          { echo "<details><summary>Reproducer</summary>"
            echo
            echo '```'
            cat "$f"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reproducer
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: repro-${{ env.JOB_NAME }}
          path: |
            repro/
            build/CMakeCache.txt
          retention-days: 14

  tier2-complete:
    name: Tier 2 complete
    runs-on: ubuntu-latest
    needs: [posix, versions, windows-msvc, mingw, configs, sanitizers]
    if: >-
      always() && (github.repository == 'DMTF/libspdm'
      || github.event_name != 'schedule')
    permissions:
      contents: read
      actions: read
      # To open or update the Daily Test Failure issue.
      issues: write
      # To name the pull request that merged each commit in that issue.
      pull-requests: read
    env:
      # Budgets from doc/internal/continuous_integration.md, Tier 2: total wall clock under two
      # hours, worst case single job 20 minutes. Exceeding either is reported
      # as a warning rather than a failure, because wall clock also depends on
      # runner contention from other workflows.
      MAX_RUN_MINUTES: 120
      MAX_JOB_MINUTES: 20
      SELF_JOB_NAME: Tier 2 complete
    steps:
      - name: Report timing against the budget
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" > run.json
          # The run has more than 100 jobs, so every page is read.
          gh api --paginate --slurp \
            "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" > jobs.json
          python3 - run.json jobs.json <<'TIMING'
          import json, os, sys, datetime

          UTC = datetime.timezone.utc
          FMT = "%Y-%m-%dT%H:%M:%SZ"


          def ts(s):
              return datetime.datetime.strptime(s, FMT).replace(tzinfo=UTC)


          run = json.load(open(sys.argv[1]))
          jobs = [j for page in json.load(open(sys.argv[2])) for j in page["jobs"]]

          # Allow tests to pin "now"; the workflow leaves it unset.
          now = ts(sys.argv[3]) if len(sys.argv) > 3 else datetime.datetime.now(UTC)

          max_run = int(os.environ.get("MAX_RUN_MINUTES", "30"))
          max_job = int(os.environ.get("MAX_JOB_MINUTES", "20"))
          me = os.environ.get("SELF_JOB_NAME", "Tier 2 complete")

          queue = (ts(run["run_started_at"]) - ts(run["created_at"])).total_seconds()
          elapsed = (now - ts(run["run_started_at"])).total_seconds()

          durs = [
              ((ts(j["completed_at"]) - ts(j["started_at"])).total_seconds(), j["name"])
              for j in jobs
              if j.get("completed_at") and j["name"] != me
          ]
          slow_d, slow_n = max(durs) if durs else (0, "(none)")
          total = sum(d for d, _ in durs)

          lines = [
              "### Tier 2 timing",
              "",
              "| metric | value | budget |",
              "|---|---|---|",
              "| wall clock | %.1f min | %d min |" % (elapsed / 60, max_run),
              "| slowest job | %.1f min (%s) | %d min |" % (slow_d / 60, slow_n, max_job),
              "| queued before start | %.1f min | - |" % (queue / 60),
              "| sum of job time | %.1f min | - |" % (total / 60),
              "| jobs | %d | - |" % len(durs),
          ]

          warn = []
          if elapsed > max_run * 60:
              warn.append(
                  "Tier 2 wall clock %.1f min exceeds the %d min budget in doc/internal/continuous_integration.md"
                  % (elapsed / 60, max_run)
              )
          if slow_d > max_job * 60:
              warn.append(
                  "Job '%s' took %.1f min, over the %d min worst-case-job assumption"
                  % (slow_n, slow_d / 60, max_job)
              )

          for w in warn:
              print("::warning::" + w)
              lines += ["", "> [!WARNING]", "> " + w]

          print("\n".join(lines))
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a") as f:
                  f.write("\n".join(lines) + "\n")
          TIMING

      # For the issue below: the commits that went into main after the commit
      # that the previous scheduled run tested, oldest first. A failure here
      # leaves them out of the issue rather than losing the issue, so the list
      # is written only once it is complete.
      - name: List the commits since the previous scheduled run
        if: github.event_name == 'schedule' && !cancelled()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha=${{ github.sha }}
          read -r workflow created < <(gh api "repos/$GH_REPO/actions/runs/${{ github.run_id }}" \
            --jq '"\(.workflow_id) \(.created_at)"')
          # The latest completed scheduled run created before this one. A
          # re-run keeps the creation time of the run it repeats.
          prev=$(CREATED=$created gh api \
            "repos/$GH_REPO/actions/workflows/$workflow/runs?event=schedule&branch=main&status=completed&per_page=100" \
            --jq '[.workflow_runs[] | select(.created_at < env.CREATED
              and .conclusion != "startup_failure")][0] // empty
              | "\(.head_sha) \(.html_url) \(.conclusion)"')
          {
            if [ -z "$prev" ]; then
              echo "There is no earlier scheduled run to compare with."
            else
              read -r prev_sha prev_url prev_conclusion <<< "$prev"
              if [ "$prev_sha" = "$sha" ]; then
                echo "The previous scheduled run, $prev_url ($prev_conclusion), tested the same commit."
              else
                compare="repos/$GH_REPO/compare/$prev_sha...$sha"
                echo "Commits since the previous scheduled run, $prev_url ($prev_conclusion), oldest first:"
                echo
                gh api "$compare" --jq '.commits[] | "\(.sha) \(.commit.message | split("\n")[0])"' |
                  while read -r commit subject; do
                    pr=$(gh api "repos/$GH_REPO/commits/$commit/pulls" \
                      --jq '[.[] | select(.merged_at != null)][0].number // empty')
                    echo "- $commit $subject${pr:+ (#$pr)}"
                  done
                # The compare API lists at most 250 commits.
                more=$(gh api "$compare" --jq '.total_commits - (.commits | length)')
                if [ "$more" -gt 0 ]; then
                  echo "- $more more: ${{ github.server_url }}/$GH_REPO/compare/$prev_sha...$sha"
                fi
              fi
            fi
          } > commits.tmp
          mv commits.tmp commits.md

      # doc/internal/continuous_integration.md: maintainers are notified of a
      # failure by an issue with the Daily Test Failure label. One open issue
      # collects the failures until it is closed. Only scheduled runs report. A
      # cancelled run does not, but a job that reaches its timeout does. Each
      # report lists the failed jobs and the commits since the previous
      # scheduled run.
      - name: Open or update the Daily Test Failure issue
        if: >-
          ${{ github.event_name == 'schedule' && !cancelled()
          && (needs.posix.result != 'success'
          || needs.versions.result != 'success'
          || needs['windows-msvc'].result != 'success'
          || needs.mingw.result != 'success'
          || needs.configs.result != 'success'
          || needs.sanitizers.result != 'success') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LABEL: Daily Test Failure
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Tier 2 failed on \`main\` at ${{ github.sha }} in $RUN_URL."
            echo
            echo "Failed jobs:"
            echo
            gh api --paginate "repos/$GH_REPO/actions/runs/${{ github.run_id }}/jobs?per_page=100" \
              --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out"
                or .conclusion == "cancelled") | "- [\(.name)](\(.html_url))"'
            echo
            if [ -f commits.md ]; then
              cat commits.md
            else
              echo "The commits since the previous scheduled run could not be listed."
            fi
          } > failure.md
          gh label create "$LABEL" --color B60205 \
            --description "A scheduled test run on main failed" 2>/dev/null || true
          issue=$(gh issue list --label "$LABEL" --state open --limit 1 \
            --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file failure.md
          else
            gh issue create --title "Tier 2 daily test failure" --label "$LABEL" \
              --body-file failure.md
          fi

      - name: Check result
        run: |
          posix="${{ needs.posix.result }}"
          versions="${{ needs.versions.result }}"
          msvc="${{ needs['windows-msvc'].result }}"
          mingw="${{ needs.mingw.result }}"
          configs="${{ needs.configs.result }}"
          sanitizers="${{ needs.sanitizers.result }}"
          echo "posix=$posix versions=$versions windows-msvc=$msvc mingw=$mingw configs=$configs sanitizers=$sanitizers"
          if [ "$posix" != "success" ] || [ "$versions" != "success" ] || [ "$msvc" != "success" ] ||
             [ "$mingw" != "success" ] || [ "$configs" != "success" ] || [ "$sanitizers" != "success" ]; then
            echo "::error::Tier 2 did not pass (posix=$posix versions=$versions windows-msvc=$msvc mingw=$mingw configs=$configs sanitizers=$sanitizers)"
            exit 1
          fi
