# Implements "Tier 2 - Daily Coverage" from doc/internal/continuous_integration.md:
#   - the core unit tests against every combination of operating system, host
#     hardware, toolchain, cryptography library and build target that the CMake
#     build files support, 48 in all, in the posix, windows-msvc and mingw
#     families, and
#   - the code configuration sweeps under ASan and UBSan, in the configs family.
#
# Unlike Tier 1, each platform family's matrix is a cross product, so the matrix
# itself shows that every combination is covered. The family split and the one
# exclusion encode which combinations are legal. The steps are copied from
# build_test_tier_1.yml and must be kept in step with it.

name: Tier 2 Build and Test

on:
  schedule:
    - cron: '25 10 * * *'
  # Tier 2 tests main in DMTF/libspdm only. Every job checks the repository and
  # branch, so a run in a fork or on any other branch skips them all.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Basic unit tests per doc/internal/continuous_integration.md. Every job runs
  # each of these that its build produced. Extended unit tests are added per
  # job via matrix.extra_tests, in the configurations that satisfy their
  # requirement.
  UNIT_TESTS: >-
    test_spdm_requester
    test_spdm_responder
    test_spdm_crypt
    test_spdm_secured_message
    test_spdm_common
    test_crypt

  # Applied to every job.
  #   CHECK_MACRO      enforces include/internal/libspdm_macro_check.h at
  #                    compile time, so an illegal configuration fails loudly
  #                    instead of building something subtly wrong.
  #   ASSERT_CONFIG=3  makes a failing assert exit rather than deadloop.
  BASE_CFLAGS: -DLIBSPDM_CHECK_MACRO=1 -DLIBSPDM_DEBUG_LIBSPDM_ASSERT_CONFIG=3

jobs:
  # posix, windows-msvc and mingw repeat most of their steps. That is deliberate.
  # The alternative is one job family whose platform-specific steps are selected
  # with `if:`, and GitHub has no way to hide work it skips
  # (https://github.com/orgs/community/discussions/18001).
  #
  # max-parallel applies to each job family separately, so posix, windows-msvc,
  # mingw and configs run at most 5 + 4 + 2 + 5 = 16 jobs at once. That leaves 4
  # of the 20 runners that doc/internal/continuous_integration.md assumes for
  # pull requests and pushes. If every job took that document's worst case of 20
  # minutes, each platform family would finish in at most five rounds, or 100
  # minutes, within Tier 2's two hours. The configs family cannot meet that worst
  # case, as its 67 jobs take 14 rounds. Its jobs take about 6 minutes, so it
  # finishes in about 85 minutes, and the timing report warns if a run takes
  # longer than two hours. The platform families finish in about half an hour,
  # after which only configs runs.

  posix:
    name: ${{ format('{0}-{1}-{2}-{3}-{4}', matrix.platform, matrix.arch, matrix.tc, matrix.crypto, matrix.tgt) }}
    if: github.repository == 'DMTF/libspdm' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      JOB_NAME: ${{ format('{0}-{1}-{2}-{3}-{4}', matrix.platform, matrix.arch, matrix.tc, matrix.crypto, matrix.tgt) }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        platform: [linux, macos]
        arch: [x64, aarch64]
        toolchain: [GCC, CLANG]
        crypto: [mbedtls, openssl]
        target: [Debug, Release]
        exclude:
          # The CMake build files support only Clang on macOS.
          - platform: macos
            toolchain: GCC
        include:
          # The runner for each platform and architecture.
          - {platform: linux, arch: x64, os: ubuntu-latest}
          - {platform: linux, arch: aarch64, os: ubuntu-24.04-arm}
          - {platform: macos, arch: aarch64, os: macos-latest}
          - {platform: macos, arch: x64, os: macos-26-intel}
          # Lower-case spellings for the job name.
          - {toolchain: GCC, tc: gcc}
          - {toolchain: CLANG, tc: clang}
          - {target: Debug, tgt: debug}
          - {target: Release, tgt: release}
          # As in Tier 1, fat LTO objects make GCC report its late warnings
          # when compiling, under -Werror.
          - {platform: linux, arch: x64, toolchain: GCC, target: Release, cflags: -ffat-lto-objects}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The submodules are fetched in a later step so that cmocka can be served
          # from the cache. A fetch failure inside this step aborts the job before
          # any cache is consulted, which is what makes cmocka's host a source of
          # unrelated test failures.
          submodules: false
          # Nothing after this step needs to talk to the remote, and the jobs
          # run build scripts from the pull request's own tree.
          persist-credentials: false

      # cmocka is the only submodule not hosted on github.com, and gitlab.com is
      # reachable less reliably from the runners. Its source does not vary by
      # configuration, so a single entry keyed on the pinned revision serves every
      # matrix entry, and gitlab.com is contacted only when that pin moves.
      - name: cmocka revision
        id: cmocka
        shell: bash
        run: |
          echo "sha=$(git ls-tree HEAD unit_test/cmockalib/cmocka | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: Cache cmocka
        id: cmocka-cache
        uses: actions/cache@v6
        with:
          path: unit_test/cmockalib/cmocka
          key: cmocka-${{ steps.cmocka.outputs.sha }}

      - name: Fetch submodules
        shell: bash
        run: |
          # Retry rather than fail the job on a transient fetch error. A cache hit
          # means cmocka is already present, so it is not fetched at all.
          fetch() {
            local path=$1
            shift
            for attempt in 1 2 3; do
              if git submodule update --init "$@" "$path"; then
                return 0
              fi
              echo "fetch of $path failed, attempt $attempt"
              sleep $((attempt * 15))
            done
            return 1
          }

          if [ "${{ steps.cmocka-cache.outputs.cache-hit }}" != "true" ]; then
            fetch unit_test/cmockalib/cmocka --recursive
          fi
          fetch os_stub/mbedtlslib/mbedtls --recursive
          # libspdm builds OpenSSL from the pinned commit's source alone, so
          # neither its history nor its own submodules are fetched.
          if [ "${{ matrix.crypto }}" = "openssl" ]; then
            fetch os_stub/openssllib/openssl --depth 1
          fi
      # OpenSSL is an ExternalProject with its own CFLAGS, so no LIBSPDM_*
      # macro reaches it: one entry serves every configuration on a given
      # platform. Measured at ~100 MB on POSIX and ~344 MB on Windows, so
      # caching the tree wholesale is affordable and avoids maintaining a
      # list of which paths have consumers -- the Windows DLL lives in the
      # build tree, not the install tree, which such a list would miss.
      - name: OpenSSL revision
        id: ossl
        shell: bash
        run: |
          echo "sha=$(git -C os_stub/openssllib/openssl rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      # The OpenSSL revision precedes the runner image in the key so that
      # restore-keys can fall back to the same revision's tree from an older
      # image, rather than rebuilding whenever an image rollout lands. The
      # fallback therefore reuses objects from the older image's compiler
      # until the revision changes. Because the prefix pins the revision,
      # stamps from one revision are never paired with a tree from another.
      # The key omits TARGET and the macros because neither changes what
      # OpenSSL builds.
      - name: Cache OpenSSL build
        if: matrix.crypto == 'openssl' && matrix.openssl_binary != 'true'
        uses: actions/cache@v6
        with:
          path: build/os_stub/openssllib
          key: openssl-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.toolchain }}-${{ steps.ossl.outputs.sha }}-${{ steps.ossl.outputs.image }}
          restore-keys: |
            openssl-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.toolchain }}-${{ steps.ossl.outputs.sha }}-

      # A binary build does not build the ExternalProject above. Its OpenSSL is
      # installed into a prefix that, like that tree, depends only on the
      # OpenSSL revision and the runner, so it is cached the same way.
      - name: Cache OpenSSL binaries
        if: matrix.openssl_binary == 'true'
        uses: actions/cache@v6
        with:
          path: openssl-binary
          key: openssl-binary-${{ matrix.os }}-${{ matrix.arch }}-${{ steps.ossl.outputs.sha }}-${{ steps.ossl.outputs.image }}
          restore-keys: |
            openssl-binary-${{ matrix.os }}-${{ matrix.arch }}-${{ steps.ossl.outputs.sha }}-

      # The commands are written to a script so that the reproducer runs exactly
      # what this step ran.
      - name: Build OpenSSL binaries
        if: matrix.openssl_binary == 'true'
        shell: bash
        run: |
          cat > build_openssl_binary.sh <<'OPENSSL'
          # The prefix is not on the linker's search path, so only the libraries
          # given to CMake can satisfy the link.
          export OPENSSL_BINARY="$PWD/openssl-binary"
          if [ ! -e "$OPENSSL_BINARY/lib/libcrypto.so" ]; then
            mkdir -p build-openssl-binary
            (cd build-openssl-binary &&
              ../os_stub/openssllib/openssl/Configure shared no-tests no-docs \
                --prefix="$OPENSSL_BINARY" --libdir=lib &&
              make -j"$(getconf _NPROCESSORS_ONLN)" build_libs &&
              make install_dev)
          fi
          OPENSSL
          . ./build_openssl_binary.sh
          echo "OPENSSL_BINARY=$OPENSSL_BINARY" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        env:
          CFLAGS: ${{ env.BASE_CFLAGS }} ${{ matrix.cflags }}
        run: |
          # The CLANG toolchain archives static libraries with llvm-ar,
          # which is not present on the stock Linux image.
          if [ "${{ matrix.toolchain }}" = "CLANG" ] && [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y llvm
          fi

          # A binary build takes the OpenSSL libraries as paths, and their
          # headers from the include path, ahead of any OpenSSL on the image.
          binary=()
          if [ "${{ matrix.openssl_binary }}" = "true" ]; then
            CFLAGS="$CFLAGS -I$OPENSSL_BINARY/include"
            binary=(-DENABLE_BINARY_BUILD=1
                    "-DCOMPILED_LIBCRYPTO_PATH=$OPENSSL_BINARY/lib/libcrypto.so"
                    "-DCOMPILED_LIBSSL_PATH=$OPENSSL_BINARY/lib/libssl.so")
          fi

          cmake -B build \
            -DARCH=${{ matrix.arch }} \
            -DTOOLCHAIN=${{ matrix.toolchain }} \
            -DTARGET=${{ matrix.target }} \
            -DCRYPTO=${{ matrix.crypto }} \
            ${{ matrix.cmake_extra }} \
            "${binary[@]}"

      - name: Build
        shell: bash
        run: |
          # Discover the core count rather than assuming it, so the build keeps
          # pace if runner specs change. A bare `--parallel` means an unbounded
          # -j, which exhausts the smaller runners.
          jobs=$(getconf _NPROCESSORS_ONLN 2>/dev/null || nproc 2>/dev/null || echo 2)
          echo "Building with --parallel $jobs"

          # copy_sample_key stages certificates into build/bin, which only
          # exists when unit tests are built.
          if [ "${{ matrix.expect_tests }}" != "false" ]; then
            cmake --build build --target copy_sample_key
          fi
          cmake --build build --parallel "$jobs"

      # Implements "For any configuration, run all basic unit tests", plus any
      # extended unit test whose requirement this configuration satisfies.
      # Each test is bounded so a hang fails the job instead of stalling it.
      # One step per test, so the Actions UI shows a separate pass/fail entry
      # for each. A single looping step buries later tests below the log
      # viewer's truncation point. The shared runner keeps the binary lookup
      # and the timeout guard in one place rather than in six copies.
      - name: Prepare test runner
        if: matrix.expect_tests != 'false'
        shell: bash
        run: |
          cat > run_test.sh <<'RUNNER'
          #!/usr/bin/env bash
          set -uo pipefail
          t="$1"

          exe=""
          if [ -x "build/bin/$t" ]; then
            exe="$t"
          elif [ -x "build/bin/$t.exe" ]; then
            exe="$t.exe"
          fi

          # Basic unit tests require no additional configuration, so a missing
          # one means coverage was lost rather than legitimately skipped.
          if [ -z "$exe" ]; then
            echo "::error::$t was not built"
            echo "- \`$t\`: **not built**" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 1
          fi

          # macOS has no GNU timeout; fall back to gtimeout, then to perl.
          if command -v timeout >/dev/null 2>&1; then
            ( cd build/bin && timeout 600 "./$exe" )
          elif command -v gtimeout >/dev/null 2>&1; then
            ( cd build/bin && gtimeout 600 "./$exe" )
          else
            ( cd build/bin && perl -e 'alarm shift; exec @ARGV' 600 "./$exe" )
          fi
          rc=$?

          if [ "$rc" -eq 0 ]; then
            echo "- \`$t\`: pass" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          else
            echo "- \`$t\`: **FAIL** (exit $rc)" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            echo "::error::$t failed with exit $rc"
          fi
          exit $rc
          RUNNER
          chmod +x run_test.sh
          echo "### ${{ env.JOB_NAME }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Test Requester
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_spdm_requester

      - name: Test Responder
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_spdm_responder

      - name: Test Common
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_spdm_common

      - name: Test SPDM Crypt
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_spdm_crypt

      - name: Test Crypt
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_crypt

      - name: Test Secured Message
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_spdm_secured_message

      # Extended unit test: runs only where its requirement is satisfied.
      - name: Test FIPS
        if: contains(matrix.extra_tests, 'test_spdm_fips')
        shell: bash
        run: ./run_test.sh test_spdm_fips

      # DISABLE_TESTS gates 87 test subdirectories, so this checks that nothing
      # test-shaped was produced, and that libraries still were -- otherwise an
      # empty build tree would satisfy the check vacuously.
      - name: Verify no tests were built
        if: matrix.expect_tests == 'false'
        shell: bash
        run: |
          # build/bin does not exist when tests are disabled. Redirecting find's
          # stderr hides the message but not its exit status, which pipefail
          # propagates and set -e turns into a silent step failure, so test for
          # the directory instead of relying on 2>/dev/null.
          if [ -d build/bin ]; then
            stray=$(find build/bin -maxdepth 1 -name 'test_*' | wc -l)
          else
            stray=0
          fi
          if [ -d build ]; then
            libs=$(find build -type f \( -name '*.a' -o -name '*.lib' \) | wc -l)
          else
            libs=0
          fi
          echo "DISABLE_TESTS check: $stray test artifacts under build/bin, $libs libraries built"
          {
            echo "### ${{ env.JOB_NAME }}"
            echo ""
            echo "DISABLE_TESTS: $stray test artifacts, $libs libraries"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$stray" -ne 0 ]; then
            echo "::error::DISABLE_TESTS was set but build/bin holds $stray test artifacts"
            exit 1
          fi
          if [ "$libs" -eq 0 ]; then
            echo "::error::DISABLE_TESTS build produced no libraries; the check would pass vacuously"
            exit 1
          fi
      # Reproducer, generated from the job's own variables so that it cannot
      # drift from what actually ran. The script restores the source tree but
      # not the toolchain, so the compiler identity is recorded in the header:
      # identical source can produce different diagnostics on different
      # compiler versions.
      - name: Generate reproducer
        if: always()
        shell: bash
        run: |
          mkdir -p repro

          # A failed configure leaves no build tree, and this step runs on
          # always(). "ls ... | head" exits non-zero there, which pipefail and
          # set -e turn into a silent step failure, losing the reproducer in
          # exactly the case that most needs one.
          ccfile=""
          if [ -d build/CMakeFiles ]; then
            ccfile=$(find build/CMakeFiles -name CMakeCCompiler.cmake -print -quit)
          fi
          cid=$(sed -n 's/^set(CMAKE_C_COMPILER_ID "\(.*\)")/\1/p' "$ccfile" 2>/dev/null || true)
          cver=$(sed -n 's/^set(CMAKE_C_COMPILER_VERSION "\(.*\)")/\1/p' "$ccfile" 2>/dev/null || true)
          compiler="${cid:-unknown} ${cver:-unknown}"
          image="${ImageOS:-unknown} ${ImageVersion:-unknown}"

          # The image label identifies the runner build, not what is actually
          # underneath it. Record the distro and kernel too, so a reader can
          # tell how far their machine differs from the one that failed.
          if [ -r /etc/os-release ]; then
            osname=$(grep -m1 '^PRETTY_NAME=' /etc/os-release | cut -d= -f2- | tr -d '"' || true)
          elif command -v sw_vers >/dev/null 2>&1; then
            osname="$(sw_vers -productName) $(sw_vers -productVersion)"
          else
            osname=$(cmd //c ver 2>/dev/null | tr -d '[:cntrl:]' | grep -m1 Windows || true)
          fi
          kernel=$(uname -srm 2>/dev/null)
          url="${{ github.server_url }}/${{ github.repository }}"
          run_url="$url/actions/runs/${{ github.run_id }}"

          # On a pull_request event github.sha is the ephemeral merge commit
          # under refs/pull/N/merge, which a plain clone does not fetch. Fetch
          # that ref explicitly so the script checks out what CI actually built.
          pr="${{ github.event.pull_request.number }}"
          if [ -n "$pr" ]; then
            fetch_ref="git fetch origin refs/pull/$pr/merge"
            checkout_ref="git checkout FETCH_HEAD"
          else
            fetch_ref=""
            checkout_ref="git checkout ${{ github.sha }}"
          fi

          # Informational: the checkout above already pins these, but recording
          # them lets a reader verify the tree is what the job built.
          pins=$(git submodule status 2>/dev/null | awk '{print $2" "$1}' || true)

          header="Reproduces: ${{ env.JOB_NAME }}
          Run:        $run_url
          Runner:     ${{ matrix.os }} (image $image)
          OS:         ${osname:-unknown}
          Kernel:     ${kernel:-unknown}
          Compiler:   $compiler
          NOTE: this restores the source tree, not the toolchain. If your
                compiler differs from the one above, a non-reproduction is
                inconclusive rather than a refutation."

          if [ "${{ runner.os }}" = "Windows" ] && [ -z "${{ matrix.shell }}" ]; then
            f=repro/repro.bat
            { echo "@echo off"
              echo "$header" | sed 's/^/REM /'
              echo "REM Run from a Visual Studio Developer Command Prompt for ${{ matrix.msvc_arch }}."
              echo
              echo "git clone $url.git libspdm-repro || exit /b 1"
              echo "cd libspdm-repro || exit /b 1"
              if [ -n "$fetch_ref" ]; then echo "$fetch_ref || exit /b 1"; fi
              echo "$checkout_ref || exit /b 1"
              echo "git submodule update --init --recursive unit_test/cmockalib/cmocka os_stub/mbedtlslib/mbedtls || exit /b 1"
              if [ "${{ matrix.crypto }}" = "openssl" ]; then
                echo "git submodule update --init --depth 1 os_stub/openssllib/openssl || exit /b 1"
              fi
              echo "$pins" | sed 's/^/REM pinned: /'
              echo
              if [ "${{ matrix.toolchain }}" = "CLANG" ]; then
                echo "set \"PATH=%ProgramFiles%\\LLVM\\bin;%PATH%\""
              fi
              echo "set CFLAGS=${{ env.BASE_CFLAGS }} ${{ matrix.cflags }}"
              echo "cmake -B build -G \"${{ matrix.generator }}\" -DARCH=${{ matrix.arch }} -DTOOLCHAIN=${{ matrix.toolchain }} -DTARGET=${{ matrix.target }} -DCRYPTO=${{ matrix.crypto }} ${{ matrix.cmake_extra }} || exit /b 1"
              echo "cmake --build build --target copy_sample_key"
              echo "cmake --build build || exit /b 1"
              echo
              echo "cd build\\bin"
              for t in $UNIT_TESTS ${{ matrix.extra_tests }}; do echo "if exist $t.exe $t.exe"; done
            } > "$f"
          else
            f=repro/repro.sh
            { echo "#!/usr/bin/env bash"
              echo "$header" | sed 's/^/# /'
              if [ -n "${{ matrix.shell }}" ]; then
                echo "# Run inside an MSYS2 MINGW64 shell."
              fi
              echo "set -euo pipefail"
              echo
              echo "git clone $url.git libspdm-repro"
              echo "cd libspdm-repro"
              if [ -n "$fetch_ref" ]; then echo "$fetch_ref"; fi
              echo "$checkout_ref"
              echo "git submodule update --init --recursive unit_test/cmockalib/cmocka os_stub/mbedtlslib/mbedtls"
              if [ "${{ matrix.crypto }}" = "openssl" ]; then
                echo "git submodule update --init --depth 1 os_stub/openssllib/openssl"
              fi
              echo "$pins" | sed 's/^/# pinned: /'
              echo
              echo "export CFLAGS='${{ env.BASE_CFLAGS }} ${{ matrix.cflags }}'"
              # The OpenSSL prefix is under the clone, so these lines are
              # emitted unexpanded.
              binary=""
              if [ "${{ matrix.openssl_binary }}" = "true" ]; then
                # Absent only if the job failed before "Build OpenSSL binaries".
                if [ -f build_openssl_binary.sh ]; then cat build_openssl_binary.sh; fi
                echo 'export CFLAGS="$CFLAGS -I$OPENSSL_BINARY/include"'
                binary=' -DENABLE_BINARY_BUILD=1 -DCOMPILED_LIBCRYPTO_PATH="$OPENSSL_BINARY/lib/libcrypto.so" -DCOMPILED_LIBSSL_PATH="$OPENSSL_BINARY/lib/libssl.so"'
              fi
              if [ -n "${{ matrix.generator }}" ]; then
                echo "cmake -B build -G \"${{ matrix.generator }}\" -DARCH=${{ matrix.arch }} -DTOOLCHAIN=${{ matrix.toolchain }} -DTARGET=${{ matrix.target }} -DCRYPTO=${{ matrix.crypto }} ${{ matrix.cmake_extra }}$binary"
              else
                echo "cmake -B build -DARCH=${{ matrix.arch }} -DTOOLCHAIN=${{ matrix.toolchain }} -DTARGET=${{ matrix.target }} -DCRYPTO=${{ matrix.crypto }} ${{ matrix.cmake_extra }}$binary"
              fi
              echo "cmake --build build --target copy_sample_key"
              echo "cmake --build build --parallel \"\$(getconf _NPROCESSORS_ONLN)\""
              echo
              echo "cd build/bin"
              for t in $UNIT_TESTS ${{ matrix.extra_tests }}; do echo "if [ -x ./$t ]; then ./$t; fi"; done
            } > "$f"
            chmod +x "$f"
          fi

          # The step log is the first place anyone looks, and unlike the job
          # summary it is reachable from the API, so echo the platform
          # identity there too.
          echo "$header"

          # Legibility for every run, not just failures: the invocation is
          # visible in the UI without downloading anything.
          { echo "<details><summary>Reproducer</summary>"
            echo
            echo '```'
            cat "$f"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reproducer
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: repro-${{ env.JOB_NAME }}
          path: |
            repro/
            build/CMakeCache.txt
          retention-days: 14

  windows-msvc:
    name: ${{ format('windows-{0}-{1}-{2}-{3}', matrix.arch, matrix.tc, matrix.crypto, matrix.tgt) }}
    if: github.repository == 'DMTF/libspdm' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      JOB_NAME: ${{ format('windows-{0}-{1}-{2}-{3}', matrix.arch, matrix.tc, matrix.crypto, matrix.tgt) }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        toolchain: [VS2022, CLANG]
        arch: [x64, ia32]
        crypto: [mbedtls, openssl]
        target: [Debug, Release]
        include:
          - {os: windows-latest, generator: NMake Makefiles}
          - {arch: x64, msvc_arch: x64}
          - {arch: ia32, msvc_arch: x86}
          # Lower-case spellings for the job name.
          - {toolchain: VS2022, tc: vs}
          - {toolchain: CLANG, tc: clang}
          - {target: Debug, tgt: debug}
          - {target: Release, tgt: release}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The submodules are fetched in a later step so that cmocka can be served
          # from the cache. A fetch failure inside this step aborts the job before
          # any cache is consulted, which is what makes cmocka's host a source of
          # unrelated test failures.
          submodules: false
          # Nothing after this step needs to talk to the remote, and the jobs
          # run build scripts from the pull request's own tree.
          persist-credentials: false

      # cmocka is the only submodule not hosted on github.com, and gitlab.com is
      # reachable less reliably from the runners. Its source does not vary by
      # configuration, so a single entry keyed on the pinned revision serves every
      # matrix entry, and gitlab.com is contacted only when that pin moves.
      - name: cmocka revision
        id: cmocka
        shell: bash
        run: |
          echo "sha=$(git ls-tree HEAD unit_test/cmockalib/cmocka | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: Cache cmocka
        id: cmocka-cache
        uses: actions/cache@v6
        with:
          path: unit_test/cmockalib/cmocka
          key: cmocka-${{ steps.cmocka.outputs.sha }}

      - name: Fetch submodules
        shell: bash
        run: |
          # Retry rather than fail the job on a transient fetch error. A cache hit
          # means cmocka is already present, so it is not fetched at all.
          fetch() {
            local path=$1
            shift
            for attempt in 1 2 3; do
              if git submodule update --init "$@" "$path"; then
                return 0
              fi
              echo "fetch of $path failed, attempt $attempt"
              sleep $((attempt * 15))
            done
            return 1
          }

          if [ "${{ steps.cmocka-cache.outputs.cache-hit }}" != "true" ]; then
            fetch unit_test/cmockalib/cmocka --recursive
          fi
          fetch os_stub/mbedtlslib/mbedtls --recursive
          # libspdm builds OpenSSL from the pinned commit's source alone, so
          # neither its history nor its own submodules are fetched.
          if [ "${{ matrix.crypto }}" = "openssl" ]; then
            fetch os_stub/openssllib/openssl --depth 1
          fi
      # OpenSSL is an ExternalProject with its own CFLAGS, so no LIBSPDM_*
      # macro reaches it: one entry serves every configuration on a given
      # platform. Measured at ~100 MB on POSIX and ~344 MB on Windows, so
      # caching the tree wholesale is affordable and avoids maintaining a
      # list of which paths have consumers -- the Windows DLL lives in the
      # build tree, not the install tree, which such a list would miss.
      - name: OpenSSL revision
        id: ossl
        shell: bash
        run: |
          echo "sha=$(git -C os_stub/openssllib/openssl rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      # The OpenSSL revision precedes the runner image in the key so that
      # restore-keys can fall back to the same revision's tree from an older
      # image, rather than rebuilding whenever an image rollout lands. The
      # fallback therefore reuses objects from the older image's compiler
      # until the revision changes. Because the prefix pins the revision,
      # stamps from one revision are never paired with a tree from another.
      # The key omits TARGET and the macros because neither changes what
      # OpenSSL builds.
      - name: Cache OpenSSL build
        if: matrix.crypto == 'openssl'
        uses: actions/cache@v6
        with:
          path: build/os_stub/openssllib
          key: openssl-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.toolchain }}-${{ steps.ossl.outputs.sha }}-${{ steps.ossl.outputs.image }}
          restore-keys: |
            openssl-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.toolchain }}-${{ steps.ossl.outputs.sha }}-

      - name: Set up MSVC
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0
        with:
          arch: ${{ matrix.msvc_arch }}

      # The CLANG toolchain runs clang-cl and lld-link from PATH. Put the
      # image's LLVM there explicitly rather than depend on whether the image
      # or the developer environment already does.
      - name: Set up LLVM
        if: matrix.toolchain == 'CLANG'
        run: |
          $llvm = "$env:ProgramFiles\LLVM\bin"
          if (-not (Test-Path "$llvm\clang-cl.exe")) {
            Write-Output "::error::clang-cl.exe not found in $llvm"
            exit 1
          }
          Add-Content -Path $env:GITHUB_PATH -Value $llvm
          & "$llvm\clang-cl.exe" --version

      # Windows/MSVC uses the default shell rather than bash: OpenSSL's
      # Configure is a Perl script, and under Git Bash `perl` resolves to the
      # bundled MSYS interpreter, which lacks modules Configure requires.
      - name: Configure (Windows/MSVC)
        env:
          CFLAGS: ${{ env.BASE_CFLAGS }} ${{ matrix.cflags }}
        run: |
          cmake -B build -G "${{ matrix.generator }}" `
            -DARCH=${{ matrix.arch }} `
            -DTOOLCHAIN=${{ matrix.toolchain }} `
            -DTARGET=${{ matrix.target }} `
            -DCRYPTO=${{ matrix.crypto }} `
            ${{ matrix.cmake_extra }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build (Windows/MSVC)
        run: |
          if ('${{ matrix.expect_tests }}' -ne 'false') {
            cmake --build build --target copy_sample_key
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          cmake --build build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Implements "For any configuration, run all basic unit tests", plus any
      # extended unit test whose requirement this configuration satisfies.
      # Each test is bounded so a hang fails the job instead of stalling it.
      # One step per test, so the Actions UI shows a separate pass/fail entry
      # for each. A single looping step buries later tests below the log
      # viewer's truncation point. The shared runner keeps the binary lookup
      # and the timeout guard in one place rather than in six copies.
      - name: Prepare test runner
        if: matrix.expect_tests != 'false'
        shell: bash
        run: |
          cat > run_test.sh <<'RUNNER'
          #!/usr/bin/env bash
          set -uo pipefail
          t="$1"

          exe=""
          if [ -x "build/bin/$t" ]; then
            exe="$t"
          elif [ -x "build/bin/$t.exe" ]; then
            exe="$t.exe"
          fi

          # Basic unit tests require no additional configuration, so a missing
          # one means coverage was lost rather than legitimately skipped.
          if [ -z "$exe" ]; then
            echo "::error::$t was not built"
            echo "- \`$t\`: **not built**" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 1
          fi

          # macOS has no GNU timeout; fall back to gtimeout, then to perl.
          if command -v timeout >/dev/null 2>&1; then
            ( cd build/bin && timeout 600 "./$exe" )
          elif command -v gtimeout >/dev/null 2>&1; then
            ( cd build/bin && gtimeout 600 "./$exe" )
          else
            ( cd build/bin && perl -e 'alarm shift; exec @ARGV' 600 "./$exe" )
          fi
          rc=$?

          if [ "$rc" -eq 0 ]; then
            echo "- \`$t\`: pass" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          else
            echo "- \`$t\`: **FAIL** (exit $rc)" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            echo "::error::$t failed with exit $rc"
          fi
          exit $rc
          RUNNER
          chmod +x run_test.sh
          echo "### ${{ env.JOB_NAME }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Test Requester
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_spdm_requester

      - name: Test Responder
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_spdm_responder

      - name: Test Common
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_spdm_common

      - name: Test SPDM Crypt
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_spdm_crypt

      - name: Test Crypt
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_crypt

      - name: Test Secured Message
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_spdm_secured_message

      # Extended unit test: runs only where its requirement is satisfied.
      - name: Test FIPS
        if: contains(matrix.extra_tests, 'test_spdm_fips')
        shell: bash
        run: ./run_test.sh test_spdm_fips

      # DISABLE_TESTS gates 87 test subdirectories, so this checks that nothing
      # test-shaped was produced, and that libraries still were -- otherwise an
      # empty build tree would satisfy the check vacuously.
      - name: Verify no tests were built
        if: matrix.expect_tests == 'false'
        shell: bash
        run: |
          # build/bin does not exist when tests are disabled. Redirecting find's
          # stderr hides the message but not its exit status, which pipefail
          # propagates and set -e turns into a silent step failure, so test for
          # the directory instead of relying on 2>/dev/null.
          if [ -d build/bin ]; then
            stray=$(find build/bin -maxdepth 1 -name 'test_*' | wc -l)
          else
            stray=0
          fi
          if [ -d build ]; then
            libs=$(find build -type f \( -name '*.a' -o -name '*.lib' \) | wc -l)
          else
            libs=0
          fi
          echo "DISABLE_TESTS check: $stray test artifacts under build/bin, $libs libraries built"
          {
            echo "### ${{ env.JOB_NAME }}"
            echo ""
            echo "DISABLE_TESTS: $stray test artifacts, $libs libraries"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$stray" -ne 0 ]; then
            echo "::error::DISABLE_TESTS was set but build/bin holds $stray test artifacts"
            exit 1
          fi
          if [ "$libs" -eq 0 ]; then
            echo "::error::DISABLE_TESTS build produced no libraries; the check would pass vacuously"
            exit 1
          fi
      # Reproducer, generated from the job's own variables so that it cannot
      # drift from what actually ran. The script restores the source tree but
      # not the toolchain, so the compiler identity is recorded in the header:
      # identical source can produce different diagnostics on different
      # compiler versions.
      - name: Generate reproducer
        if: always()
        shell: bash
        run: |
          mkdir -p repro

          # A failed configure leaves no build tree, and this step runs on
          # always(). "ls ... | head" exits non-zero there, which pipefail and
          # set -e turn into a silent step failure, losing the reproducer in
          # exactly the case that most needs one.
          ccfile=""
          if [ -d build/CMakeFiles ]; then
            ccfile=$(find build/CMakeFiles -name CMakeCCompiler.cmake -print -quit)
          fi
          cid=$(sed -n 's/^set(CMAKE_C_COMPILER_ID "\(.*\)")/\1/p' "$ccfile" 2>/dev/null || true)
          cver=$(sed -n 's/^set(CMAKE_C_COMPILER_VERSION "\(.*\)")/\1/p' "$ccfile" 2>/dev/null || true)
          compiler="${cid:-unknown} ${cver:-unknown}"
          image="${ImageOS:-unknown} ${ImageVersion:-unknown}"

          # The image label identifies the runner build, not what is actually
          # underneath it. Record the distro and kernel too, so a reader can
          # tell how far their machine differs from the one that failed.
          if [ -r /etc/os-release ]; then
            osname=$(grep -m1 '^PRETTY_NAME=' /etc/os-release | cut -d= -f2- | tr -d '"' || true)
          elif command -v sw_vers >/dev/null 2>&1; then
            osname="$(sw_vers -productName) $(sw_vers -productVersion)"
          else
            osname=$(cmd //c ver 2>/dev/null | tr -d '[:cntrl:]' | grep -m1 Windows || true)
          fi
          kernel=$(uname -srm 2>/dev/null)
          url="${{ github.server_url }}/${{ github.repository }}"
          run_url="$url/actions/runs/${{ github.run_id }}"

          # On a pull_request event github.sha is the ephemeral merge commit
          # under refs/pull/N/merge, which a plain clone does not fetch. Fetch
          # that ref explicitly so the script checks out what CI actually built.
          pr="${{ github.event.pull_request.number }}"
          if [ -n "$pr" ]; then
            fetch_ref="git fetch origin refs/pull/$pr/merge"
            checkout_ref="git checkout FETCH_HEAD"
          else
            fetch_ref=""
            checkout_ref="git checkout ${{ github.sha }}"
          fi

          # Informational: the checkout above already pins these, but recording
          # them lets a reader verify the tree is what the job built.
          pins=$(git submodule status 2>/dev/null | awk '{print $2" "$1}' || true)

          header="Reproduces: ${{ env.JOB_NAME }}
          Run:        $run_url
          Runner:     ${{ matrix.os }} (image $image)
          OS:         ${osname:-unknown}
          Kernel:     ${kernel:-unknown}
          Compiler:   $compiler
          NOTE: this restores the source tree, not the toolchain. If your
                compiler differs from the one above, a non-reproduction is
                inconclusive rather than a refutation."

          if [ "${{ runner.os }}" = "Windows" ] && [ -z "${{ matrix.shell }}" ]; then
            f=repro/repro.bat
            { echo "@echo off"
              echo "$header" | sed 's/^/REM /'
              echo "REM Run from a Visual Studio Developer Command Prompt for ${{ matrix.msvc_arch }}."
              echo
              echo "git clone $url.git libspdm-repro || exit /b 1"
              echo "cd libspdm-repro || exit /b 1"
              if [ -n "$fetch_ref" ]; then echo "$fetch_ref || exit /b 1"; fi
              echo "$checkout_ref || exit /b 1"
              echo "git submodule update --init --recursive unit_test/cmockalib/cmocka os_stub/mbedtlslib/mbedtls || exit /b 1"
              if [ "${{ matrix.crypto }}" = "openssl" ]; then
                echo "git submodule update --init --depth 1 os_stub/openssllib/openssl || exit /b 1"
              fi
              echo "$pins" | sed 's/^/REM pinned: /'
              echo
              if [ "${{ matrix.toolchain }}" = "CLANG" ]; then
                echo "set \"PATH=%ProgramFiles%\\LLVM\\bin;%PATH%\""
              fi
              echo "set CFLAGS=${{ env.BASE_CFLAGS }} ${{ matrix.cflags }}"
              echo "cmake -B build -G \"${{ matrix.generator }}\" -DARCH=${{ matrix.arch }} -DTOOLCHAIN=${{ matrix.toolchain }} -DTARGET=${{ matrix.target }} -DCRYPTO=${{ matrix.crypto }} ${{ matrix.cmake_extra }} || exit /b 1"
              echo "cmake --build build --target copy_sample_key"
              echo "cmake --build build || exit /b 1"
              echo
              echo "cd build\\bin"
              for t in $UNIT_TESTS ${{ matrix.extra_tests }}; do echo "if exist $t.exe $t.exe"; done
            } > "$f"
          else
            f=repro/repro.sh
            { echo "#!/usr/bin/env bash"
              echo "$header" | sed 's/^/# /'
              if [ -n "${{ matrix.shell }}" ]; then
                echo "# Run inside an MSYS2 MINGW64 shell."
              fi
              echo "set -euo pipefail"
              echo
              echo "git clone $url.git libspdm-repro"
              echo "cd libspdm-repro"
              if [ -n "$fetch_ref" ]; then echo "$fetch_ref"; fi
              echo "$checkout_ref"
              echo "git submodule update --init --recursive unit_test/cmockalib/cmocka os_stub/mbedtlslib/mbedtls"
              if [ "${{ matrix.crypto }}" = "openssl" ]; then
                echo "git submodule update --init --depth 1 os_stub/openssllib/openssl"
              fi
              echo "$pins" | sed 's/^/# pinned: /'
              echo
              echo "export CFLAGS='${{ env.BASE_CFLAGS }} ${{ matrix.cflags }}'"
              if [ -n "${{ matrix.generator }}" ]; then
                echo "cmake -B build -G \"${{ matrix.generator }}\" -DARCH=${{ matrix.arch }} -DTOOLCHAIN=${{ matrix.toolchain }} -DTARGET=${{ matrix.target }} -DCRYPTO=${{ matrix.crypto }} ${{ matrix.cmake_extra }}"
              else
                echo "cmake -B build -DARCH=${{ matrix.arch }} -DTOOLCHAIN=${{ matrix.toolchain }} -DTARGET=${{ matrix.target }} -DCRYPTO=${{ matrix.crypto }} ${{ matrix.cmake_extra }}"
              fi
              echo "cmake --build build --target copy_sample_key"
              echo "cmake --build build --parallel \"\$(getconf _NPROCESSORS_ONLN)\""
              echo
              echo "cd build/bin"
              for t in $UNIT_TESTS ${{ matrix.extra_tests }}; do echo "if [ -x ./$t ]; then ./$t; fi"; done
            } > "$f"
            chmod +x "$f"
          fi

          # The step log is the first place anyone looks, and unlike the job
          # summary it is reachable from the API, so echo the platform
          # identity there too.
          echo "$header"

          # Legibility for every run, not just failures: the invocation is
          # visible in the UI without downloading anything.
          { echo "<details><summary>Reproducer</summary>"
            echo
            echo '```'
            cat "$f"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reproducer
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: repro-${{ env.JOB_NAME }}
          path: |
            repro/
            build/CMakeCache.txt
          retention-days: 14

  # Single required status check, so branch protection does not have to
  # enumerate every matrix job.

  mingw:
    name: ${{ format('windows-{0}-mingw-{1}-{2}', matrix.arch, matrix.crypto, matrix.tgt) }}
    if: github.repository == 'DMTF/libspdm' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      JOB_NAME: ${{ format('windows-{0}-mingw-{1}-{2}', matrix.arch, matrix.crypto, matrix.tgt) }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        arch: [x64, ia32]
        crypto: [mbedtls, openssl]
        target: [Debug, Release]
        include:
          - {os: windows-latest, toolchain: GCC, shell: 'msys2 {0}', generator: MSYS Makefiles}
          # The MSYS2 environment for each architecture.
          - {arch: x64, msystem: MINGW64, mingw_prefix: /mingw64}
          - {arch: ia32, msystem: MINGW32, mingw_prefix: /mingw32}
          # Lower-case spellings for the job name.
          - {target: Debug, tgt: debug}
          - {target: Release, tgt: release}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The submodules are fetched in a later step so that cmocka can be served
          # from the cache. A fetch failure inside this step aborts the job before
          # any cache is consulted, which is what makes cmocka's host a source of
          # unrelated test failures.
          submodules: false
          # Nothing after this step needs to talk to the remote, and the jobs
          # run build scripts from the pull request's own tree.
          persist-credentials: false

      # cmocka is the only submodule not hosted on github.com, and gitlab.com is
      # reachable less reliably from the runners. Its source does not vary by
      # configuration, so a single entry keyed on the pinned revision serves every
      # matrix entry, and gitlab.com is contacted only when that pin moves.
      - name: cmocka revision
        id: cmocka
        shell: bash
        run: |
          echo "sha=$(git ls-tree HEAD unit_test/cmockalib/cmocka | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: Cache cmocka
        id: cmocka-cache
        uses: actions/cache@v6
        with:
          path: unit_test/cmockalib/cmocka
          key: cmocka-${{ steps.cmocka.outputs.sha }}

      - name: Fetch submodules
        shell: bash
        run: |
          # Retry rather than fail the job on a transient fetch error. A cache hit
          # means cmocka is already present, so it is not fetched at all.
          fetch() {
            local path=$1
            shift
            for attempt in 1 2 3; do
              if git submodule update --init "$@" "$path"; then
                return 0
              fi
              echo "fetch of $path failed, attempt $attempt"
              sleep $((attempt * 15))
            done
            return 1
          }

          if [ "${{ steps.cmocka-cache.outputs.cache-hit }}" != "true" ]; then
            fetch unit_test/cmockalib/cmocka --recursive
          fi
          fetch os_stub/mbedtlslib/mbedtls --recursive
          # libspdm builds OpenSSL from the pinned commit's source alone, so
          # neither its history nor its own submodules are fetched.
          if [ "${{ matrix.crypto }}" = "openssl" ]; then
            fetch os_stub/openssllib/openssl --depth 1
          fi

      - name: Set up MSYS2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: git make
          pacboy: toolchain:p cmake:p make:p

      # OpenSSL is an ExternalProject with its own CFLAGS, so no LIBSPDM_*
      # macro reaches it: one entry serves every configuration on a given
      # platform. Measured at ~100 MB on POSIX and ~344 MB on Windows, so
      # caching the tree wholesale is affordable and avoids maintaining a
      # list of which paths have consumers -- the Windows DLL lives in the
      # build tree, not the install tree, which such a list would miss.
      - name: OpenSSL revision
        id: ossl
        shell: bash
        run: |
          echo "sha=$(git -C os_stub/openssllib/openssl rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # MSYS2 installs MinGW's GCC when the job runs, so the runner image says
      # nothing about the compiler that builds OpenSSL. Record that compiler
      # instead. GITHUB_OUTPUT is a Windows path, which cygpath converts.
      - name: MinGW compiler
        id: mingw_cc
        shell: 'msys2 {0}'
        run: |
          echo "version=gcc-$(gcc -dumpfullversion)" >> "$(cygpath -u "$GITHUB_OUTPUT")"

      # The key names the compiler that builds OpenSSL, so it changes only
      # when the OpenSSL revision or MinGW's GCC does. Both need a rebuild,
      # so there is no fallback to restore. The key omits TARGET and the
      # macros because neither changes what OpenSSL builds.
      - name: Cache OpenSSL build
        if: matrix.crypto == 'openssl'
        uses: actions/cache@v6
        with:
          path: build/os_stub/openssllib
          key: openssl-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.toolchain }}-${{ steps.ossl.outputs.sha }}-${{ steps.mingw_cc.outputs.version }}

      # MinGW needs the MSYS2 shell for its toolchain and the MSYS generator.
      # `shell:` cannot reference the matrix context, so these are separate
      # steps rather than a matrix-driven shell.
      - name: Configure (MinGW)
        shell: 'msys2 {0}'
        env:
          CFLAGS: ${{ env.BASE_CFLAGS }} ${{ matrix.cflags }}
        run: |
          cmake -B build -G "${{ matrix.generator }}" \
            -DARCH=${{ matrix.arch }} \
            -DTOOLCHAIN=${{ matrix.toolchain }} \
            -DTARGET=${{ matrix.target }} \
            -DCRYPTO=${{ matrix.crypto }} \
            ${{ matrix.cmake_extra }}

      - name: Build (MinGW)
        shell: 'msys2 {0}'
        run: |
          jobs=$(nproc 2>/dev/null || echo 2)
          echo "Building with --parallel $jobs"
          cmake --build build --target copy_sample_key
          cmake --build build --parallel "$jobs"
          # The test step runs under Git Bash, which needs the MinGW runtime
          # DLLs on PATH to launch binaries this toolchain produced.
          # $GITHUB_PATH is a Windows path, so convert it for the MSYS2 shell.
          cygpath -w ${{ matrix.mingw_prefix }}/bin >> "$(cygpath -u "$GITHUB_PATH")"

      # Implements "For any configuration, run all basic unit tests", plus any
      # extended unit test whose requirement this configuration satisfies.
      # Each test is bounded so a hang fails the job instead of stalling it.
      # One step per test, so the Actions UI shows a separate pass/fail entry
      # for each. A single looping step buries later tests below the log
      # viewer's truncation point. The shared runner keeps the binary lookup
      # and the timeout guard in one place rather than in six copies.
      - name: Prepare test runner
        if: matrix.expect_tests != 'false'
        shell: bash
        run: |
          cat > run_test.sh <<'RUNNER'
          #!/usr/bin/env bash
          set -uo pipefail
          t="$1"

          exe=""
          if [ -x "build/bin/$t" ]; then
            exe="$t"
          elif [ -x "build/bin/$t.exe" ]; then
            exe="$t.exe"
          fi

          # Basic unit tests require no additional configuration, so a missing
          # one means coverage was lost rather than legitimately skipped.
          if [ -z "$exe" ]; then
            echo "::error::$t was not built"
            echo "- \`$t\`: **not built**" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 1
          fi

          # macOS has no GNU timeout; fall back to gtimeout, then to perl.
          if command -v timeout >/dev/null 2>&1; then
            ( cd build/bin && timeout 600 "./$exe" )
          elif command -v gtimeout >/dev/null 2>&1; then
            ( cd build/bin && gtimeout 600 "./$exe" )
          else
            ( cd build/bin && perl -e 'alarm shift; exec @ARGV' 600 "./$exe" )
          fi
          rc=$?

          if [ "$rc" -eq 0 ]; then
            echo "- \`$t\`: pass" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          else
            echo "- \`$t\`: **FAIL** (exit $rc)" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            echo "::error::$t failed with exit $rc"
          fi
          exit $rc
          RUNNER
          chmod +x run_test.sh
          echo "### ${{ env.JOB_NAME }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Test Requester
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_spdm_requester

      - name: Test Responder
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_spdm_responder

      - name: Test Common
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_spdm_common

      - name: Test SPDM Crypt
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_spdm_crypt

      - name: Test Crypt
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_crypt

      - name: Test Secured Message
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_spdm_secured_message

      # Extended unit test: runs only where its requirement is satisfied.
      - name: Test FIPS
        if: contains(matrix.extra_tests, 'test_spdm_fips')
        shell: bash
        run: ./run_test.sh test_spdm_fips

      # DISABLE_TESTS gates 87 test subdirectories, so this checks that nothing
      # test-shaped was produced, and that libraries still were -- otherwise an
      # empty build tree would satisfy the check vacuously.
      - name: Verify no tests were built
        if: matrix.expect_tests == 'false'
        shell: bash
        run: |
          # build/bin does not exist when tests are disabled. Redirecting find's
          # stderr hides the message but not its exit status, which pipefail
          # propagates and set -e turns into a silent step failure, so test for
          # the directory instead of relying on 2>/dev/null.
          if [ -d build/bin ]; then
            stray=$(find build/bin -maxdepth 1 -name 'test_*' | wc -l)
          else
            stray=0
          fi
          if [ -d build ]; then
            libs=$(find build -type f \( -name '*.a' -o -name '*.lib' \) | wc -l)
          else
            libs=0
          fi
          echo "DISABLE_TESTS check: $stray test artifacts under build/bin, $libs libraries built"
          {
            echo "### ${{ env.JOB_NAME }}"
            echo ""
            echo "DISABLE_TESTS: $stray test artifacts, $libs libraries"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$stray" -ne 0 ]; then
            echo "::error::DISABLE_TESTS was set but build/bin holds $stray test artifacts"
            exit 1
          fi
          if [ "$libs" -eq 0 ]; then
            echo "::error::DISABLE_TESTS build produced no libraries; the check would pass vacuously"
            exit 1
          fi
      # Reproducer, generated from the job's own variables so that it cannot
      # drift from what actually ran. The script restores the source tree but
      # not the toolchain, so the compiler identity is recorded in the header:
      # identical source can produce different diagnostics on different
      # compiler versions.
      - name: Generate reproducer
        if: always()
        shell: bash
        run: |
          mkdir -p repro

          # A failed configure leaves no build tree, and this step runs on
          # always(). "ls ... | head" exits non-zero there, which pipefail and
          # set -e turn into a silent step failure, losing the reproducer in
          # exactly the case that most needs one.
          ccfile=""
          if [ -d build/CMakeFiles ]; then
            ccfile=$(find build/CMakeFiles -name CMakeCCompiler.cmake -print -quit)
          fi
          cid=$(sed -n 's/^set(CMAKE_C_COMPILER_ID "\(.*\)")/\1/p' "$ccfile" 2>/dev/null || true)
          cver=$(sed -n 's/^set(CMAKE_C_COMPILER_VERSION "\(.*\)")/\1/p' "$ccfile" 2>/dev/null || true)
          compiler="${cid:-unknown} ${cver:-unknown}"
          image="${ImageOS:-unknown} ${ImageVersion:-unknown}"

          # The image label identifies the runner build, not what is actually
          # underneath it. Record the distro and kernel too, so a reader can
          # tell how far their machine differs from the one that failed.
          if [ -r /etc/os-release ]; then
            osname=$(grep -m1 '^PRETTY_NAME=' /etc/os-release | cut -d= -f2- | tr -d '"' || true)
          elif command -v sw_vers >/dev/null 2>&1; then
            osname="$(sw_vers -productName) $(sw_vers -productVersion)"
          else
            osname=$(cmd //c ver 2>/dev/null | tr -d '[:cntrl:]' | grep -m1 Windows || true)
          fi
          kernel=$(uname -srm 2>/dev/null)
          url="${{ github.server_url }}/${{ github.repository }}"
          run_url="$url/actions/runs/${{ github.run_id }}"

          # On a pull_request event github.sha is the ephemeral merge commit
          # under refs/pull/N/merge, which a plain clone does not fetch. Fetch
          # that ref explicitly so the script checks out what CI actually built.
          pr="${{ github.event.pull_request.number }}"
          if [ -n "$pr" ]; then
            fetch_ref="git fetch origin refs/pull/$pr/merge"
            checkout_ref="git checkout FETCH_HEAD"
          else
            fetch_ref=""
            checkout_ref="git checkout ${{ github.sha }}"
          fi

          # Informational: the checkout above already pins these, but recording
          # them lets a reader verify the tree is what the job built.
          pins=$(git submodule status 2>/dev/null | awk '{print $2" "$1}' || true)

          header="Reproduces: ${{ env.JOB_NAME }}
          Run:        $run_url
          Runner:     ${{ matrix.os }} (image $image)
          OS:         ${osname:-unknown}
          Kernel:     ${kernel:-unknown}
          Compiler:   $compiler
          NOTE: this restores the source tree, not the toolchain. If your
                compiler differs from the one above, a non-reproduction is
                inconclusive rather than a refutation."

          if [ "${{ runner.os }}" = "Windows" ] && [ -z "${{ matrix.shell }}" ]; then
            f=repro/repro.bat
            { echo "@echo off"
              echo "$header" | sed 's/^/REM /'
              echo "REM Run from a Visual Studio Developer Command Prompt for ${{ matrix.msvc_arch }}."
              echo
              echo "git clone $url.git libspdm-repro || exit /b 1"
              echo "cd libspdm-repro || exit /b 1"
              if [ -n "$fetch_ref" ]; then echo "$fetch_ref || exit /b 1"; fi
              echo "$checkout_ref || exit /b 1"
              echo "git submodule update --init --recursive unit_test/cmockalib/cmocka os_stub/mbedtlslib/mbedtls || exit /b 1"
              if [ "${{ matrix.crypto }}" = "openssl" ]; then
                echo "git submodule update --init --depth 1 os_stub/openssllib/openssl || exit /b 1"
              fi
              echo "$pins" | sed 's/^/REM pinned: /'
              echo
              if [ "${{ matrix.toolchain }}" = "CLANG" ]; then
                echo "set \"PATH=%ProgramFiles%\\LLVM\\bin;%PATH%\""
              fi
              echo "set CFLAGS=${{ env.BASE_CFLAGS }} ${{ matrix.cflags }}"
              echo "cmake -B build -G \"${{ matrix.generator }}\" -DARCH=${{ matrix.arch }} -DTOOLCHAIN=${{ matrix.toolchain }} -DTARGET=${{ matrix.target }} -DCRYPTO=${{ matrix.crypto }} ${{ matrix.cmake_extra }} || exit /b 1"
              echo "cmake --build build --target copy_sample_key"
              echo "cmake --build build || exit /b 1"
              echo
              echo "cd build\\bin"
              for t in $UNIT_TESTS ${{ matrix.extra_tests }}; do echo "if exist $t.exe $t.exe"; done
            } > "$f"
          else
            f=repro/repro.sh
            { echo "#!/usr/bin/env bash"
              echo "$header" | sed 's/^/# /'
              if [ -n "${{ matrix.shell }}" ]; then
                echo "# Run inside an MSYS2 ${{ matrix.msystem }} shell."
              fi
              echo "set -euo pipefail"
              echo
              echo "git clone $url.git libspdm-repro"
              echo "cd libspdm-repro"
              if [ -n "$fetch_ref" ]; then echo "$fetch_ref"; fi
              echo "$checkout_ref"
              echo "git submodule update --init --recursive unit_test/cmockalib/cmocka os_stub/mbedtlslib/mbedtls"
              if [ "${{ matrix.crypto }}" = "openssl" ]; then
                echo "git submodule update --init --depth 1 os_stub/openssllib/openssl"
              fi
              echo "$pins" | sed 's/^/# pinned: /'
              echo
              echo "export CFLAGS='${{ env.BASE_CFLAGS }} ${{ matrix.cflags }}'"
              if [ -n "${{ matrix.generator }}" ]; then
                echo "cmake -B build -G \"${{ matrix.generator }}\" -DARCH=${{ matrix.arch }} -DTOOLCHAIN=${{ matrix.toolchain }} -DTARGET=${{ matrix.target }} -DCRYPTO=${{ matrix.crypto }} ${{ matrix.cmake_extra }}"
              else
                echo "cmake -B build -DARCH=${{ matrix.arch }} -DTOOLCHAIN=${{ matrix.toolchain }} -DTARGET=${{ matrix.target }} -DCRYPTO=${{ matrix.crypto }} ${{ matrix.cmake_extra }}"
              fi
              echo "cmake --build build --target copy_sample_key"
              echo "cmake --build build --parallel \"\$(getconf _NPROCESSORS_ONLN)\""
              echo
              echo "cd build/bin"
              for t in $UNIT_TESTS ${{ matrix.extra_tests }}; do echo "if [ -x ./$t ]; then ./$t; fi"; done
            } > "$f"
            chmod +x "$f"
          fi

          # The step log is the first place anyone looks, and unlike the job
          # summary it is reachable from the API, so echo the platform
          # identity there too.
          echo "$header"

          # Legibility for every run, not just failures: the invocation is
          # visible in the UI without downloading anything.
          { echo "<details><summary>Reproducer</summary>"
            echo
            echo '```'
            cat "$f"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reproducer
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: repro-${{ env.JOB_NAME }}
          path: |
            repro/
            build/CMakeCache.txt
          retention-days: 14

  # Implements the code configuration sweeps of "Tier 2 - Daily Coverage":
  # finer-grained macro values under ASan and UBSan, on the document's reference
  # platform, Linux x64. MSan is not run yet. Only the unit tests are built, as
  # the test_size images link with -nostdlib and cannot carry a sanitizer
  # runtime.
  #
  # Tier 1 runs its configurations without sanitizers, so the ten of them that
  # build tests are swept here too. Three configurations are left out until they
  # pass:
  #   config-cert-parse-off   does not build (#3909).
  #   config-version-count-1  fails version negotiation (#4091).
  #   config-psk-only         the unit tests assume a signing algorithm.
  configs:
    name: ${{ matrix.name }}
    if: github.repository == 'DMTF/libspdm' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JOB_NAME: ${{ matrix.name }}
      # Alignment checks stay off until #3852 is fixed, since its misaligned
      # session ID loads would fail every job.
      SAN_CFLAGS: -fsanitize=address,undefined -fno-sanitize=alignment -fno-omit-frame-pointer
      SAN_LDFLAGS: -fsanitize=address,undefined
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          # == Tier 1's configurations =====================================

          - name: config-fips
            cflags: -DLIBSPDM_FIPS_MODE=1
            extra_tests: test_spdm_fips

          - name: config-fips-openssl
            crypto: openssl
            cflags: -DLIBSPDM_FIPS_MODE=1
            extra_tests: test_spdm_fips

          - name: config-respond-if-ready-off
            cflags: -DLIBSPDM_RESPOND_IF_READY_SUPPORT=0

          - name: config-msg-log-off
            cflags: -DLIBSPDM_ENABLE_MSG_LOG=0

          - name: config-record-transcript
            cflags: -DLIBSPDM_RECORD_TRANSCRIPT_DATA_SUPPORT=1

          - name: config-minimal-caps
            cflags: >-
              -DLIBSPDM_ENABLE_CAPABILITY_PSK_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_HBEAT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_MUT_AUTH_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_ENCAP_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_CSR_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_SET_CERT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_CHUNK_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_MEL_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_EVENT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_GET_KEY_PAIR_INFO_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_SET_KEY_PAIR_INFO_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_ENDPOINT_INFO_CAP=0
              -DLIBSPDM_EVENT_RECIPIENT_SUPPORT=0
              -DLIBSPDM_SEND_GET_ENDPOINT_INFO_SUPPORT=0

          - name: config-x509-relaxed
            cmake_extra: -DX509_IGNORE_TIME=ON -DX509_IGNORE_CRITICAL=ON

          # Compiles every object as position-independent code, the test
          # binaries' included.
          - name: config-shared-lib
            cmake_extra: -DBUILD_LINUX_SHARED_LIB=ON

          - name: config-classical-crypto
            crypto: openssl
            cflags: >-
              -DLIBSPDM_ML_DSA_44_SUPPORT=0 -DLIBSPDM_ML_DSA_65_SUPPORT=0 -DLIBSPDM_ML_DSA_87_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_128S_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_128S_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_128F_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_128F_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_192S_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_192S_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_192F_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_192F_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_256S_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_256S_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_256F_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_256F_SUPPORT=0
              -DLIBSPDM_ML_KEM_512_SUPPORT=0 -DLIBSPDM_ML_KEM_768_SUPPORT=0 -DLIBSPDM_ML_KEM_1024_SUPPORT=0

          - name: config-binary-build
            crypto: openssl
            openssl_binary: 'true'
            cmake_extra: -DBUILD_LINUX_SHARED_LIB=ON

          # == The defaults ================================================
          # The platform jobs run the defaults without sanitizers.

          - name: config-defaults

          - name: config-defaults-openssl
            crypto: openssl

          - name: config-defaults-release
            target: Release

          # == One capability off ==========================================
          # Where the macro check requires another macro off with it, that
          # one is off too.

          - name: config-cert-off
            cflags: -DLIBSPDM_ENABLE_CAPABILITY_CERT_CAP=0

          - name: config-chal-off
            cflags: -DLIBSPDM_ENABLE_CAPABILITY_CHAL_CAP=0

          - name: config-meas-off
            cflags: -DLIBSPDM_ENABLE_CAPABILITY_MEAS_CAP=0

          - name: config-key-ex-off
            cflags: >-
              -DLIBSPDM_ENABLE_CAPABILITY_KEY_EX_CAP=0
              -DLIBSPDM_FFDHE_2048_SUPPORT=0 -DLIBSPDM_FFDHE_3072_SUPPORT=0 -DLIBSPDM_FFDHE_4096_SUPPORT=0
              -DLIBSPDM_ECDHE_P256_SUPPORT=0 -DLIBSPDM_ECDHE_P384_SUPPORT=0 -DLIBSPDM_ECDHE_P521_SUPPORT=0

          - name: config-psk-off
            cflags: -DLIBSPDM_ENABLE_CAPABILITY_PSK_CAP=0

          - name: config-hbeat-off
            cflags: -DLIBSPDM_ENABLE_CAPABILITY_HBEAT_CAP=0

          - name: config-mut-auth-off
            cflags: -DLIBSPDM_ENABLE_CAPABILITY_MUT_AUTH_CAP=0

          - name: config-encap-off
            cflags: -DLIBSPDM_ENABLE_CAPABILITY_ENCAP_CAP=0 -DLIBSPDM_EVENT_RECIPIENT_SUPPORT=0

          - name: config-csr-off
            cflags: -DLIBSPDM_ENABLE_CAPABILITY_CSR_CAP=0

          - name: config-set-cert-off
            cflags: -DLIBSPDM_ENABLE_CAPABILITY_SET_CERT_CAP=0

          - name: config-chunk-off
            cflags: -DLIBSPDM_ENABLE_CAPABILITY_CHUNK_CAP=0

          - name: config-mel-off
            cflags: -DLIBSPDM_ENABLE_CAPABILITY_MEL_CAP=0

          - name: config-event-off
            cflags: -DLIBSPDM_ENABLE_CAPABILITY_EVENT_CAP=0

          - name: config-get-key-pair-info-off
            cflags: >-
              -DLIBSPDM_ENABLE_CAPABILITY_GET_KEY_PAIR_INFO_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_SET_KEY_PAIR_INFO_CAP=0

          - name: config-set-key-pair-info-off
            cflags: -DLIBSPDM_ENABLE_CAPABILITY_SET_KEY_PAIR_INFO_CAP=0

          - name: config-endpoint-info-off
            cflags: -DLIBSPDM_ENABLE_CAPABILITY_ENDPOINT_INFO_CAP=0

          - name: config-vendor-defined-off
            cflags: -DLIBSPDM_ENABLE_VENDOR_DEFINED_MESSAGES=0

          # == One Requester send option off ===============================
          # Each also removes the encapsulated flows that send the request.

          - name: config-send-get-certificate-off
            cflags: -DLIBSPDM_SEND_GET_CERTIFICATE_SUPPORT=0

          - name: config-send-challenge-off
            cflags: -DLIBSPDM_SEND_CHALLENGE_SUPPORT=0

          - name: config-event-recipient-off
            cflags: -DLIBSPDM_EVENT_RECIPIENT_SUPPORT=0

          - name: config-send-get-endpoint-info-off
            cflags: -DLIBSPDM_SEND_GET_ENDPOINT_INFO_SUPPORT=0

          # == Other toggles ===============================================

          - name: config-check-context-off
            cflags: -DLIBSPDM_CHECK_SPDM_CONTEXT=0

          # LIBSPDM_DEBUG_ENABLE overrides the three debug switches whenever
          # it is defined, so no_debug_enable removes its default from
          # spdm_lib_config.h.
          - name: config-debug-print-only
            no_debug_enable: 'true'
            cflags: >-
              -DLIBSPDM_DEBUG_PRINT_ENABLE=1 -DLIBSPDM_DEBUG_ASSERT_ENABLE=0
              -DLIBSPDM_DEBUG_BLOCK_ENABLE=0

          - name: config-debug-assert-only
            no_debug_enable: 'true'
            cflags: >-
              -DLIBSPDM_DEBUG_PRINT_ENABLE=0 -DLIBSPDM_DEBUG_ASSERT_ENABLE=1
              -DLIBSPDM_DEBUG_BLOCK_ENABLE=0

          # == Algorithm families off ======================================
          # The unit tests negotiate RSASSA-2048, ECDSA P-256, ECDHE P-256,
          # AES-256-GCM, SHA-256 and SHA-384, so those stay on. Mbed TLS pins
          # EdDSA, SM2, SM3 and the PQC algorithms off, so those candidates
          # run against OpenSSL.

          - name: config-rsa-ssa-3072-4096-off
            cflags: -DLIBSPDM_RSA_SSA_3072_SUPPORT=0 -DLIBSPDM_RSA_SSA_4096_SUPPORT=0

          - name: config-rsa-pss-off
            cflags: >-
              -DLIBSPDM_RSA_PSS_2048_SUPPORT=0 -DLIBSPDM_RSA_PSS_3072_SUPPORT=0
              -DLIBSPDM_RSA_PSS_4096_SUPPORT=0

          - name: config-ecdsa-p384-p521-off
            cflags: -DLIBSPDM_ECDSA_P384_SUPPORT=0 -DLIBSPDM_ECDSA_P521_SUPPORT=0

          - name: config-ffdhe-off
            cflags: >-
              -DLIBSPDM_FFDHE_2048_SUPPORT=0 -DLIBSPDM_FFDHE_3072_SUPPORT=0
              -DLIBSPDM_FFDHE_4096_SUPPORT=0

          - name: config-ecdhe-p384-p521-off
            cflags: -DLIBSPDM_ECDHE_P384_SUPPORT=0 -DLIBSPDM_ECDHE_P521_SUPPORT=0

          - name: config-aes-128-gcm-off
            cflags: -DLIBSPDM_AEAD_AES_128_GCM_SUPPORT=0

          - name: config-chacha20-poly1305-off
            cflags: -DLIBSPDM_AEAD_CHACHA20_POLY1305_SUPPORT=0

          - name: config-sha512-off
            cflags: -DLIBSPDM_SHA512_SUPPORT=0

          - name: config-sha3-off
            cflags: >-
              -DLIBSPDM_SHA3_256_SUPPORT=0 -DLIBSPDM_SHA3_384_SUPPORT=0
              -DLIBSPDM_SHA3_512_SUPPORT=0

          # Every algorithm the unit tests do not negotiate, which also makes
          # the derived buffer sizes as small as the tests allow.
          - name: config-test-algorithms-only
            cflags: >-
              -DLIBSPDM_RSA_SSA_3072_SUPPORT=0 -DLIBSPDM_RSA_SSA_4096_SUPPORT=0
              -DLIBSPDM_RSA_PSS_2048_SUPPORT=0 -DLIBSPDM_RSA_PSS_3072_SUPPORT=0 -DLIBSPDM_RSA_PSS_4096_SUPPORT=0
              -DLIBSPDM_ECDSA_P384_SUPPORT=0 -DLIBSPDM_ECDSA_P521_SUPPORT=0
              -DLIBSPDM_FFDHE_2048_SUPPORT=0 -DLIBSPDM_FFDHE_3072_SUPPORT=0 -DLIBSPDM_FFDHE_4096_SUPPORT=0
              -DLIBSPDM_ECDHE_P384_SUPPORT=0 -DLIBSPDM_ECDHE_P521_SUPPORT=0
              -DLIBSPDM_AEAD_AES_128_GCM_SUPPORT=0 -DLIBSPDM_AEAD_CHACHA20_POLY1305_SUPPORT=0
              -DLIBSPDM_SHA512_SUPPORT=0
              -DLIBSPDM_SHA3_256_SUPPORT=0 -DLIBSPDM_SHA3_384_SUPPORT=0 -DLIBSPDM_SHA3_512_SUPPORT=0

          - name: config-eddsa-off
            crypto: openssl
            cflags: -DLIBSPDM_EDDSA_ED25519_SUPPORT=0 -DLIBSPDM_EDDSA_ED448_SUPPORT=0

          - name: config-sm2-dsa-off
            crypto: openssl
            cflags: -DLIBSPDM_SM2_DSA_P256_SUPPORT=0

          - name: config-sm3-off
            crypto: openssl
            cflags: -DLIBSPDM_SM3_256_SUPPORT=0

          - name: config-ml-dsa-off
            crypto: openssl
            cflags: >-
              -DLIBSPDM_ML_DSA_44_SUPPORT=0 -DLIBSPDM_ML_DSA_65_SUPPORT=0
              -DLIBSPDM_ML_DSA_87_SUPPORT=0

          - name: config-slh-dsa-off
            crypto: openssl
            cflags: >-
              -DLIBSPDM_SLH_DSA_SHA2_128S_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_128S_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_128F_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_128F_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_192S_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_192S_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_192F_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_192F_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_256S_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_256S_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_256F_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_256F_SUPPORT=0

          - name: config-ml-kem-off
            crypto: openssl
            cflags: >-
              -DLIBSPDM_ML_KEM_512_SUPPORT=0 -DLIBSPDM_ML_KEM_768_SUPPORT=0
              -DLIBSPDM_ML_KEM_1024_SUPPORT=0

          - name: config-test-algorithms-only-openssl
            crypto: openssl
            cflags: >-
              -DLIBSPDM_RSA_SSA_3072_SUPPORT=0 -DLIBSPDM_RSA_SSA_4096_SUPPORT=0
              -DLIBSPDM_RSA_PSS_2048_SUPPORT=0 -DLIBSPDM_RSA_PSS_3072_SUPPORT=0 -DLIBSPDM_RSA_PSS_4096_SUPPORT=0
              -DLIBSPDM_ECDSA_P384_SUPPORT=0 -DLIBSPDM_ECDSA_P521_SUPPORT=0
              -DLIBSPDM_SM2_DSA_P256_SUPPORT=0
              -DLIBSPDM_EDDSA_ED25519_SUPPORT=0 -DLIBSPDM_EDDSA_ED448_SUPPORT=0
              -DLIBSPDM_FFDHE_2048_SUPPORT=0 -DLIBSPDM_FFDHE_3072_SUPPORT=0 -DLIBSPDM_FFDHE_4096_SUPPORT=0
              -DLIBSPDM_ECDHE_P384_SUPPORT=0 -DLIBSPDM_ECDHE_P521_SUPPORT=0
              -DLIBSPDM_AEAD_AES_128_GCM_SUPPORT=0 -DLIBSPDM_AEAD_CHACHA20_POLY1305_SUPPORT=0
              -DLIBSPDM_SHA512_SUPPORT=0
              -DLIBSPDM_SHA3_256_SUPPORT=0 -DLIBSPDM_SHA3_384_SUPPORT=0 -DLIBSPDM_SHA3_512_SUPPORT=0
              -DLIBSPDM_SM3_256_SUPPORT=0
              -DLIBSPDM_ML_DSA_44_SUPPORT=0 -DLIBSPDM_ML_DSA_65_SUPPORT=0 -DLIBSPDM_ML_DSA_87_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_128S_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_128S_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_128F_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_128F_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_192S_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_192S_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_192F_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_192F_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_256S_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_256S_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_256F_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_256F_SUPPORT=0
              -DLIBSPDM_ML_KEM_512_SUPPORT=0 -DLIBSPDM_ML_KEM_768_SUPPORT=0 -DLIBSPDM_ML_KEM_1024_SUPPORT=0

          # The PQC algorithms as the only signature and key exchange
          # algorithms. The unit tests negotiate ECDSA, so only the library is
          # built.
          - name: config-pqc-only
            crypto: openssl
            cflags: >-
              -DLIBSPDM_RSA_SSA_2048_SUPPORT=0 -DLIBSPDM_RSA_SSA_3072_SUPPORT=0 -DLIBSPDM_RSA_SSA_4096_SUPPORT=0
              -DLIBSPDM_RSA_PSS_2048_SUPPORT=0 -DLIBSPDM_RSA_PSS_3072_SUPPORT=0 -DLIBSPDM_RSA_PSS_4096_SUPPORT=0
              -DLIBSPDM_ECDSA_P256_SUPPORT=0 -DLIBSPDM_ECDSA_P384_SUPPORT=0 -DLIBSPDM_ECDSA_P521_SUPPORT=0
              -DLIBSPDM_SM2_DSA_P256_SUPPORT=0
              -DLIBSPDM_EDDSA_ED25519_SUPPORT=0 -DLIBSPDM_EDDSA_ED448_SUPPORT=0
              -DLIBSPDM_FFDHE_2048_SUPPORT=0 -DLIBSPDM_FFDHE_3072_SUPPORT=0 -DLIBSPDM_FFDHE_4096_SUPPORT=0
              -DLIBSPDM_ECDHE_P256_SUPPORT=0 -DLIBSPDM_ECDHE_P384_SUPPORT=0 -DLIBSPDM_ECDHE_P521_SUPPORT=0
            cmake_extra: -DDISABLE_TESTS=1
            expect_tests: 'false'

          # == Sizes =======================================================

          - name: config-version-count-255
            cflags: -DLIBSPDM_MAX_VERSION_COUNT=255

          - name: config-session-count-1
            cflags: -DLIBSPDM_MAX_SESSION_COUNT=1

          # More session slots than an 8-bit index can address.
          - name: config-session-count-256
            cflags: -DLIBSPDM_MAX_SESSION_COUNT=256

          - name: config-root-cert-1
            cflags: -DLIBSPDM_MAX_ROOT_CERT_SUPPORT=1

          # More trust anchors than an 8-bit index can address.
          - name: config-root-cert-256
            cflags: -DLIBSPDM_MAX_ROOT_CERT_SUPPORT=256

          # The smallest RequesterContext that spdm_lib_config.h allows.
          - name: config-psk-context-32
            cflags: -DLIBSPDM_PSK_CONTEXT_LENGTH=32

          # SLH-DSA makes LIBSPDM_MAX_CERT_CHAIN_SIZE largest with OpenSSL,
          # and the transcript buffers with it.
          - name: config-record-transcript-openssl
            crypto: openssl
            cflags: -DLIBSPDM_RECORD_TRANSCRIPT_DATA_SUPPORT=1

          # == Profiles ====================================================

          # Certificates, CHALLENGE and measurements without secure sessions.
          - name: config-attestation-only
            cflags: >-
              -DLIBSPDM_ENABLE_CAPABILITY_KEY_EX_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_PSK_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_HBEAT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_MUT_AUTH_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_ENCAP_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_CSR_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_SET_CERT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_EVENT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_GET_KEY_PAIR_INFO_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_SET_KEY_PAIR_INFO_CAP=0
              -DLIBSPDM_EVENT_RECIPIENT_SUPPORT=0
              -DLIBSPDM_FFDHE_2048_SUPPORT=0 -DLIBSPDM_FFDHE_3072_SUPPORT=0 -DLIBSPDM_FFDHE_4096_SUPPORT=0
              -DLIBSPDM_ECDHE_P256_SUPPORT=0 -DLIBSPDM_ECDHE_P384_SUPPORT=0 -DLIBSPDM_ECDHE_P521_SUPPORT=0
              -DLIBSPDM_AEAD_AES_128_GCM_SUPPORT=0 -DLIBSPDM_AEAD_AES_256_GCM_SUPPORT=0
              -DLIBSPDM_AEAD_CHACHA20_POLY1305_SUPPORT=0

          # Signatures and sessions without certificates, as with provisioned
          # public keys.
          - name: config-no-certificates
            cflags: >-
              -DLIBSPDM_ENABLE_CAPABILITY_CERT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_CSR_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_SET_CERT_CAP=0
              -DLIBSPDM_SEND_GET_CERTIFICATE_SUPPORT=0

          - name: config-fips-record-transcript
            cflags: -DLIBSPDM_FIPS_MODE=1 -DLIBSPDM_RECORD_TRANSCRIPT_DATA_SUPPORT=1
            extra_tests: test_spdm_fips

          - name: config-fips-classical-openssl
            crypto: openssl
            cflags: >-
              -DLIBSPDM_FIPS_MODE=1
              -DLIBSPDM_ML_DSA_44_SUPPORT=0 -DLIBSPDM_ML_DSA_65_SUPPORT=0 -DLIBSPDM_ML_DSA_87_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_128S_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_128S_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_128F_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_128F_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_192S_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_192S_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_192F_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_192F_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_256S_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_256S_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_256F_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_256F_SUPPORT=0
              -DLIBSPDM_ML_KEM_512_SUPPORT=0 -DLIBSPDM_ML_KEM_768_SUPPORT=0 -DLIBSPDM_ML_KEM_1024_SUPPORT=0
            extra_tests: test_spdm_fips

          - name: config-record-transcript-minimal-caps
            cflags: >-
              -DLIBSPDM_RECORD_TRANSCRIPT_DATA_SUPPORT=1
              -DLIBSPDM_ENABLE_CAPABILITY_PSK_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_HBEAT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_MUT_AUTH_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_ENCAP_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_CSR_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_SET_CERT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_CHUNK_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_MEL_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_EVENT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_GET_KEY_PAIR_INFO_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_SET_KEY_PAIR_INFO_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_ENDPOINT_INFO_CAP=0
              -DLIBSPDM_EVENT_RECIPIENT_SUPPORT=0
              -DLIBSPDM_SEND_GET_ENDPOINT_INFO_SUPPORT=0

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # See the posix family.
          submodules: false
          persist-credentials: false

      - name: cmocka revision
        id: cmocka
        shell: bash
        run: |
          echo "sha=$(git ls-tree HEAD unit_test/cmockalib/cmocka | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: Cache cmocka
        id: cmocka-cache
        uses: actions/cache@v6
        with:
          path: unit_test/cmockalib/cmocka
          key: cmocka-${{ steps.cmocka.outputs.sha }}

      - name: Fetch submodules
        shell: bash
        run: |
          fetch() {
            local path=$1
            shift
            for attempt in 1 2 3; do
              if git submodule update --init "$@" "$path"; then
                return 0
              fi
              echo "fetch of $path failed, attempt $attempt"
              sleep $((attempt * 15))
            done
            return 1
          }

          if [ "${{ steps.cmocka-cache.outputs.cache-hit }}" != "true" ]; then
            fetch unit_test/cmockalib/cmocka --recursive
          fi
          fetch os_stub/mbedtlslib/mbedtls --recursive
          # libspdm builds OpenSSL from the pinned commit's source alone, so
          # neither its history nor its own submodules are fetched.
          if [ "${{ matrix.crypto || 'mbedtls' }}" = "openssl" ]; then
            fetch os_stub/openssllib/openssl --depth 1
          fi

      - name: OpenSSL revision
        id: ossl
        shell: bash
        run: |
          echo "sha=$(git -C os_stub/openssllib/openssl rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      # The same key as the posix family's linux-x64-clang jobs: OpenSSL takes
      # neither the macros nor the sanitizer flags, so their trees are
      # interchangeable.
      - name: Cache OpenSSL build
        if: (matrix.crypto || 'mbedtls') == 'openssl' && matrix.openssl_binary != 'true'
        uses: actions/cache@v6
        with:
          path: build/os_stub/openssllib
          key: openssl-ubuntu-latest-x64-CLANG-${{ steps.ossl.outputs.sha }}-${{ steps.ossl.outputs.image }}
          restore-keys: |
            openssl-ubuntu-latest-x64-CLANG-${{ steps.ossl.outputs.sha }}-

      - name: Cache OpenSSL binaries
        if: matrix.openssl_binary == 'true'
        uses: actions/cache@v6
        with:
          path: openssl-binary
          key: openssl-binary-ubuntu-latest-x64-${{ steps.ossl.outputs.sha }}-${{ steps.ossl.outputs.image }}
          restore-keys: |
            openssl-binary-ubuntu-latest-x64-${{ steps.ossl.outputs.sha }}-

      - name: Build OpenSSL binaries
        if: matrix.openssl_binary == 'true'
        shell: bash
        run: |
          cat > build_openssl_binary.sh <<'OPENSSL'
          # The prefix is not on the linker's search path, so only the libraries
          # given to CMake can satisfy the link.
          export OPENSSL_BINARY="$PWD/openssl-binary"
          if [ ! -e "$OPENSSL_BINARY/lib/libcrypto.so" ]; then
            mkdir -p build-openssl-binary
            (cd build-openssl-binary &&
              ../os_stub/openssllib/openssl/Configure shared no-tests no-docs \
                --prefix="$OPENSSL_BINARY" --libdir=lib &&
              make -j"$(getconf _NPROCESSORS_ONLN)" build_libs &&
              make install_dev)
          fi
          OPENSSL
          . ./build_openssl_binary.sh
          echo "OPENSSL_BINARY=$OPENSSL_BINARY" >> "$GITHUB_ENV"

      # The commands are written to a script so that the reproducer runs exactly
      # what this step ran.
      - name: Remove the LIBSPDM_DEBUG_ENABLE default
        if: matrix.no_debug_enable == 'true'
        shell: bash
        run: |
          cat > no_debug_enable.sh <<'EDIT'
          sed -i '/^#ifndef LIBSPDM_DEBUG_ENABLE$/,/^#endif$/d' include/library/spdm_lib_config.h
          if grep -q 'define LIBSPDM_DEBUG_ENABLE' include/library/spdm_lib_config.h; then
            echo "::error::spdm_lib_config.h still defines LIBSPDM_DEBUG_ENABLE"
            exit 1
          fi
          EDIT
          . ./no_debug_enable.sh

      - name: Configure
        shell: bash
        env:
          CFLAGS: ${{ env.BASE_CFLAGS }} ${{ env.SAN_CFLAGS }} ${{ matrix.cflags }}
          LDFLAGS: ${{ env.SAN_LDFLAGS }}
        run: |
          # The CLANG toolchain archives static libraries with llvm-ar, which is
          # not present on the stock Linux image. The same package provides
          # llvm-symbolizer, which the sanitizers need for function names.
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y llvm

          binary=()
          if [ "${{ matrix.openssl_binary }}" = "true" ]; then
            CFLAGS="$CFLAGS -I$OPENSSL_BINARY/include"
            binary=(-DENABLE_BINARY_BUILD=1
                    "-DCOMPILED_LIBCRYPTO_PATH=$OPENSSL_BINARY/lib/libcrypto.so"
                    "-DCOMPILED_LIBSSL_PATH=$OPENSSL_BINARY/lib/libssl.so")
          fi

          cmake -B build \
            -DARCH=x64 \
            -DTOOLCHAIN=CLANG \
            -DTARGET=${{ matrix.target || 'Debug' }} \
            -DCRYPTO=${{ matrix.crypto || 'mbedtls' }} \
            ${{ matrix.cmake_extra }} \
            "${binary[@]}"

      - name: Build
        shell: bash
        run: |
          jobs=$(getconf _NPROCESSORS_ONLN 2>/dev/null || nproc 2>/dev/null || echo 2)
          echo "Building with --parallel $jobs"

          if [ "${{ matrix.expect_tests }}" != "false" ]; then
            cmake --build build --target copy_sample_key
              cmake --build build --parallel "$jobs" --target $UNIT_TESTS ${{ matrix.extra_tests }}
          else
            cmake --build build --parallel "$jobs"
          fi

      - name: Prepare test runner
        if: matrix.expect_tests != 'false'
        shell: bash
        run: |
          # Leaks that are already tracked, each until its fix is merged. Any
          # other leak still fails the job.
          cat > lsan.supp <<'SUPPRESSIONS'
          # #4058, fixed by #4072: the sample libspdm_update_local_cert_chain()
          # leaks the certificate chains that it installs.
          leak:libspdm_update_local_cert_chain
          SUPPRESSIONS

          # The suppressions match function names, which needs the symbolizer.
          if ! command -v llvm-symbolizer >/dev/null 2>&1; then
            echo "::error::llvm-symbolizer is not on PATH"
            exit 1
          fi

          # halt_on_error makes a UBSan report fail the test, as ASan's and
          # LSan's reports already do.
          {
            echo "ASAN_OPTIONS=detect_leaks=1"
            echo "LSAN_OPTIONS=suppressions=$PWD/lsan.supp"
            echo "UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1"
          } >> "$GITHUB_ENV"

          cat > run_test.sh <<'RUNNER'
          #!/usr/bin/env bash
          set -uo pipefail
          t="$1"

          if [ ! -x "build/bin/$t" ]; then
            echo "::error::$t was not built"
            echo "- \`$t\`: **not built**" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 1
          fi

          ( cd build/bin && timeout 600 "./$t" )
          rc=$?

          if [ "$rc" -eq 0 ]; then
            echo "- \`$t\`: pass" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          else
            echo "- \`$t\`: **FAIL** (exit $rc)" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            echo "::error::$t failed with exit $rc"
          fi
          exit $rc
          RUNNER
          chmod +x run_test.sh
          echo "### ${{ env.JOB_NAME }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Test Requester
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_spdm_requester

      - name: Test Responder
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_spdm_responder

      - name: Test Common
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_spdm_common

      - name: Test SPDM Crypt
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_spdm_crypt

      - name: Test Crypt
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_crypt

      - name: Test Secured Message
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_spdm_secured_message

      - name: Test FIPS
        if: contains(matrix.extra_tests, 'test_spdm_fips')
        shell: bash
        run: ./run_test.sh test_spdm_fips

      - name: Verify no tests were built
        if: matrix.expect_tests == 'false'
        shell: bash
        run: |
          if [ -d build/bin ]; then
            stray=$(find build/bin -maxdepth 1 -name 'test_*' | wc -l)
          else
            stray=0
          fi
          if [ -d build ]; then
            libs=$(find build -type f -name '*.a' | wc -l)
          else
            libs=0
          fi
          echo "DISABLE_TESTS check: $stray test artifacts under build/bin, $libs libraries built"
          {
            echo "### ${{ env.JOB_NAME }}"
            echo ""
            echo "DISABLE_TESTS: $stray test artifacts, $libs libraries"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$stray" -ne 0 ]; then
            echo "::error::DISABLE_TESTS was set but build/bin holds $stray test artifacts"
            exit 1
          fi
          if [ "$libs" -eq 0 ]; then
            echo "::error::DISABLE_TESTS build produced no libraries; the check would pass vacuously"
            exit 1
          fi

      # As in the posix family, generated from the job's own variables so that
      # it cannot drift from what ran.
      - name: Generate reproducer
        if: always()
        shell: bash
        run: |
          mkdir -p repro

          ccfile=""
          if [ -d build/CMakeFiles ]; then
            ccfile=$(find build/CMakeFiles -name CMakeCCompiler.cmake -print -quit)
          fi
          cid=$(sed -n 's/^set(CMAKE_C_COMPILER_ID "\(.*\)")/\1/p' "$ccfile" 2>/dev/null || true)
          cver=$(sed -n 's/^set(CMAKE_C_COMPILER_VERSION "\(.*\)")/\1/p' "$ccfile" 2>/dev/null || true)
          compiler="${cid:-unknown} ${cver:-unknown}"
          image="${ImageOS:-unknown} ${ImageVersion:-unknown}"
          osname=$(grep -m1 '^PRETTY_NAME=' /etc/os-release 2>/dev/null | cut -d= -f2- | tr -d '"' || true)
          kernel=$(uname -srm 2>/dev/null)
          url="${{ github.server_url }}/${{ github.repository }}"
          run_url="$url/actions/runs/${{ github.run_id }}"
          pins=$(git submodule status 2>/dev/null | awk '{print $2" "$1}' || true)

          header="Reproduces: ${{ env.JOB_NAME }}
          Run:        $run_url
          Runner:     ubuntu-latest (image $image)
          OS:         ${osname:-unknown}
          Kernel:     ${kernel:-unknown}
          Compiler:   $compiler
          NOTE: this restores the source tree, not the toolchain. If your
                compiler differs from the one above, a non-reproduction is
                inconclusive rather than a refutation."

          f=repro/repro.sh
          { echo "#!/usr/bin/env bash"
            echo "$header" | sed 's/^/# /'
            echo "set -euo pipefail"
            echo
            echo "git clone $url.git libspdm-repro"
            echo "cd libspdm-repro"
            echo "git checkout ${{ github.sha }}"
            echo "git submodule update --init --recursive unit_test/cmockalib/cmocka os_stub/mbedtlslib/mbedtls"
            if [ "${{ matrix.crypto || 'mbedtls' }}" = "openssl" ]; then
              echo "git submodule update --init --depth 1 os_stub/openssllib/openssl"
            fi
            echo "$pins" | sed 's/^/# pinned: /'
            echo
            if [ -f no_debug_enable.sh ]; then cat no_debug_enable.sh; fi
            echo "export CFLAGS='${{ env.BASE_CFLAGS }} $SAN_CFLAGS ${{ matrix.cflags }}'"
            echo "export LDFLAGS='$SAN_LDFLAGS'"
            binary=""
            if [ "${{ matrix.openssl_binary }}" = "true" ]; then
              if [ -f build_openssl_binary.sh ]; then cat build_openssl_binary.sh; fi
              echo 'export CFLAGS="$CFLAGS -I$OPENSSL_BINARY/include"'
              binary=' -DENABLE_BINARY_BUILD=1 -DCOMPILED_LIBCRYPTO_PATH="$OPENSSL_BINARY/lib/libcrypto.so" -DCOMPILED_LIBSSL_PATH="$OPENSSL_BINARY/lib/libssl.so"'
            fi
            echo "cmake -B build -DARCH=x64 -DTOOLCHAIN=CLANG -DTARGET=${{ matrix.target || 'Debug' }} -DCRYPTO=${{ matrix.crypto || 'mbedtls' }} ${{ matrix.cmake_extra }}$binary"
            if [ "${{ matrix.expect_tests }}" != "false" ]; then
              echo "cmake --build build --target copy_sample_key"
              echo "cmake --build build --parallel \"\$(getconf _NPROCESSORS_ONLN)\" --target $UNIT_TESTS ${{ matrix.extra_tests }}"
              echo
              if [ -f lsan.supp ]; then
                echo "cat > lsan.supp <<'SUPPRESSIONS'"
                cat lsan.supp
                echo "SUPPRESSIONS"
              fi
              echo "export ASAN_OPTIONS=detect_leaks=1"
              echo 'export LSAN_OPTIONS="suppressions=$PWD/lsan.supp"'
              echo "export UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1"
              echo "cd build/bin"
              for t in $UNIT_TESTS ${{ matrix.extra_tests }}; do echo "./$t"; done
            else
              echo "cmake --build build --parallel \"\$(getconf _NPROCESSORS_ONLN)\""
            fi
          } > "$f"
          chmod +x "$f"

          echo "$header"
          { echo "<details><summary>Reproducer</summary>"
            echo
            echo '```'
            cat "$f"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reproducer
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: repro-${{ env.JOB_NAME }}
          path: |
            repro/
            build/CMakeCache.txt
          retention-days: 14

  tier2-complete:
    name: Tier 2 complete
    runs-on: ubuntu-latest
    needs: [posix, windows-msvc, mingw, configs]
    if: >-
      always() && github.repository == 'DMTF/libspdm'
      && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      # To open or update the Daily Test Failure issue.
      issues: write
      # To name the pull request that merged each commit in that issue.
      pull-requests: read
    env:
      # Budgets from doc/internal/continuous_integration.md, Tier 2: total wall clock under two
      # hours, worst case single job 20 minutes. Exceeding either is reported
      # as a warning rather than a failure, because wall clock also depends on
      # runner contention from other workflows.
      MAX_RUN_MINUTES: 120
      MAX_JOB_MINUTES: 20
      SELF_JOB_NAME: Tier 2 complete
    steps:
      - name: Report timing against the budget
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" > run.json
          # The run has more than 100 jobs, so every page is read.
          gh api --paginate --slurp \
            "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" > jobs.json
          python3 - run.json jobs.json <<'TIMING'
          import json, os, sys, datetime

          UTC = datetime.timezone.utc
          FMT = "%Y-%m-%dT%H:%M:%SZ"


          def ts(s):
              return datetime.datetime.strptime(s, FMT).replace(tzinfo=UTC)


          run = json.load(open(sys.argv[1]))
          jobs = [j for page in json.load(open(sys.argv[2])) for j in page["jobs"]]

          # Allow tests to pin "now"; the workflow leaves it unset.
          now = ts(sys.argv[3]) if len(sys.argv) > 3 else datetime.datetime.now(UTC)

          max_run = int(os.environ.get("MAX_RUN_MINUTES", "30"))
          max_job = int(os.environ.get("MAX_JOB_MINUTES", "20"))
          me = os.environ.get("SELF_JOB_NAME", "Tier 2 complete")

          queue = (ts(run["run_started_at"]) - ts(run["created_at"])).total_seconds()
          elapsed = (now - ts(run["run_started_at"])).total_seconds()

          durs = [
              ((ts(j["completed_at"]) - ts(j["started_at"])).total_seconds(), j["name"])
              for j in jobs
              if j.get("completed_at") and j["name"] != me
          ]
          slow_d, slow_n = max(durs) if durs else (0, "(none)")
          total = sum(d for d, _ in durs)

          lines = [
              "### Tier 2 timing",
              "",
              "| metric | value | budget |",
              "|---|---|---|",
              "| wall clock | %.1f min | %d min |" % (elapsed / 60, max_run),
              "| slowest job | %.1f min (%s) | %d min |" % (slow_d / 60, slow_n, max_job),
              "| queued before start | %.1f min | - |" % (queue / 60),
              "| sum of job time | %.1f min | - |" % (total / 60),
              "| jobs | %d | - |" % len(durs),
          ]

          warn = []
          if elapsed > max_run * 60:
              warn.append(
                  "Tier 2 wall clock %.1f min exceeds the %d min budget in doc/internal/continuous_integration.md"
                  % (elapsed / 60, max_run)
              )
          if slow_d > max_job * 60:
              warn.append(
                  "Job '%s' took %.1f min, over the %d min worst-case-job assumption"
                  % (slow_n, slow_d / 60, max_job)
              )

          for w in warn:
              print("::warning::" + w)
              lines += ["", "> [!WARNING]", "> " + w]

          print("\n".join(lines))
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a") as f:
                  f.write("\n".join(lines) + "\n")
          TIMING

      # For the issue below: the commits that went into main after the commit
      # that the previous scheduled run tested, oldest first. A failure here
      # leaves them out of the issue rather than losing the issue, so the list
      # is written only once it is complete.
      - name: List the commits since the previous scheduled run
        if: github.event_name == 'schedule' && !cancelled()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha=${{ github.sha }}
          read -r workflow created < <(gh api "repos/$GH_REPO/actions/runs/${{ github.run_id }}" \
            --jq '"\(.workflow_id) \(.created_at)"')
          # The latest completed scheduled run created before this one. A
          # re-run keeps the creation time of the run it repeats.
          prev=$(CREATED=$created gh api \
            "repos/$GH_REPO/actions/workflows/$workflow/runs?event=schedule&branch=main&status=completed&per_page=100" \
            --jq '[.workflow_runs[] | select(.created_at < env.CREATED
              and .conclusion != "startup_failure")][0] // empty
              | "\(.head_sha) \(.html_url) \(.conclusion)"')
          {
            if [ -z "$prev" ]; then
              echo "There is no earlier scheduled run to compare with."
            else
              read -r prev_sha prev_url prev_conclusion <<< "$prev"
              if [ "$prev_sha" = "$sha" ]; then
                echo "The previous scheduled run, $prev_url ($prev_conclusion), tested the same commit."
              else
                compare="repos/$GH_REPO/compare/$prev_sha...$sha"
                echo "Commits since the previous scheduled run, $prev_url ($prev_conclusion), oldest first:"
                echo
                gh api "$compare" --jq '.commits[] | "\(.sha) \(.commit.message | split("\n")[0])"' |
                  while read -r commit subject; do
                    pr=$(gh api "repos/$GH_REPO/commits/$commit/pulls" \
                      --jq '[.[] | select(.merged_at != null)][0].number // empty')
                    echo "- $commit $subject${pr:+ (#$pr)}"
                  done
                # The compare API lists at most 250 commits.
                more=$(gh api "$compare" --jq '.total_commits - (.commits | length)')
                if [ "$more" -gt 0 ]; then
                  echo "- $more more: ${{ github.server_url }}/$GH_REPO/compare/$prev_sha...$sha"
                fi
              fi
            fi
          } > commits.tmp
          mv commits.tmp commits.md

      # doc/internal/continuous_integration.md: maintainers are notified of a
      # failure by an issue with the Daily Test Failure label. One open issue
      # collects the failures until it is closed. Only scheduled runs report. A
      # cancelled run does not, but a job that reaches its timeout does. Each
      # report lists the failed jobs and the commits since the previous
      # scheduled run.
      - name: Open or update the Daily Test Failure issue
        if: >-
          ${{ github.event_name == 'schedule' && !cancelled()
          && (needs.posix.result != 'success'
          || needs['windows-msvc'].result != 'success'
          || needs.mingw.result != 'success'
          || needs.configs.result != 'success') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LABEL: Daily Test Failure
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Tier 2 failed on \`main\` at ${{ github.sha }} in $RUN_URL."
            echo
            echo "Failed jobs:"
            echo
            gh api --paginate "repos/$GH_REPO/actions/runs/${{ github.run_id }}/jobs?per_page=100" \
              --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out"
                or .conclusion == "cancelled") | "- [\(.name)](\(.html_url))"'
            echo
            if [ -f commits.md ]; then
              cat commits.md
            else
              echo "The commits since the previous scheduled run could not be listed."
            fi
          } > failure.md
          gh label create "$LABEL" --color B60205 \
            --description "A scheduled test run on main failed" 2>/dev/null || true
          issue=$(gh issue list --label "$LABEL" --state open --limit 1 \
            --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file failure.md
          else
            gh issue create --title "Tier 2 daily test failure" --label "$LABEL" \
              --body-file failure.md
          fi

      - name: Check result
        run: |
          posix="${{ needs.posix.result }}"
          msvc="${{ needs['windows-msvc'].result }}"
          mingw="${{ needs.mingw.result }}"
          configs="${{ needs.configs.result }}"
          echo "posix=$posix windows-msvc=$msvc mingw=$mingw configs=$configs"
          if [ "$posix" != "success" ] || [ "$msvc" != "success" ] || [ "$mingw" != "success" ] ||
             [ "$configs" != "success" ]; then
            echo "::error::Tier 2 did not pass (posix=$posix windows-msvc=$msvc mingw=$mingw configs=$configs)"
            exit 1
          fi
