# Implements "Tier 2 - Daily Coverage" from doc/internal/continuous_integration.md:
#   - the core unit tests against every combination of operating system, host
#     hardware, toolchain, cryptography library and build target that the CMake
#     build files support, 64 in all, in the posix, windows-msvc and mingw
#     families,
#   - other operating system and compiler versions, sparsely, in the versions
#     family and in windows-msvc's older MSVC toolsets, including the newest
#     GCC and LLVM releases before any runner image has them,
#   - the code configuration sweeps under ASan and UBSan, in the configs family,
#     and a few of the same configurations with MSVC and MinGW, in windows-msvc
#     and mingw, and
#   - MSan on the defaults and a selection of those configurations, and ASan
#     and UBSan with GCC and on aarch64, in the sanitizers family.
#
# Unlike Tier 1, each platform family's matrix is a cross product, so the matrix
# itself shows that every combination is covered. The family split and the
# exclusions encode which combinations are legal. The steps are copied from
# build_test_tier_1.yml and must be kept in step with it.

name: Tier 2 Build and Test

on:
  schedule:
    - cron: '25 10 * * *'
  # Scheduled runs test main in DMTF/libspdm only, so a fork does not run Tier 2
  # every day. A manual run tests the branch that it is dispatched on, in
  # DMTF/libspdm or in a fork.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Basic unit tests per doc/internal/continuous_integration.md. Every job runs
  # each of these that its build produced. Extended unit tests are added per
  # job via matrix.extra_tests, in the configurations that satisfy their
  # requirement.
  UNIT_TESTS: >-
    test_spdm_requester
    test_spdm_responder
    test_spdm_crypt
    test_spdm_secured_message
    test_spdm_transport
    test_spdm_common
    test_crypt

  # Applied to every job.
  #   CHECK_MACRO      enforces include/internal/libspdm_macro_check.h at
  #                    compile time, so an illegal configuration fails loudly
  #                    instead of building something subtly wrong.
  #   ASSERT_CONFIG=3  makes a failing assert exit rather than deadloop.
  BASE_CFLAGS: -DLIBSPDM_CHECK_MACRO=1 -DLIBSPDM_DEBUG_LIBSPDM_ASSERT_CONFIG=3

jobs:
  # posix, windows-msvc and mingw repeat most of their steps, and versions and
  # configs repeat posix's. That is deliberate. The alternative is one job family
  # whose platform-specific steps are selected with `if:`, and GitHub has no way
  # to hide work it skips (https://github.com/orgs/community/discussions/18001).
  #
  # max-parallel applies to each job family separately, so posix, windows-msvc,
  # mingw and configs run at most 5 + 4 + 2 + 5 = 16 jobs at once. versions
  # waits for posix and then takes over its 5, and sanitizers waits for versions
  # and mingw and then takes over their 7. That leaves 4 of the 20 runners that
  # doc/internal/continuous_integration.md assumes for pull requests and
  # pushes. If every job took that document's worst case of 20 minutes, mingw
  # would finish in at most five rounds, or 100 minutes, within Tier 2's two
  # hours. windows-msvc, at 34 jobs, configs, at 81, and posix followed by
  # versions and then sanitizers, at 92, cannot meet that worst case. Their
  # jobs take about 2 to 10 minutes, so each finishes in about 50 minutes, and
  # the timing report warns if a run takes longer than two hours.

  posix:
    name: ${{ format('{0}-{1}-{2}-{3}-{4}', matrix.platform, matrix.arch, matrix.tc, matrix.crypto, matrix.tgt) }}
    if: github.repository == 'DMTF/libspdm' || github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      JOB_NAME: ${{ format('{0}-{1}-{2}-{3}-{4}', matrix.platform, matrix.arch, matrix.tc, matrix.crypto, matrix.tgt) }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        platform: [linux, macos]
        arch: [x64, aarch64, ia32]
        toolchain: [GCC, CLANG]
        crypto: [mbedtls, openssl]
        target: [Debug, Release]
        exclude:
          # The CMake build files support only Clang on macOS.
          - platform: macos
            toolchain: GCC
          # macOS no longer builds or runs 32-bit programs.
          - platform: macos
            arch: ia32
        include:
          # The runner for each platform and architecture. Ubuntu is named by
          # release, not as ubuntu-latest, so that what Tier 2 covers changes
          # only with this file. versions runs the other releases. ia32 is
          # built and run on x64, with the -m32 that the toolchain files add.
          - {platform: linux, arch: x64, os: ubuntu-24.04}
          - {platform: linux, arch: aarch64, os: ubuntu-24.04-arm}
          - {platform: linux, arch: ia32, os: ubuntu-24.04}
          - {platform: macos, arch: aarch64, os: macos-latest}
          - {platform: macos, arch: x64, os: macos-26-intel}
          # Lower-case spellings for the job name.
          - {toolchain: GCC, tc: gcc}
          - {toolchain: CLANG, tc: clang}
          - {target: Debug, tgt: debug}
          - {target: Release, tgt: release}
          # As in Tier 1, fat LTO objects make GCC report its late warnings
          # when compiling, under -Werror.
          - {platform: linux, arch: x64, toolchain: GCC, target: Release, cflags: -ffat-lto-objects}
          - {platform: linux, arch: ia32, toolchain: GCC, target: Release, cflags: -ffat-lto-objects}
          # Mbed TLS's overlap check in mbedtls_gcm_update subtracts pointers
          # to unrelated buffers (Mbed-TLS/mbedtls#4538). test_crypt's buffers
          # lie more than 2 GiB apart in a 32-bit process, and GCC's link-time
          # optimization turns the overflowing difference into a rejection of
          # its AES-GCM test, so this job skips test_crypt until Mbed TLS fixes
          # the check (#4237).
          - {platform: linux, arch: ia32, toolchain: GCC, crypto: mbedtls, target: Release, skip_tests: test_crypt}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The submodules are fetched in a later step so that cmocka can be served
          # from the cache. A fetch failure inside this step aborts the job before
          # any cache is consulted, which is what makes cmocka's host a source of
          # unrelated test failures.
          submodules: false
          # Nothing after this step needs to talk to the remote, and the jobs
          # run build scripts from the pull request's own tree.
          persist-credentials: false

      # cmocka is the only submodule not hosted on github.com, and gitlab.com is
      # reachable less reliably from the runners. Its source does not vary by
      # configuration, so a single entry keyed on the pinned revision serves every
      # matrix entry, and gitlab.com is contacted only when that pin moves.
      - name: cmocka revision
        id: cmocka
        shell: bash
        run: |
          echo "sha=$(git ls-tree HEAD unit_test/cmockalib/cmocka | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: Cache cmocka
        id: cmocka-cache
        uses: actions/cache@v6
        with:
          path: unit_test/cmockalib/cmocka
          key: cmocka-${{ steps.cmocka.outputs.sha }}

      - name: Fetch submodules
        shell: bash
        run: |
          # Retry rather than fail the job on a transient fetch error. A cache hit
          # means cmocka is already present, so it is not fetched at all.
          fetch() {
            local path=$1
            shift
            for attempt in 1 2 3; do
              if git submodule update --init "$@" "$path"; then
                return 0
              fi
              echo "fetch of $path failed, attempt $attempt"
              sleep $((attempt * 15))
            done
            return 1
          }

          if [ "${{ steps.cmocka-cache.outputs.cache-hit }}" != "true" ]; then
            fetch unit_test/cmockalib/cmocka --recursive
          else
            # The cached .git file points into .git/modules, which this
            # checkout does not have, and git submodule commands fail on it.
            rm -f unit_test/cmockalib/cmocka/.git
          fi
          fetch os_stub/mbedtlslib/mbedtls --recursive
          # libspdm builds OpenSSL from the pinned commit's source alone, so
          # neither its history nor its own submodules are fetched.
          if [ "${{ matrix.crypto }}" = "openssl" ]; then
            fetch os_stub/openssllib/openssl --depth 1
          fi
      # OpenSSL is an ExternalProject with its own CFLAGS, so no LIBSPDM_*
      # macro reaches it: one entry serves every configuration on a given
      # platform. Measured at ~100 MB on POSIX and ~344 MB on Windows, so
      # caching the tree wholesale is affordable and avoids maintaining a
      # list of which paths have consumers -- the Windows DLL lives in the
      # build tree, not the install tree, which such a list would miss.
      - name: OpenSSL revision
        id: ossl
        shell: bash
        run: |
          echo "sha=$(git -C os_stub/openssllib/openssl rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      # The OpenSSL revision precedes the runner image in the key so that
      # restore-keys can fall back to the same revision's tree from an older
      # image, rather than rebuilding whenever an image rollout lands. The
      # fallback therefore reuses objects from the older image's compiler
      # until the revision changes. Because the prefix pins the revision,
      # stamps from one revision are never paired with a tree from another.
      # The key omits TARGET and the macros because neither changes what
      # OpenSSL builds.
      - name: Cache OpenSSL build
        if: matrix.crypto == 'openssl' && matrix.openssl_binary != 'true'
        uses: actions/cache@v6
        with:
          path: build/os_stub/openssllib
          key: openssl-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.toolchain }}-${{ steps.ossl.outputs.sha }}-${{ steps.ossl.outputs.image }}
          restore-keys: |
            openssl-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.toolchain }}-${{ steps.ossl.outputs.sha }}-

      # A binary build does not build the ExternalProject above. Its OpenSSL is
      # installed into a prefix that, like that tree, depends only on the
      # OpenSSL revision and the runner, so it is cached the same way.
      - name: Cache OpenSSL binaries
        if: matrix.openssl_binary == 'true'
        uses: actions/cache@v6
        with:
          path: openssl-binary
          key: openssl-binary-${{ matrix.os }}-${{ matrix.arch }}-${{ steps.ossl.outputs.sha }}-${{ steps.ossl.outputs.image }}
          restore-keys: |
            openssl-binary-${{ matrix.os }}-${{ matrix.arch }}-${{ steps.ossl.outputs.sha }}-

      # The commands are written to a script so that the reproducer runs exactly
      # what this step ran.
      - name: Build OpenSSL binaries
        if: matrix.openssl_binary == 'true'
        shell: bash
        run: |
          cat > build_openssl_binary.sh <<'OPENSSL'
          # The prefix is not on the linker's search path, so only the libraries
          # given to CMake can satisfy the link.
          export OPENSSL_BINARY="$PWD/openssl-binary"
          if [ ! -e "$OPENSSL_BINARY/lib/libcrypto.so" ]; then
            mkdir -p build-openssl-binary
            (cd build-openssl-binary &&
              ../os_stub/openssllib/openssl/Configure shared no-tests no-docs \
                --prefix="$OPENSSL_BINARY" --libdir=lib &&
              make -j"$(getconf _NPROCESSORS_ONLN)" build_libs &&
              make install_dev)
          fi
          OPENSSL
          . ./build_openssl_binary.sh
          echo "OPENSSL_BINARY=$OPENSSL_BINARY" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        env:
          CFLAGS: ${{ env.BASE_CFLAGS }} ${{ matrix.cflags }}
        run: |
          # A stalled mirror can outlast apt-get's own timeouts, so each attempt
          # is bounded, and a failed one is retried.
          apt_install() {
            for attempt in 1 2 3; do
              if sudo timeout -k 10 300 apt-get update &&
                 sudo timeout -k 10 300 apt-get install --no-install-recommends -y "$@"; then
                return 0
              fi
              echo "apt-get install $* failed, attempt $attempt"
              sleep $((attempt * 15))
            done
            return 1
          }

          # The CLANG toolchain archives static libraries with llvm-ar,
          # which is not present on the stock Linux image. Nor is the 32-bit C
          # library that -m32 links with, for Clang as for GCC.
          packages=()
          if [ "${{ matrix.toolchain }}" = "CLANG" ] && [ "${{ runner.os }}" = "Linux" ]; then
            packages+=(llvm)
          fi
          if [ "${{ matrix.arch }}" = "ia32" ] && [ "${{ runner.os }}" = "Linux" ]; then
            packages+=(gcc-multilib)
          fi
          if [ ${#packages[@]} -gt 0 ]; then
            apt_install "${packages[@]}"
          fi

          # A binary build takes the OpenSSL libraries as paths, and their
          # headers from the include path, ahead of any OpenSSL on the image.
          binary=()
          if [ "${{ matrix.openssl_binary }}" = "true" ]; then
            CFLAGS="$CFLAGS -I$OPENSSL_BINARY/include"
            binary=(-DENABLE_BINARY_BUILD=1
                    "-DCOMPILED_LIBCRYPTO_PATH=$OPENSSL_BINARY/lib/libcrypto.so"
                    "-DCOMPILED_LIBSSL_PATH=$OPENSSL_BINARY/lib/libssl.so")
          fi

          cmake -B build \
            -DARCH=${{ matrix.arch }} \
            -DTOOLCHAIN=${{ matrix.toolchain }} \
            -DTARGET=${{ matrix.target }} \
            -DCRYPTO=${{ matrix.crypto }} \
            ${{ matrix.cmake_extra }} \
            "${binary[@]}"

      - name: Build
        shell: bash
        run: |
          # Discover the core count rather than assuming it, so the build keeps
          # pace if runner specs change. A bare `--parallel` means an unbounded
          # -j, which exhausts the smaller runners.
          jobs=$(getconf _NPROCESSORS_ONLN 2>/dev/null || nproc 2>/dev/null || echo 2)
          echo "Building with --parallel $jobs"

          # copy_sample_key stages certificates into build/bin, which only
          # exists when unit tests are built.
          if [ "${{ matrix.expect_tests }}" != "false" ]; then
            cmake --build build --target copy_sample_key
          fi
          cmake --build build --parallel "$jobs"

      # Implements "For any configuration, run all basic unit tests", plus any
      # extended unit test whose requirement this configuration satisfies.
      # Each test is bounded so a hang fails the job instead of stalling it.
      # One step per test, so the Actions UI shows a separate pass/fail entry
      # for each. A single looping step buries later tests below the log
      # viewer's truncation point. The shared runner keeps the binary lookup
      # and the timeout guard in one place rather than in six copies.
      - name: Prepare test runner
        if: matrix.expect_tests != 'false'
        shell: bash
        run: |
          cat > run_test.sh <<'RUNNER'
          #!/usr/bin/env bash
          set -uo pipefail
          t="$1"

          exe=""
          if [ -x "build/bin/$t" ]; then
            exe="$t"
          elif [ -x "build/bin/$t.exe" ]; then
            exe="$t.exe"
          fi

          # Basic unit tests require no additional configuration, so a missing
          # one means coverage was lost rather than legitimately skipped.
          if [ -z "$exe" ]; then
            echo "::error::$t was not built"
            echo "- \`$t\`: **not built**" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 1
          fi

          # macOS has no GNU timeout; fall back to gtimeout, then to perl.
          if command -v timeout >/dev/null 2>&1; then
            ( cd build/bin && timeout 600 "./$exe" )
          elif command -v gtimeout >/dev/null 2>&1; then
            ( cd build/bin && gtimeout 600 "./$exe" )
          else
            ( cd build/bin && perl -e 'alarm shift; exec @ARGV' 600 "./$exe" )
          fi
          rc=$?

          if [ "$rc" -eq 0 ]; then
            echo "- \`$t\`: pass" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          else
            echo "- \`$t\`: **FAIL** (exit $rc)" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            echo "::error::$t failed with exit $rc"
          fi
          exit $rc
          RUNNER
          chmod +x run_test.sh
          echo "### ${{ env.JOB_NAME }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Test Requester
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_spdm_requester

      - name: Test Responder
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_spdm_responder

      - name: Test Common
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_spdm_common

      - name: Test SPDM Crypt
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_spdm_crypt

      - name: Test Crypt
        if: matrix.expect_tests != 'false' && !contains(matrix.skip_tests, 'test_crypt')
        shell: bash
        run: ./run_test.sh test_crypt

      - name: Test Secured Message
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_spdm_secured_message

      - name: Test Transport
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_spdm_transport

      # Extended unit test: runs only where its requirement is satisfied.
      - name: Test FIPS
        if: contains(matrix.extra_tests, 'test_spdm_fips')
        shell: bash
        run: ./run_test.sh test_spdm_fips

      # DISABLE_TESTS gates 87 test subdirectories, so this checks that nothing
      # test-shaped was produced, and that libraries still were -- otherwise an
      # empty build tree would satisfy the check vacuously.
      - name: Verify no tests were built
        if: matrix.expect_tests == 'false'
        shell: bash
        run: |
          # build/bin does not exist when tests are disabled. Redirecting find's
          # stderr hides the message but not its exit status, which pipefail
          # propagates and set -e turns into a silent step failure, so test for
          # the directory instead of relying on 2>/dev/null.
          if [ -d build/bin ]; then
            stray=$(find build/bin -maxdepth 1 -name 'test_*' | wc -l)
          else
            stray=0
          fi
          if [ -d build ]; then
            libs=$(find build -type f \( -name '*.a' -o -name '*.lib' \) | wc -l)
          else
            libs=0
          fi
          echo "DISABLE_TESTS check: $stray test artifacts under build/bin, $libs libraries built"
          {
            echo "### ${{ env.JOB_NAME }}"
            echo ""
            echo "DISABLE_TESTS: $stray test artifacts, $libs libraries"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$stray" -ne 0 ]; then
            echo "::error::DISABLE_TESTS was set but build/bin holds $stray test artifacts"
            exit 1
          fi
          if [ "$libs" -eq 0 ]; then
            echo "::error::DISABLE_TESTS build produced no libraries; the check would pass vacuously"
            exit 1
          fi
      # Reproducer, generated from the job's own variables so that it cannot
      # drift from what actually ran. The script restores the source tree but
      # not the toolchain, so the compiler identity is recorded in the header:
      # identical source can produce different diagnostics on different
      # compiler versions.
      - name: Generate reproducer
        if: always()
        shell: bash
        run: |
          mkdir -p repro

          # A failed configure leaves no build tree, and this step runs on
          # always(). "ls ... | head" exits non-zero there, which pipefail and
          # set -e turn into a silent step failure, losing the reproducer in
          # exactly the case that most needs one.
          ccfile=""
          if [ -d build/CMakeFiles ]; then
            ccfile=$(find build/CMakeFiles -name CMakeCCompiler.cmake -print -quit)
          fi
          cid=$(sed -n 's/^set(CMAKE_C_COMPILER_ID "\(.*\)")/\1/p' "$ccfile" 2>/dev/null || true)
          cver=$(sed -n 's/^set(CMAKE_C_COMPILER_VERSION "\(.*\)")/\1/p' "$ccfile" 2>/dev/null || true)
          compiler="${cid:-unknown} ${cver:-unknown}"
          image="${ImageOS:-unknown} ${ImageVersion:-unknown}"

          # The image label identifies the runner build, not what is actually
          # underneath it. Record the distro and kernel too, so a reader can
          # tell how far their machine differs from the one that failed.
          if [ -r /etc/os-release ]; then
            osname=$(grep -m1 '^PRETTY_NAME=' /etc/os-release | cut -d= -f2- | tr -d '"' || true)
          elif command -v sw_vers >/dev/null 2>&1; then
            osname="$(sw_vers -productName) $(sw_vers -productVersion)"
          else
            osname=$(cmd //c ver 2>/dev/null | tr -d '[:cntrl:]' | grep -m1 Windows || true)
          fi
          kernel=$(uname -srm 2>/dev/null)
          url="${{ github.server_url }}/${{ github.repository }}"
          run_url="$url/actions/runs/${{ github.run_id }}"

          # On a pull_request event github.sha is the ephemeral merge commit
          # under refs/pull/N/merge, which a plain clone does not fetch. Fetch
          # that ref explicitly so the script checks out what CI actually built.
          pr="${{ github.event.pull_request.number }}"
          if [ -n "$pr" ]; then
            fetch_ref="git fetch origin refs/pull/$pr/merge"
            checkout_ref="git checkout FETCH_HEAD"
          else
            fetch_ref=""
            checkout_ref="git checkout ${{ github.sha }}"
          fi

          # Informational: the checkout above already pins these, but recording
          # them lets a reader verify the tree is what the job built.
          pins=$(git submodule status 2>/dev/null | awk '{print $2" "$1}' || true)

          header="Reproduces: ${{ env.JOB_NAME }}
          Run:        $run_url
          Runner:     ${{ matrix.os }} (image $image)
          OS:         ${osname:-unknown}
          Kernel:     ${kernel:-unknown}
          Compiler:   $compiler
          NOTE: this restores the source tree, not the toolchain. If your
                compiler differs from the one above, a non-reproduction is
                inconclusive rather than a refutation."

          if [ "${{ runner.os }}" = "Windows" ] && [ -z "${{ matrix.shell }}" ]; then
            f=repro/repro.bat
            { echo "@echo off"
              echo "$header" | sed 's/^/REM /'
              echo "REM Run from a Visual Studio Developer Command Prompt for ${{ matrix.msvc_arch }}."
              echo
              echo "git clone $url.git libspdm-repro || exit /b 1"
              echo "cd libspdm-repro || exit /b 1"
              if [ -n "$fetch_ref" ]; then echo "$fetch_ref || exit /b 1"; fi
              echo "$checkout_ref || exit /b 1"
              echo "git submodule update --init --recursive unit_test/cmockalib/cmocka os_stub/mbedtlslib/mbedtls || exit /b 1"
              if [ "${{ matrix.crypto }}" = "openssl" ]; then
                echo "git submodule update --init --depth 1 os_stub/openssllib/openssl || exit /b 1"
              fi
              echo "$pins" | sed 's/^/REM pinned: /'
              echo
              if [ "${{ matrix.toolchain }}" = "CLANG" ]; then
                echo "set \"PATH=%ProgramFiles%\\LLVM\\bin;%PATH%\""
              fi
              echo "set CFLAGS=${{ env.BASE_CFLAGS }} ${{ matrix.cflags }}"
              echo "cmake -B build -G \"${{ matrix.generator }}\" -DARCH=${{ matrix.arch }} -DTOOLCHAIN=${{ matrix.toolchain }} -DTARGET=${{ matrix.target }} -DCRYPTO=${{ matrix.crypto }} ${{ matrix.cmake_extra }} || exit /b 1"
              echo "cmake --build build --target copy_sample_key"
              echo "cmake --build build || exit /b 1"
              echo
              echo "cd build\\bin"
              for t in $UNIT_TESTS ${{ matrix.extra_tests }}; do echo "if exist $t.exe $t.exe"; done
            } > "$f"
          else
            f=repro/repro.sh
            { echo "#!/usr/bin/env bash"
              echo "$header" | sed 's/^/# /'
              if [ -n "${{ matrix.shell }}" ]; then
                echo "# Run inside an MSYS2 ${{ matrix.msystem }} shell."
              fi
              if [ "${{ matrix.arch }}" = "ia32" ] && [ "${{ runner.os }}" = "Linux" ]; then
                echo "# -m32 needs the 32-bit C library, as Ubuntu's gcc-multilib installs."
              fi
              echo "set -euo pipefail"
              echo
              echo "git clone $url.git libspdm-repro"
              echo "cd libspdm-repro"
              if [ -n "$fetch_ref" ]; then echo "$fetch_ref"; fi
              echo "$checkout_ref"
              echo "git submodule update --init --recursive unit_test/cmockalib/cmocka os_stub/mbedtlslib/mbedtls"
              if [ "${{ matrix.crypto }}" = "openssl" ]; then
                echo "git submodule update --init --depth 1 os_stub/openssllib/openssl"
              fi
              echo "$pins" | sed 's/^/# pinned: /'
              echo
              echo "export CFLAGS='${{ env.BASE_CFLAGS }} ${{ matrix.cflags }}'"
              # The OpenSSL prefix is under the clone, so these lines are
              # emitted unexpanded.
              binary=""
              if [ "${{ matrix.openssl_binary }}" = "true" ]; then
                # Absent only if the job failed before "Build OpenSSL binaries".
                if [ -f build_openssl_binary.sh ]; then cat build_openssl_binary.sh; fi
                echo 'export CFLAGS="$CFLAGS -I$OPENSSL_BINARY/include"'
                binary=' -DENABLE_BINARY_BUILD=1 -DCOMPILED_LIBCRYPTO_PATH="$OPENSSL_BINARY/lib/libcrypto.so" -DCOMPILED_LIBSSL_PATH="$OPENSSL_BINARY/lib/libssl.so"'
              fi
              if [ -n "${{ matrix.generator }}" ]; then
                echo "cmake -B build -G \"${{ matrix.generator }}\" -DARCH=${{ matrix.arch }} -DTOOLCHAIN=${{ matrix.toolchain }} -DTARGET=${{ matrix.target }} -DCRYPTO=${{ matrix.crypto }} ${{ matrix.cmake_extra }}$binary"
              else
                echo "cmake -B build -DARCH=${{ matrix.arch }} -DTOOLCHAIN=${{ matrix.toolchain }} -DTARGET=${{ matrix.target }} -DCRYPTO=${{ matrix.crypto }} ${{ matrix.cmake_extra }}$binary"
              fi
              echo "cmake --build build --target copy_sample_key"
              echo "cmake --build build --parallel \"\$(getconf _NPROCESSORS_ONLN)\""
              echo
              echo "cd build/bin"
              # A test that the job skips is left out here too.
              for t in $UNIT_TESTS ${{ matrix.extra_tests }}; do
                case " ${{ matrix.skip_tests }} " in
                  *" $t "*) echo "# $t is skipped in this job." ;;
                  *) echo "if [ -x ./$t ]; then ./$t; fi" ;;
                esac
              done
            } > "$f"
            chmod +x "$f"
          fi

          # The step log is the first place anyone looks, and unlike the job
          # summary it is reachable from the API, so echo the platform
          # identity there too.
          echo "$header"

          # Legibility for every run, not just failures: the invocation is
          # visible in the UI without downloading anything.
          { echo "<details><summary>Reproducer</summary>"
            echo
            echo '```'
            cat "$f"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reproducer
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: repro-${{ env.JOB_NAME }}
          path: |
            repro/
            build/CMakeCache.txt
          retention-days: 14

  # Other operating system and compiler versions, each with a few combinations
  # of cryptography library and build target, so crossed sparsely as
  # doc/internal/continuous_integration.md crosses platforms. The jobs start
  # once posix has finished, whether or not it passed, and run in the runners
  # that posix used, so Tier 2 never runs more jobs at once. The steps are
  # posix's, without those that no job here needs, plus Prepare container and
  # Select compiler.
  versions:
    name: ${{ matrix.name }}
    needs: posix
    if: >-
      !cancelled() && (github.repository == 'DMTF/libspdm'
      || github.event_name != 'schedule')
    runs-on: ${{ matrix.os }}
    # Empty, and so no container, except in the jobs that name one.
    container: ${{ matrix.container }}
    timeout-minutes: 45
    env:
      JOB_NAME: ${{ matrix.name }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          # == Ubuntu 26.04 ================================================
          # GCC 15 and Clang 21 by default. posix runs Ubuntu 24.04.

          - name: ubuntu-26.04-x64-gcc-mbedtls-debug
            os: ubuntu-26.04
            arch: x64
            toolchain: GCC
            crypto: mbedtls
            target: Debug

          - name: ubuntu-26.04-x64-gcc-mbedtls-release
            os: ubuntu-26.04
            arch: x64
            toolchain: GCC
            crypto: mbedtls
            target: Release
            cflags: -ffat-lto-objects

          - name: ubuntu-26.04-x64-gcc-openssl-debug
            os: ubuntu-26.04
            arch: x64
            toolchain: GCC
            crypto: openssl
            target: Debug

          - name: ubuntu-26.04-x64-gcc-openssl-release
            os: ubuntu-26.04
            arch: x64
            toolchain: GCC
            crypto: openssl
            target: Release
            cflags: -ffat-lto-objects

          - name: ubuntu-26.04-x64-clang-mbedtls-debug
            os: ubuntu-26.04
            arch: x64
            toolchain: CLANG
            crypto: mbedtls
            target: Debug

          - name: ubuntu-26.04-x64-clang-mbedtls-release
            os: ubuntu-26.04
            arch: x64
            toolchain: CLANG
            crypto: mbedtls
            target: Release

          - name: ubuntu-26.04-x64-clang-openssl-debug
            os: ubuntu-26.04
            arch: x64
            toolchain: CLANG
            crypto: openssl
            target: Debug

          - name: ubuntu-26.04-x64-clang-openssl-release
            os: ubuntu-26.04
            arch: x64
            toolchain: CLANG
            crypto: openssl
            target: Release

          - name: ubuntu-26.04-arm-aarch64-gcc-mbedtls-debug
            os: ubuntu-26.04-arm
            arch: aarch64
            toolchain: GCC
            crypto: mbedtls
            target: Debug

          - name: ubuntu-26.04-arm-aarch64-gcc-openssl-release
            os: ubuntu-26.04-arm
            arch: aarch64
            toolchain: GCC
            crypto: openssl
            target: Release
            cflags: -ffat-lto-objects

          - name: ubuntu-26.04-arm-aarch64-clang-mbedtls-debug
            os: ubuntu-26.04-arm
            arch: aarch64
            toolchain: CLANG
            crypto: mbedtls
            target: Debug

          - name: ubuntu-26.04-arm-aarch64-clang-openssl-release
            os: ubuntu-26.04-arm
            arch: aarch64
            toolchain: CLANG
            crypto: openssl
            target: Release

          # == Compiler versions ===========================================
          # Each GCC and Clang major version on the Ubuntu images that no
          # other job uses, in an optimized build, where both warn the most.
          # GitHub retires the Ubuntu 22.04 image on 17-Apr-2027, after
          # brownouts that would fail its jobs, so remove them before those.

          - name: ubuntu-22.04-x64-gcc-10-mbedtls-release
            os: ubuntu-22.04
            arch: x64
            toolchain: GCC
            cc: '10'
            crypto: mbedtls
            target: Release
            cflags: -ffat-lto-objects

          - name: ubuntu-22.04-x64-gcc-11-mbedtls-release
            os: ubuntu-22.04
            arch: x64
            toolchain: GCC
            cc: '11'
            crypto: mbedtls
            target: Release
            cflags: -ffat-lto-objects

          - name: ubuntu-22.04-x64-gcc-12-mbedtls-release
            os: ubuntu-22.04
            arch: x64
            toolchain: GCC
            cc: '12'
            crypto: mbedtls
            target: Release
            cflags: -ffat-lto-objects

          - name: ubuntu-24.04-x64-gcc-14-mbedtls-release
            os: ubuntu-24.04
            arch: x64
            toolchain: GCC
            cc: '14'
            crypto: mbedtls
            target: Release
            cflags: -ffat-lto-objects

          - name: ubuntu-22.04-x64-clang-13-mbedtls-release
            os: ubuntu-22.04
            arch: x64
            toolchain: CLANG
            cc: '13'
            crypto: mbedtls
            target: Release

          - name: ubuntu-22.04-x64-clang-14-mbedtls-release
            os: ubuntu-22.04
            arch: x64
            toolchain: CLANG
            cc: '14'
            crypto: mbedtls
            target: Release

          - name: ubuntu-22.04-x64-clang-15-mbedtls-release
            os: ubuntu-22.04
            arch: x64
            toolchain: CLANG
            cc: '15'
            crypto: mbedtls
            target: Release

          - name: ubuntu-24.04-x64-clang-16-mbedtls-release
            os: ubuntu-24.04
            arch: x64
            toolchain: CLANG
            cc: '16'
            crypto: mbedtls
            target: Release

          - name: ubuntu-24.04-x64-clang-17-mbedtls-release
            os: ubuntu-24.04
            arch: x64
            toolchain: CLANG
            cc: '17'
            crypto: mbedtls
            target: Release

          - name: ubuntu-26.04-x64-clang-20-mbedtls-release
            os: ubuntu-26.04
            arch: x64
            toolchain: CLANG
            cc: '20'
            crypto: mbedtls
            target: Release

          - name: ubuntu-26.04-x64-clang-22-mbedtls-release
            os: ubuntu-26.04
            arch: x64
            toolchain: CLANG
            cc: '22'
            crypto: mbedtls
            target: Release

          # == Newest compiler releases ====================================
          # The newest GCC and LLVM releases, before any runner image has
          # them, with the Ubuntu 26.04 jobs' combinations of architecture,
          # cryptography library and build target. GCC runs in the official
          # gcc image, which is Debian 13. Clang is the LLVM release's own
          # build, checked against the SHA-256 digest that GitHub lists for
          # the release asset, as in
          #   gh release view llvmorg-23.1.4 -R llvm/llvm-project --json assets
          # Update these to each new release. Once an image provides a major
          # version, replace its jobs here with one among the compiler
          # versions above.

          - name: debian-13-x64-gcc-16-mbedtls-debug
            os: ubuntu-26.04
            container: gcc:16.2.0
            arch: x64
            toolchain: GCC
            crypto: mbedtls
            target: Debug

          - name: debian-13-x64-gcc-16-mbedtls-release
            os: ubuntu-26.04
            container: gcc:16.2.0
            arch: x64
            toolchain: GCC
            crypto: mbedtls
            target: Release
            cflags: -ffat-lto-objects

          - name: debian-13-x64-gcc-16-openssl-debug
            os: ubuntu-26.04
            container: gcc:16.2.0
            arch: x64
            toolchain: GCC
            crypto: openssl
            target: Debug

          - name: debian-13-x64-gcc-16-openssl-release
            os: ubuntu-26.04
            container: gcc:16.2.0
            arch: x64
            toolchain: GCC
            crypto: openssl
            target: Release
            cflags: -ffat-lto-objects

          - name: debian-13-aarch64-gcc-16-mbedtls-debug
            os: ubuntu-26.04-arm
            container: gcc:16.2.0
            arch: aarch64
            toolchain: GCC
            crypto: mbedtls
            target: Debug

          - name: debian-13-aarch64-gcc-16-openssl-release
            os: ubuntu-26.04-arm
            container: gcc:16.2.0
            arch: aarch64
            toolchain: GCC
            crypto: openssl
            target: Release
            cflags: -ffat-lto-objects

          - name: ubuntu-26.04-x64-clang-23-mbedtls-debug
            os: ubuntu-26.04
            arch: x64
            toolchain: CLANG
            llvm: '23.1.4'
            llvm_sha256: efdd1dbd089b99bfcfcde7b8eb1236163f2e88df5a981cca4f783ec9cb5e0378
            crypto: mbedtls
            target: Debug

          - name: ubuntu-26.04-x64-clang-23-mbedtls-release
            os: ubuntu-26.04
            arch: x64
            toolchain: CLANG
            llvm: '23.1.4'
            llvm_sha256: efdd1dbd089b99bfcfcde7b8eb1236163f2e88df5a981cca4f783ec9cb5e0378
            crypto: mbedtls
            target: Release

          - name: ubuntu-26.04-x64-clang-23-openssl-debug
            os: ubuntu-26.04
            arch: x64
            toolchain: CLANG
            llvm: '23.1.4'
            llvm_sha256: efdd1dbd089b99bfcfcde7b8eb1236163f2e88df5a981cca4f783ec9cb5e0378
            crypto: openssl
            target: Debug

          - name: ubuntu-26.04-x64-clang-23-openssl-release
            os: ubuntu-26.04
            arch: x64
            toolchain: CLANG
            llvm: '23.1.4'
            llvm_sha256: efdd1dbd089b99bfcfcde7b8eb1236163f2e88df5a981cca4f783ec9cb5e0378
            crypto: openssl
            target: Release

          - name: ubuntu-26.04-arm-aarch64-clang-23-mbedtls-debug
            os: ubuntu-26.04-arm
            arch: aarch64
            toolchain: CLANG
            llvm: '23.1.4'
            llvm_sha256: 0975f753e0f9b5f83146a7a2f4678bc143e713496b56520716a4de047a63f99f
            crypto: mbedtls
            target: Debug

          - name: ubuntu-26.04-arm-aarch64-clang-23-openssl-release
            os: ubuntu-26.04-arm
            arch: aarch64
            toolchain: CLANG
            llvm: '23.1.4'
            llvm_sha256: 0975f753e0f9b5f83146a7a2f4678bc143e713496b56520716a4de047a63f99f
            crypto: openssl
            target: Release

          # == macOS 15 ====================================================
          # Xcode 16 by default. posix runs macOS 26.

          - name: macos-15-aarch64-clang-mbedtls-debug
            os: macos-15
            arch: aarch64
            toolchain: CLANG
            crypto: mbedtls
            target: Debug

          - name: macos-15-aarch64-clang-openssl-release
            os: macos-15
            arch: aarch64
            toolchain: CLANG
            crypto: openssl
            target: Release

          - name: macos-15-intel-x64-clang-mbedtls-debug
            os: macos-15-intel
            arch: x64
            toolchain: CLANG
            crypto: mbedtls
            target: Debug

          - name: macos-15-intel-x64-clang-openssl-release
            os: macos-15-intel
            arch: x64
            toolchain: CLANG
            crypto: openssl
            target: Release

    steps:
      # The gcc image runs as root, without sudo, and has the git that Checkout
      # clones with, but not CMake. With zstd, actions/cache compresses as it
      # does outside a container, and so finds cmocka's entry.
      - name: Prepare container
        if: matrix.container != ''
        shell: bash
        run: |
          # As in Configure, but as root.
          apt_install() {
            for attempt in 1 2 3; do
              if timeout -k 10 300 apt-get update &&
                 timeout -k 10 300 apt-get install --no-install-recommends -y "$@"; then
                return 0
              fi
              echo "apt-get install $* failed, attempt $attempt"
              sleep $((attempt * 15))
            done
            return 1
          }

          apt_install cmake zstd

          # The workspace belongs to the runner's user rather than root, so git
          # refuses it as dubious. Checkout marks it safe only for its own step.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The submodules are fetched in a later step so that cmocka can be served
          # from the cache. A fetch failure inside this step aborts the job before
          # any cache is consulted, which is what makes cmocka's host a source of
          # unrelated test failures.
          submodules: false
          # Nothing after this step needs to talk to the remote, and the jobs
          # run build scripts from the pull request's own tree.
          persist-credentials: false

      # cmocka is the only submodule not hosted on github.com, and gitlab.com is
      # reachable less reliably from the runners. Its source does not vary by
      # configuration, so a single entry keyed on the pinned revision serves every
      # matrix entry, and gitlab.com is contacted only when that pin moves.
      - name: cmocka revision
        id: cmocka
        shell: bash
        run: |
          echo "sha=$(git ls-tree HEAD unit_test/cmockalib/cmocka | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: Cache cmocka
        id: cmocka-cache
        uses: actions/cache@v6
        with:
          path: unit_test/cmockalib/cmocka
          key: cmocka-${{ steps.cmocka.outputs.sha }}

      - name: Fetch submodules
        shell: bash
        run: |
          # Retry rather than fail the job on a transient fetch error. A cache hit
          # means cmocka is already present, so it is not fetched at all.
          fetch() {
            local path=$1
            shift
            for attempt in 1 2 3; do
              if git submodule update --init "$@" "$path"; then
                return 0
              fi
              echo "fetch of $path failed, attempt $attempt"
              sleep $((attempt * 15))
            done
            return 1
          }

          if [ "${{ steps.cmocka-cache.outputs.cache-hit }}" != "true" ]; then
            fetch unit_test/cmockalib/cmocka --recursive
          else
            # The cached .git file points into .git/modules, which this
            # checkout does not have, and git submodule commands fail on it.
            rm -f unit_test/cmockalib/cmocka/.git
          fi
          fetch os_stub/mbedtlslib/mbedtls --recursive
          # libspdm builds OpenSSL from the pinned commit's source alone, so
          # neither its history nor its own submodules are fetched.
          if [ "${{ matrix.crypto }}" = "openssl" ]; then
            fetch os_stub/openssllib/openssl --depth 1
          fi
      # As in the posix family, except that the key names the compiler: the
      # image's default, the container's, or the LLVM release.
      - name: OpenSSL revision
        id: ossl
        shell: bash
        run: |
          echo "sha=$(git -C os_stub/openssllib/openssl rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Cache OpenSSL build
        if: matrix.crypto == 'openssl'
        uses: actions/cache@v6
        with:
          path: build/os_stub/openssllib
          key: openssl-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.toolchain }}-${{ matrix.container || matrix.llvm || 'default' }}-${{ steps.ossl.outputs.sha }}-${{ steps.ossl.outputs.image }}
          restore-keys: |
            openssl-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.toolchain }}-${{ matrix.container || matrix.llvm || 'default' }}-${{ steps.ossl.outputs.sha }}-

      # The GCC and CLANG toolchain files run the unversioned gcc and gcc-ar,
      # or clang, llvm-ar and llvm-ranlib. A job that names a compiler version
      # puts links from those names to that version first on PATH, and a job
      # that names an LLVM release puts the release's own build there.
      - name: Select compiler
        if: matrix.cc != '' || matrix.llvm != ''
        shell: bash
        run: |
          # A stalled mirror can outlast apt-get's own timeouts, so each attempt
          # is bounded, and a failed one is retried.
          apt_install() {
            for attempt in 1 2 3; do
              if sudo timeout -k 10 300 apt-get update &&
                 sudo timeout -k 10 300 apt-get install --no-install-recommends -y "$@"; then
                return 0
              fi
              echo "apt-get install $* failed, attempt $attempt"
              sleep $((attempt * 15))
            done
            return 1
          }

          if [ -n "${{ matrix.llvm }}" ]; then
            release="${{ matrix.llvm }}"
            if [ "${{ matrix.arch }}" = "x64" ]; then
              asset="LLVM-$release-Linux-X64.tar.zst"
            else
              asset="LLVM-$release-Linux-ARM64.tar.zst"
            fi
            url="https://github.com/llvm/llvm-project/releases/download/llvmorg-$release/$asset"
            # For the reproducer.
            echo "LLVM_URL=$url" >> "$GITHUB_ENV"
            for attempt in 1 2 3; do
              if curl -fsSL --connect-timeout 30 --max-time 900 -o "$RUNNER_TEMP/$asset" "$url"; then
                break
              fi
              echo "download of $asset failed, attempt $attempt"
              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi
              sleep $((attempt * 15))
            done
            echo "${{ matrix.llvm_sha256 }}  $RUNNER_TEMP/$asset" | sha256sum --check --strict

            # The archive expands to 12 GB, and zstd decodes its 2 GiB window
            # only when told to. The build needs about 0.6 GB of it.
            llvm="$RUNNER_TEMP/llvm"
            mkdir -p "$llvm"
            zstd --decompress --long=31 --stdout "$RUNNER_TEMP/$asset" |
              tar -x -C "$llvm" --strip-components=1 --wildcards \
                '*/bin/clang' "*/bin/clang-${release%%.*}" '*/bin/lld' '*/bin/ld.lld' \
                '*/bin/llvm-ar' '*/bin/llvm-ranlib' '*/lib/clang/*'
            rm "$RUNNER_TEMP/$asset"

            # The release has no LLVMgold.so, the plugin with which the system
            # linker runs link-time optimization, so clang links with the
            # release's lld. A configuration file reaches every link, including
            # test_size's, whose linker flags replace LDFLAGS.
            echo "-fuse-ld=lld" > "$llvm/bin/clang.cfg"
            echo "$llvm/bin" >> "$GITHUB_PATH"
            "$llvm/bin/clang" --version
            exit 0
          fi

          if [ "${{ matrix.toolchain }}" = "GCC" ]; then
            tools="gcc gcc-ar"
          else
            # llvm-N provides llvm-ar-N and llvm-ranlib-N, and the linker
            # plugin that link-time optimization with clang-N needs.
            apt_install "llvm-${{ matrix.cc }}"
            tools="clang llvm-ar llvm-ranlib"
          fi
          bin="$RUNNER_TEMP/compiler-bin"
          mkdir -p "$bin"
          for tool in $tools; do
            path=$(command -v "$tool-${{ matrix.cc }}") || {
              echo "::error::$tool-${{ matrix.cc }} is not installed"
              exit 1
            }
            ln -s "$path" "$bin/$tool"
          done
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/${tools%% *}" --version

      - name: Configure
        shell: bash
        env:
          CFLAGS: ${{ env.BASE_CFLAGS }} ${{ matrix.cflags }}
        run: |
          # A stalled mirror can outlast apt-get's own timeouts, so each attempt
          # is bounded, and a failed one is retried.
          apt_install() {
            for attempt in 1 2 3; do
              if sudo timeout -k 10 300 apt-get update &&
                 sudo timeout -k 10 300 apt-get install --no-install-recommends -y "$@"; then
                return 0
              fi
              echo "apt-get install $* failed, attempt $attempt"
              sleep $((attempt * 15))
            done
            return 1
          }

          # The CLANG toolchain archives static libraries with llvm-ar,
          # which is not present on the stock Linux image. Select compiler
          # installs it for a job that names a compiler version or an LLVM
          # release.
          if [ "${{ matrix.toolchain }}" = "CLANG" ] && [ "${{ runner.os }}" = "Linux" ] &&
             [ -z "${{ matrix.cc }}" ] && [ -z "${{ matrix.llvm }}" ]; then
            apt_install llvm
          fi

          cmake -B build \
            -DARCH=${{ matrix.arch }} \
            -DTOOLCHAIN=${{ matrix.toolchain }} \
            -DTARGET=${{ matrix.target }} \
            -DCRYPTO=${{ matrix.crypto }}

      - name: Build
        shell: bash
        run: |
          # Discover the core count rather than assuming it, so the build keeps
          # pace if runner specs change. A bare `--parallel` means an unbounded
          # -j, which exhausts the smaller runners.
          jobs=$(getconf _NPROCESSORS_ONLN 2>/dev/null || nproc 2>/dev/null || echo 2)
          echo "Building with --parallel $jobs"

          cmake --build build --target copy_sample_key
          cmake --build build --parallel "$jobs"

      # As in the posix family: one step per test, each bounded so that a hang
      # fails the job.
      - name: Prepare test runner
        shell: bash
        run: |
          cat > run_test.sh <<'RUNNER'
          #!/usr/bin/env bash
          set -uo pipefail
          t="$1"

          if [ ! -x "build/bin/$t" ]; then
            echo "::error::$t was not built"
            echo "- \`$t\`: **not built**" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 1
          fi

          # macOS has no GNU timeout; fall back to gtimeout, then to perl.
          if command -v timeout >/dev/null 2>&1; then
            ( cd build/bin && timeout 600 "./$t" )
          elif command -v gtimeout >/dev/null 2>&1; then
            ( cd build/bin && gtimeout 600 "./$t" )
          else
            ( cd build/bin && perl -e 'alarm shift; exec @ARGV' 600 "./$t" )
          fi
          rc=$?

          if [ "$rc" -eq 0 ]; then
            echo "- \`$t\`: pass" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          else
            echo "- \`$t\`: **FAIL** (exit $rc)" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            echo "::error::$t failed with exit $rc"
          fi
          exit $rc
          RUNNER
          chmod +x run_test.sh
          echo "### ${{ env.JOB_NAME }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Test Requester
        shell: bash
        run: ./run_test.sh test_spdm_requester

      - name: Test Responder
        shell: bash
        run: ./run_test.sh test_spdm_responder

      - name: Test Common
        shell: bash
        run: ./run_test.sh test_spdm_common

      - name: Test SPDM Crypt
        shell: bash
        run: ./run_test.sh test_spdm_crypt

      - name: Test Crypt
        shell: bash
        run: ./run_test.sh test_crypt

      - name: Test Secured Message
        shell: bash
        run: ./run_test.sh test_spdm_secured_message

      - name: Test Transport
        shell: bash
        run: ./run_test.sh test_spdm_transport

      # As in the posix family, generated from the job's own variables so that
      # it cannot drift from what ran, including the links or LLVM release
      # that Select compiler installs.
      - name: Generate reproducer
        if: always()
        shell: bash
        run: |
          mkdir -p repro

          ccfile=""
          if [ -d build/CMakeFiles ]; then
            ccfile=$(find build/CMakeFiles -name CMakeCCompiler.cmake -print -quit)
          fi
          cid=$(sed -n 's/^set(CMAKE_C_COMPILER_ID "\(.*\)")/\1/p' "$ccfile" 2>/dev/null || true)
          cver=$(sed -n 's/^set(CMAKE_C_COMPILER_VERSION "\(.*\)")/\1/p' "$ccfile" 2>/dev/null || true)
          compiler="${cid:-unknown} ${cver:-unknown}"
          image="${ImageOS:-unknown} ${ImageVersion:-unknown}"
          runner="${{ matrix.os }} (image $image)"
          if [ -n "${{ matrix.container }}" ]; then
            runner="$runner, container ${{ matrix.container }}"
          fi
          if [ -r /etc/os-release ]; then
            osname=$(grep -m1 '^PRETTY_NAME=' /etc/os-release | cut -d= -f2- | tr -d '"' || true)
          else
            osname="$(sw_vers -productName) $(sw_vers -productVersion)"
          fi
          kernel=$(uname -srm 2>/dev/null)
          url="${{ github.server_url }}/${{ github.repository }}"
          run_url="$url/actions/runs/${{ github.run_id }}"
          pins=$(git submodule status 2>/dev/null | awk '{print $2" "$1}' || true)

          header="Reproduces: ${{ env.JOB_NAME }}
          Run:        $run_url
          Runner:     $runner
          OS:         ${osname:-unknown}
          Kernel:     ${kernel:-unknown}
          Compiler:   $compiler
          NOTE: this restores the source tree, not the toolchain. If your
                compiler differs from the one above, a non-reproduction is
                inconclusive rather than a refutation."

          f=repro/repro.sh
          { echo "#!/usr/bin/env bash"
            echo "$header" | sed 's/^/# /'
            echo "set -euo pipefail"
            echo
            if [ -n "${{ matrix.container }}" ]; then
              echo "# Run this in the ${{ matrix.container }} image, with CMake installed:"
              echo "#   docker run --rm -it ${{ matrix.container }} bash"
              echo "#   apt-get update && apt-get install -y cmake"
              echo
            fi
            echo "git clone $url.git libspdm-repro"
            echo "cd libspdm-repro"
            echo "git checkout ${{ github.sha }}"
            echo "git submodule update --init --recursive unit_test/cmockalib/cmocka os_stub/mbedtlslib/mbedtls"
            if [ "${{ matrix.crypto }}" = "openssl" ]; then
              echo "git submodule update --init --depth 1 os_stub/openssllib/openssl"
            fi
            echo "$pins" | sed 's/^/# pinned: /'
            echo
            if [ -n "${{ matrix.cc }}" ]; then
              if [ "${{ matrix.toolchain }}" = "GCC" ]; then
                tools="gcc gcc-ar"
              else
                echo "# Needs clang-${{ matrix.cc }} and llvm-${{ matrix.cc }}."
                tools="clang llvm-ar llvm-ranlib"
              fi
              echo "mkdir -p compiler-bin"
              for tool in $tools; do
                echo "ln -sf \"\$(command -v $tool-${{ matrix.cc }})\" compiler-bin/$tool"
              done
              echo 'export PATH="$PWD/compiler-bin:$PATH"'
            fi
            if [ -n "${LLVM_URL:-}" ]; then
              asset=$(basename "$LLVM_URL")
              echo "curl -fsSLO $LLVM_URL"
              echo "echo '${{ matrix.llvm_sha256 }}  $asset' | sha256sum --check --strict"
              echo "mkdir -p llvm"
              echo "zstd --decompress --long=31 --stdout $asset | tar -x -C llvm --strip-components=1"
              echo "echo -fuse-ld=lld > llvm/bin/clang.cfg"
              echo 'export PATH="$PWD/llvm/bin:$PATH"'
            fi
            echo "export CFLAGS='${{ env.BASE_CFLAGS }} ${{ matrix.cflags }}'"
            echo "cmake -B build -DARCH=${{ matrix.arch }} -DTOOLCHAIN=${{ matrix.toolchain }} -DTARGET=${{ matrix.target }} -DCRYPTO=${{ matrix.crypto }}"
            echo "cmake --build build --target copy_sample_key"
            echo "cmake --build build --parallel \"\$(getconf _NPROCESSORS_ONLN)\""
            echo
            echo "cd build/bin"
            for t in $UNIT_TESTS; do echo "if [ -x ./$t ]; then ./$t; fi"; done
          } > "$f"
          chmod +x "$f"

          echo "$header"

          { echo "<details><summary>Reproducer</summary>"
            echo
            echo '```'
            cat "$f"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reproducer
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: repro-${{ env.JOB_NAME }}
          path: |
            repro/
            build/CMakeCache.txt
          retention-days: 14

  windows-msvc:
    name: ${{ format('windows-{0}-{1}-{2}-{3}{4}', matrix.arch, matrix.tc, matrix.crypto, matrix.tgt, matrix.variant && format('-{0}', matrix.variant) || '') }}
    if: github.repository == 'DMTF/libspdm' || github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      JOB_NAME: ${{ format('windows-{0}-{1}-{2}-{3}{4}', matrix.arch, matrix.tc, matrix.crypto, matrix.tgt, matrix.variant && format('-{0}', matrix.variant) || '') }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        toolchain: [VS, CLANG]
        arch: [x64, ia32, aarch64]
        crypto: [mbedtls, openssl]
        target: [Debug, Release]
        # The image's default VC++ toolset. The jobs at the end of include name
        # another, which this value keeps from merging into the jobs above.
        toolset: ['']
        # The default configuration. The variant jobs at the end of include
        # change it, and this value keeps them separate in the same way.
        variant: ['']
        include:
          - {os: windows-latest, generator: NMake Makefiles}
          - {arch: x64, msvc_arch: x64}
          - {arch: ia32, msvc_arch: x86}
          # include may replace the os that the first entry added, since os is
          # not a matrix key.
          - {arch: aarch64, msvc_arch: arm64, os: windows-11-arm}
          # Lower-case spellings for the job name.
          - {toolchain: VS, tc: vs}
          - {toolchain: CLANG, tc: clang}
          - {target: Debug, tgt: debug}
          - {target: Release, tgt: release}
          # Older VC++ toolsets that the image installs beside its default:
          # VS 2022's and VS 2019's. As with GCC and Clang, the toolchain does
          # not name the compiler version. They use Mbed TLS, since the
          # OpenSSL cache key does not name the toolset.
          - {toolchain: VS, toolset: '14.44', tc: vs-14.44, os: windows-latest, generator: NMake Makefiles, arch: x64, msvc_arch: x64, crypto: mbedtls, target: Release, tgt: release}
          - {toolchain: VS, toolset: '14.44', tc: vs-14.44, os: windows-latest, generator: NMake Makefiles, arch: ia32, msvc_arch: x86, crypto: mbedtls, target: Debug, tgt: debug}
          - {toolchain: VS, toolset: '14.29', tc: vs-14.29, os: windows-latest, generator: NMake Makefiles, arch: x64, msvc_arch: x64, crypto: mbedtls, target: Release, tgt: release}
          - {toolchain: VS, toolset: '14.29', tc: vs-14.29, os: windows-latest, generator: NMake Makefiles, arch: ia32, msvc_arch: x86, crypto: mbedtls, target: Debug, tgt: debug}
          # Configurations that the configs family sweeps on Linux, here with
          # MSVC, and AddressSanitizer. The sanitizer runs on ia32 because x64
          # also builds the test_size images, which link without the C runtime
          # that the sanitizer's runtime needs.
          - toolchain: VS
            variant: fips
            tc: vs
            os: windows-latest
            generator: NMake Makefiles
            arch: x64
            msvc_arch: x64
            crypto: mbedtls
            target: Debug
            tgt: debug
            cflags: -DLIBSPDM_FIPS_MODE=1
            extra_tests: test_spdm_fips
          - toolchain: VS
            variant: fips
            tc: vs
            os: windows-latest
            generator: NMake Makefiles
            arch: x64
            msvc_arch: x64
            crypto: openssl
            target: Debug
            tgt: debug
            cflags: -DLIBSPDM_FIPS_MODE=1
            extra_tests: test_spdm_fips
          - toolchain: VS
            variant: fips
            tc: vs
            os: windows-latest
            generator: NMake Makefiles
            arch: ia32
            msvc_arch: x86
            crypto: mbedtls
            target: Debug
            tgt: debug
            cflags: -DLIBSPDM_FIPS_MODE=1
            extra_tests: test_spdm_fips
          - toolchain: VS
            variant: record-transcript
            tc: vs
            os: windows-latest
            generator: NMake Makefiles
            arch: x64
            msvc_arch: x64
            crypto: mbedtls
            target: Debug
            tgt: debug
            cflags: -DLIBSPDM_RECORD_TRANSCRIPT_DATA_SUPPORT=1
          - toolchain: VS
            variant: minimal-caps
            tc: vs
            os: windows-latest
            generator: NMake Makefiles
            arch: x64
            msvc_arch: x64
            crypto: mbedtls
            target: Debug
            tgt: debug
            cflags: >-
              -DLIBSPDM_ENABLE_CAPABILITY_PSK_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_HBEAT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_MUT_AUTH_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_ENCAP_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_CSR_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_SET_CERT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_CHUNK_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_MEL_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_EVENT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_GET_KEY_PAIR_INFO_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_SET_KEY_PAIR_INFO_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_ENDPOINT_INFO_CAP=0
              -DLIBSPDM_EVENT_RECIPIENT_SUPPORT=0
              -DLIBSPDM_SEND_GET_ENDPOINT_INFO_SUPPORT=0
          - toolchain: VS
            variant: asan
            tc: vs
            os: windows-latest
            generator: NMake Makefiles
            arch: ia32
            msvc_arch: x86
            crypto: mbedtls
            target: Debug
            tgt: debug
            cflags: /fsanitize=address

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The submodules are fetched in a later step so that cmocka can be served
          # from the cache. A fetch failure inside this step aborts the job before
          # any cache is consulted, which is what makes cmocka's host a source of
          # unrelated test failures.
          submodules: false
          # Nothing after this step needs to talk to the remote, and the jobs
          # run build scripts from the pull request's own tree.
          persist-credentials: false

      # cmocka is the only submodule not hosted on github.com, and gitlab.com is
      # reachable less reliably from the runners. Its source does not vary by
      # configuration, so a single entry keyed on the pinned revision serves every
      # matrix entry, and gitlab.com is contacted only when that pin moves.
      - name: cmocka revision
        id: cmocka
        shell: bash
        run: |
          echo "sha=$(git ls-tree HEAD unit_test/cmockalib/cmocka | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: Cache cmocka
        id: cmocka-cache
        uses: actions/cache@v6
        with:
          path: unit_test/cmockalib/cmocka
          key: cmocka-${{ steps.cmocka.outputs.sha }}

      - name: Fetch submodules
        shell: bash
        run: |
          # Retry rather than fail the job on a transient fetch error. A cache hit
          # means cmocka is already present, so it is not fetched at all.
          fetch() {
            local path=$1
            shift
            for attempt in 1 2 3; do
              if git submodule update --init "$@" "$path"; then
                return 0
              fi
              echo "fetch of $path failed, attempt $attempt"
              sleep $((attempt * 15))
            done
            return 1
          }

          if [ "${{ steps.cmocka-cache.outputs.cache-hit }}" != "true" ]; then
            fetch unit_test/cmockalib/cmocka --recursive
          else
            # The cached .git file points into .git/modules, which this
            # checkout does not have, and git submodule commands fail on it.
            rm -f unit_test/cmockalib/cmocka/.git
          fi
          fetch os_stub/mbedtlslib/mbedtls --recursive
          # libspdm builds OpenSSL from the pinned commit's source alone, so
          # neither its history nor its own submodules are fetched.
          if [ "${{ matrix.crypto }}" = "openssl" ]; then
            fetch os_stub/openssllib/openssl --depth 1
          fi
      # OpenSSL is an ExternalProject with its own CFLAGS, so no LIBSPDM_*
      # macro reaches it: one entry serves every configuration on a given
      # platform. Measured at ~100 MB on POSIX and ~344 MB on Windows, so
      # caching the tree wholesale is affordable and avoids maintaining a
      # list of which paths have consumers -- the Windows DLL lives in the
      # build tree, not the install tree, which such a list would miss.
      - name: OpenSSL revision
        id: ossl
        shell: bash
        run: |
          echo "sha=$(git -C os_stub/openssllib/openssl rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      # The OpenSSL revision precedes the runner image in the key so that
      # restore-keys can fall back to the same revision's tree from an older
      # image, rather than rebuilding whenever an image rollout lands. The
      # fallback therefore reuses objects from the older image's compiler
      # until the revision changes. Because the prefix pins the revision,
      # stamps from one revision are never paired with a tree from another.
      # The key omits TARGET and the macros because neither changes what
      # OpenSSL builds.
      - name: Cache OpenSSL build
        if: matrix.crypto == 'openssl'
        uses: actions/cache@v6
        with:
          path: build/os_stub/openssllib
          key: openssl-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.toolchain }}-${{ steps.ossl.outputs.sha }}-${{ steps.ossl.outputs.image }}
          restore-keys: |
            openssl-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.toolchain }}-${{ steps.ossl.outputs.sha }}-

      - name: Set up MSVC
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0
        with:
          arch: ${{ matrix.msvc_arch }}
          # Empty, which keeps the default, except in the older toolset jobs.
          toolset: ${{ matrix.toolset }}

      # The CLANG toolchain runs clang-cl and lld-link from PATH. Put the
      # image's LLVM there explicitly rather than depend on whether the image
      # or the developer environment already does.
      - name: Set up LLVM
        if: matrix.toolchain == 'CLANG'
        run: |
          $llvm = "$env:ProgramFiles\LLVM\bin"
          if (-not (Test-Path "$llvm\clang-cl.exe")) {
            Write-Output "::error::clang-cl.exe not found in $llvm"
            exit 1
          }
          Add-Content -Path $env:GITHUB_PATH -Value $llvm
          & "$llvm\clang-cl.exe" --version

      # Windows/MSVC uses the default shell rather than bash: OpenSSL's
      # Configure is a Perl script, and under Git Bash `perl` resolves to the
      # bundled MSYS interpreter, which lacks modules Configure requires.
      - name: Configure (Windows/MSVC)
        env:
          CFLAGS: ${{ env.BASE_CFLAGS }} ${{ matrix.cflags }}
        run: |
          cmake -B build -G "${{ matrix.generator }}" `
            -DARCH=${{ matrix.arch }} `
            -DTOOLCHAIN=${{ matrix.toolchain }} `
            -DTARGET=${{ matrix.target }} `
            -DCRYPTO=${{ matrix.crypto }} `
            ${{ matrix.cmake_extra }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build (Windows/MSVC)
        run: |
          if ('${{ matrix.expect_tests }}' -ne 'false') {
            cmake --build build --target copy_sample_key
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          cmake --build build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Implements "For any configuration, run all basic unit tests", plus any
      # extended unit test whose requirement this configuration satisfies.
      # Each test is bounded so a hang fails the job instead of stalling it.
      # One step per test, so the Actions UI shows a separate pass/fail entry
      # for each. A single looping step buries later tests below the log
      # viewer's truncation point. The shared runner keeps the binary lookup
      # and the timeout guard in one place rather than in six copies.
      - name: Prepare test runner
        if: matrix.expect_tests != 'false'
        shell: bash
        run: |
          cat > run_test.sh <<'RUNNER'
          #!/usr/bin/env bash
          set -uo pipefail
          t="$1"

          exe=""
          if [ -x "build/bin/$t" ]; then
            exe="$t"
          elif [ -x "build/bin/$t.exe" ]; then
            exe="$t.exe"
          fi

          # Basic unit tests require no additional configuration, so a missing
          # one means coverage was lost rather than legitimately skipped.
          if [ -z "$exe" ]; then
            echo "::error::$t was not built"
            echo "- \`$t\`: **not built**" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 1
          fi

          # macOS has no GNU timeout; fall back to gtimeout, then to perl.
          if command -v timeout >/dev/null 2>&1; then
            ( cd build/bin && timeout 600 "./$exe" )
          elif command -v gtimeout >/dev/null 2>&1; then
            ( cd build/bin && gtimeout 600 "./$exe" )
          else
            ( cd build/bin && perl -e 'alarm shift; exec @ARGV' 600 "./$exe" )
          fi
          rc=$?

          if [ "$rc" -eq 0 ]; then
            echo "- \`$t\`: pass" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          else
            echo "- \`$t\`: **FAIL** (exit $rc)" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            echo "::error::$t failed with exit $rc"
          fi
          exit $rc
          RUNNER
          chmod +x run_test.sh
          echo "### ${{ env.JOB_NAME }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Test Requester
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_spdm_requester

      - name: Test Responder
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_spdm_responder

      - name: Test Common
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_spdm_common

      - name: Test SPDM Crypt
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_spdm_crypt

      - name: Test Crypt
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_crypt

      - name: Test Secured Message
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_spdm_secured_message

      - name: Test Transport
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_spdm_transport

      # Extended unit test: runs only where its requirement is satisfied.
      - name: Test FIPS
        if: contains(matrix.extra_tests, 'test_spdm_fips')
        shell: bash
        run: ./run_test.sh test_spdm_fips

      # DISABLE_TESTS gates 87 test subdirectories, so this checks that nothing
      # test-shaped was produced, and that libraries still were -- otherwise an
      # empty build tree would satisfy the check vacuously.
      - name: Verify no tests were built
        if: matrix.expect_tests == 'false'
        shell: bash
        run: |
          # build/bin does not exist when tests are disabled. Redirecting find's
          # stderr hides the message but not its exit status, which pipefail
          # propagates and set -e turns into a silent step failure, so test for
          # the directory instead of relying on 2>/dev/null.
          if [ -d build/bin ]; then
            stray=$(find build/bin -maxdepth 1 -name 'test_*' | wc -l)
          else
            stray=0
          fi
          if [ -d build ]; then
            libs=$(find build -type f \( -name '*.a' -o -name '*.lib' \) | wc -l)
          else
            libs=0
          fi
          echo "DISABLE_TESTS check: $stray test artifacts under build/bin, $libs libraries built"
          {
            echo "### ${{ env.JOB_NAME }}"
            echo ""
            echo "DISABLE_TESTS: $stray test artifacts, $libs libraries"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$stray" -ne 0 ]; then
            echo "::error::DISABLE_TESTS was set but build/bin holds $stray test artifacts"
            exit 1
          fi
          if [ "$libs" -eq 0 ]; then
            echo "::error::DISABLE_TESTS build produced no libraries; the check would pass vacuously"
            exit 1
          fi
      # Reproducer, generated from the job's own variables so that it cannot
      # drift from what actually ran. The script restores the source tree but
      # not the toolchain, so the compiler identity is recorded in the header:
      # identical source can produce different diagnostics on different
      # compiler versions.
      - name: Generate reproducer
        if: always()
        shell: bash
        run: |
          mkdir -p repro

          # A failed configure leaves no build tree, and this step runs on
          # always(). "ls ... | head" exits non-zero there, which pipefail and
          # set -e turn into a silent step failure, losing the reproducer in
          # exactly the case that most needs one.
          ccfile=""
          if [ -d build/CMakeFiles ]; then
            ccfile=$(find build/CMakeFiles -name CMakeCCompiler.cmake -print -quit)
          fi
          cid=$(sed -n 's/^set(CMAKE_C_COMPILER_ID "\(.*\)")/\1/p' "$ccfile" 2>/dev/null || true)
          cver=$(sed -n 's/^set(CMAKE_C_COMPILER_VERSION "\(.*\)")/\1/p' "$ccfile" 2>/dev/null || true)
          compiler="${cid:-unknown} ${cver:-unknown}"
          image="${ImageOS:-unknown} ${ImageVersion:-unknown}"

          # The image label identifies the runner build, not what is actually
          # underneath it. Record the distro and kernel too, so a reader can
          # tell how far their machine differs from the one that failed.
          if [ -r /etc/os-release ]; then
            osname=$(grep -m1 '^PRETTY_NAME=' /etc/os-release | cut -d= -f2- | tr -d '"' || true)
          elif command -v sw_vers >/dev/null 2>&1; then
            osname="$(sw_vers -productName) $(sw_vers -productVersion)"
          else
            osname=$(cmd //c ver 2>/dev/null | tr -d '[:cntrl:]' | grep -m1 Windows || true)
          fi
          kernel=$(uname -srm 2>/dev/null)
          url="${{ github.server_url }}/${{ github.repository }}"
          run_url="$url/actions/runs/${{ github.run_id }}"

          # On a pull_request event github.sha is the ephemeral merge commit
          # under refs/pull/N/merge, which a plain clone does not fetch. Fetch
          # that ref explicitly so the script checks out what CI actually built.
          pr="${{ github.event.pull_request.number }}"
          if [ -n "$pr" ]; then
            fetch_ref="git fetch origin refs/pull/$pr/merge"
            checkout_ref="git checkout FETCH_HEAD"
          else
            fetch_ref=""
            checkout_ref="git checkout ${{ github.sha }}"
          fi

          # Informational: the checkout above already pins these, but recording
          # them lets a reader verify the tree is what the job built.
          pins=$(git submodule status 2>/dev/null | awk '{print $2" "$1}' || true)

          header="Reproduces: ${{ env.JOB_NAME }}
          Run:        $run_url
          Runner:     ${{ matrix.os }} (image $image)
          OS:         ${osname:-unknown}
          Kernel:     ${kernel:-unknown}
          Compiler:   $compiler
          NOTE: this restores the source tree, not the toolchain. If your
                compiler differs from the one above, a non-reproduction is
                inconclusive rather than a refutation."

          if [ "${{ runner.os }}" = "Windows" ] && [ -z "${{ matrix.shell }}" ]; then
            f=repro/repro.bat
            { echo "@echo off"
              echo "$header" | sed 's/^/REM /'
              echo "REM Run from a Visual Studio Developer Command Prompt for ${{ matrix.msvc_arch }}."
              if [ -n "${{ matrix.toolset }}" ]; then
                echo "REM Open it with -vcvars_ver=${{ matrix.toolset }}."
              fi
              echo
              echo "git clone $url.git libspdm-repro || exit /b 1"
              echo "cd libspdm-repro || exit /b 1"
              if [ -n "$fetch_ref" ]; then echo "$fetch_ref || exit /b 1"; fi
              echo "$checkout_ref || exit /b 1"
              echo "git submodule update --init --recursive unit_test/cmockalib/cmocka os_stub/mbedtlslib/mbedtls || exit /b 1"
              if [ "${{ matrix.crypto }}" = "openssl" ]; then
                echo "git submodule update --init --depth 1 os_stub/openssllib/openssl || exit /b 1"
              fi
              echo "$pins" | sed 's/^/REM pinned: /'
              echo
              if [ "${{ matrix.toolchain }}" = "CLANG" ]; then
                echo "set \"PATH=%ProgramFiles%\\LLVM\\bin;%PATH%\""
              fi
              echo "set CFLAGS=${{ env.BASE_CFLAGS }} ${{ matrix.cflags }}"
              echo "cmake -B build -G \"${{ matrix.generator }}\" -DARCH=${{ matrix.arch }} -DTOOLCHAIN=${{ matrix.toolchain }} -DTARGET=${{ matrix.target }} -DCRYPTO=${{ matrix.crypto }} ${{ matrix.cmake_extra }} || exit /b 1"
              echo "cmake --build build --target copy_sample_key"
              echo "cmake --build build || exit /b 1"
              echo
              echo "cd build\\bin"
              for t in $UNIT_TESTS ${{ matrix.extra_tests }}; do echo "if exist $t.exe $t.exe"; done
            } > "$f"
          else
            f=repro/repro.sh
            { echo "#!/usr/bin/env bash"
              echo "$header" | sed 's/^/# /'
              if [ -n "${{ matrix.shell }}" ]; then
                echo "# Run inside an MSYS2 ${{ matrix.msystem }} shell."
              fi
              echo "set -euo pipefail"
              echo
              echo "git clone $url.git libspdm-repro"
              echo "cd libspdm-repro"
              if [ -n "$fetch_ref" ]; then echo "$fetch_ref"; fi
              echo "$checkout_ref"
              echo "git submodule update --init --recursive unit_test/cmockalib/cmocka os_stub/mbedtlslib/mbedtls"
              if [ "${{ matrix.crypto }}" = "openssl" ]; then
                echo "git submodule update --init --depth 1 os_stub/openssllib/openssl"
              fi
              echo "$pins" | sed 's/^/# pinned: /'
              echo
              echo "export CFLAGS='${{ env.BASE_CFLAGS }} ${{ matrix.cflags }}'"
              if [ -n "${{ matrix.generator }}" ]; then
                echo "cmake -B build -G \"${{ matrix.generator }}\" -DARCH=${{ matrix.arch }} -DTOOLCHAIN=${{ matrix.toolchain }} -DTARGET=${{ matrix.target }} -DCRYPTO=${{ matrix.crypto }} ${{ matrix.cmake_extra }}"
              else
                echo "cmake -B build -DARCH=${{ matrix.arch }} -DTOOLCHAIN=${{ matrix.toolchain }} -DTARGET=${{ matrix.target }} -DCRYPTO=${{ matrix.crypto }} ${{ matrix.cmake_extra }}"
              fi
              echo "cmake --build build --target copy_sample_key"
              echo "cmake --build build --parallel \"\$(getconf _NPROCESSORS_ONLN)\""
              echo
              echo "cd build/bin"
              for t in $UNIT_TESTS ${{ matrix.extra_tests }}; do echo "if [ -x ./$t ]; then ./$t; fi"; done
            } > "$f"
            chmod +x "$f"
          fi

          # The step log is the first place anyone looks, and unlike the job
          # summary it is reachable from the API, so echo the platform
          # identity there too.
          echo "$header"

          # Legibility for every run, not just failures: the invocation is
          # visible in the UI without downloading anything.
          { echo "<details><summary>Reproducer</summary>"
            echo
            echo '```'
            cat "$f"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reproducer
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: repro-${{ env.JOB_NAME }}
          path: |
            repro/
            build/CMakeCache.txt
          retention-days: 14

  # Single required status check, so branch protection does not have to
  # enumerate every matrix job.

  mingw:
    name: ${{ format('windows-{0}-mingw-{1}-{2}{3}', matrix.arch, matrix.crypto, matrix.tgt, matrix.variant && format('-{0}', matrix.variant) || '') }}
    if: github.repository == 'DMTF/libspdm' || github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      JOB_NAME: ${{ format('windows-{0}-mingw-{1}-{2}{3}', matrix.arch, matrix.crypto, matrix.tgt, matrix.variant && format('-{0}', matrix.variant) || '') }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        arch: [x64, ia32]
        crypto: [mbedtls, openssl]
        target: [Debug, Release]
        # The default configuration. The variant job at the end of include
        # changes it, which this value keeps from merging into the jobs above.
        variant: ['']
        include:
          - {os: windows-latest, toolchain: GCC, shell: 'msys2 {0}', generator: MSYS Makefiles}
          # The MSYS2 environment for each architecture. MSYS2 has no 32-bit
          # UCRT environment, so ia32 uses MINGW32.
          - {arch: x64, msystem: UCRT64, mingw_prefix: /ucrt64}
          - {arch: ia32, msystem: MINGW32, mingw_prefix: /mingw32}
          # Lower-case spellings for the job name.
          - {target: Debug, tgt: debug}
          - {target: Release, tgt: release}
          # FIPS mode, which the configs family sweeps on Linux, here with
          # MinGW.
          - arch: x64
            crypto: mbedtls
            target: Debug
            variant: fips
            os: windows-latest
            toolchain: GCC
            shell: 'msys2 {0}'
            generator: MSYS Makefiles
            msystem: UCRT64
            mingw_prefix: /ucrt64
            tgt: debug
            cflags: -DLIBSPDM_FIPS_MODE=1
            extra_tests: test_spdm_fips

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The submodules are fetched in a later step so that cmocka can be served
          # from the cache. A fetch failure inside this step aborts the job before
          # any cache is consulted, which is what makes cmocka's host a source of
          # unrelated test failures.
          submodules: false
          # Nothing after this step needs to talk to the remote, and the jobs
          # run build scripts from the pull request's own tree.
          persist-credentials: false

      # cmocka is the only submodule not hosted on github.com, and gitlab.com is
      # reachable less reliably from the runners. Its source does not vary by
      # configuration, so a single entry keyed on the pinned revision serves every
      # matrix entry, and gitlab.com is contacted only when that pin moves.
      - name: cmocka revision
        id: cmocka
        shell: bash
        run: |
          echo "sha=$(git ls-tree HEAD unit_test/cmockalib/cmocka | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: Cache cmocka
        id: cmocka-cache
        uses: actions/cache@v6
        with:
          path: unit_test/cmockalib/cmocka
          key: cmocka-${{ steps.cmocka.outputs.sha }}

      - name: Fetch submodules
        shell: bash
        run: |
          # Retry rather than fail the job on a transient fetch error. A cache hit
          # means cmocka is already present, so it is not fetched at all.
          fetch() {
            local path=$1
            shift
            for attempt in 1 2 3; do
              if git submodule update --init "$@" "$path"; then
                return 0
              fi
              echo "fetch of $path failed, attempt $attempt"
              sleep $((attempt * 15))
            done
            return 1
          }

          if [ "${{ steps.cmocka-cache.outputs.cache-hit }}" != "true" ]; then
            fetch unit_test/cmockalib/cmocka --recursive
          else
            # The cached .git file points into .git/modules, which this
            # checkout does not have, and git submodule commands fail on it.
            rm -f unit_test/cmockalib/cmocka/.git
          fi
          fetch os_stub/mbedtlslib/mbedtls --recursive
          # libspdm builds OpenSSL from the pinned commit's source alone, so
          # neither its history nor its own submodules are fetched.
          if [ "${{ matrix.crypto }}" = "openssl" ]; then
            fetch os_stub/openssllib/openssl --depth 1
          fi

      - name: Set up MSYS2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: git make
          pacboy: toolchain:p cmake:p make:p

      # OpenSSL is an ExternalProject with its own CFLAGS, so no LIBSPDM_*
      # macro reaches it: one entry serves every configuration on a given
      # platform. Measured at ~100 MB on POSIX and ~344 MB on Windows, so
      # caching the tree wholesale is affordable and avoids maintaining a
      # list of which paths have consumers -- the Windows DLL lives in the
      # build tree, not the install tree, which such a list would miss.
      - name: OpenSSL revision
        id: ossl
        shell: bash
        run: |
          echo "sha=$(git -C os_stub/openssllib/openssl rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # MSYS2 installs MinGW's GCC when the job runs, so the runner image says
      # nothing about the compiler that builds OpenSSL. Record that compiler,
      # and the MSYS2 environment that selects its C runtime, instead.
      # GITHUB_OUTPUT is a Windows path, which cygpath converts.
      - name: MinGW compiler
        id: mingw_cc
        shell: 'msys2 {0}'
        run: |
          echo "version=$MSYSTEM-gcc-$(gcc -dumpfullversion)" >> "$(cygpath -u "$GITHUB_OUTPUT")"

      # The key names the compiler that builds OpenSSL, so it changes only
      # when the OpenSSL revision, MinGW's GCC or its environment does. Each
      # needs a rebuild, so there is no fallback to restore. The key omits
      # TARGET and the macros because neither changes what OpenSSL builds.
      - name: Cache OpenSSL build
        if: matrix.crypto == 'openssl'
        uses: actions/cache@v6
        with:
          path: build/os_stub/openssllib
          key: openssl-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.toolchain }}-${{ steps.ossl.outputs.sha }}-${{ steps.mingw_cc.outputs.version }}

      # MinGW needs the MSYS2 shell for its toolchain and the MSYS generator.
      # `shell:` cannot reference the matrix context, so these are separate
      # steps rather than a matrix-driven shell.
      - name: Configure (MinGW)
        shell: 'msys2 {0}'
        env:
          CFLAGS: ${{ env.BASE_CFLAGS }} ${{ matrix.cflags }}
        run: |
          cmake -B build -G "${{ matrix.generator }}" \
            -DARCH=${{ matrix.arch }} \
            -DTOOLCHAIN=${{ matrix.toolchain }} \
            -DTARGET=${{ matrix.target }} \
            -DCRYPTO=${{ matrix.crypto }} \
            ${{ matrix.cmake_extra }}

      - name: Build (MinGW)
        shell: 'msys2 {0}'
        run: |
          jobs=$(nproc 2>/dev/null || echo 2)
          echo "Building with --parallel $jobs"
          cmake --build build --target copy_sample_key
          cmake --build build --parallel "$jobs"
          # The test step runs under Git Bash, which needs the MinGW runtime
          # DLLs on PATH to launch binaries this toolchain produced.
          # $GITHUB_PATH is a Windows path, so convert it for the MSYS2 shell.
          cygpath -w ${{ matrix.mingw_prefix }}/bin >> "$(cygpath -u "$GITHUB_PATH")"

      # Implements "For any configuration, run all basic unit tests", plus any
      # extended unit test whose requirement this configuration satisfies.
      # Each test is bounded so a hang fails the job instead of stalling it.
      # One step per test, so the Actions UI shows a separate pass/fail entry
      # for each. A single looping step buries later tests below the log
      # viewer's truncation point. The shared runner keeps the binary lookup
      # and the timeout guard in one place rather than in six copies.
      - name: Prepare test runner
        if: matrix.expect_tests != 'false'
        shell: bash
        run: |
          cat > run_test.sh <<'RUNNER'
          #!/usr/bin/env bash
          set -uo pipefail
          t="$1"

          exe=""
          if [ -x "build/bin/$t" ]; then
            exe="$t"
          elif [ -x "build/bin/$t.exe" ]; then
            exe="$t.exe"
          fi

          # Basic unit tests require no additional configuration, so a missing
          # one means coverage was lost rather than legitimately skipped.
          if [ -z "$exe" ]; then
            echo "::error::$t was not built"
            echo "- \`$t\`: **not built**" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 1
          fi

          # macOS has no GNU timeout; fall back to gtimeout, then to perl.
          if command -v timeout >/dev/null 2>&1; then
            ( cd build/bin && timeout 600 "./$exe" )
          elif command -v gtimeout >/dev/null 2>&1; then
            ( cd build/bin && gtimeout 600 "./$exe" )
          else
            ( cd build/bin && perl -e 'alarm shift; exec @ARGV' 600 "./$exe" )
          fi
          rc=$?

          if [ "$rc" -eq 0 ]; then
            echo "- \`$t\`: pass" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          else
            echo "- \`$t\`: **FAIL** (exit $rc)" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            echo "::error::$t failed with exit $rc"
          fi
          exit $rc
          RUNNER
          chmod +x run_test.sh
          echo "### ${{ env.JOB_NAME }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Test Requester
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_spdm_requester

      - name: Test Responder
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_spdm_responder

      - name: Test Common
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_spdm_common

      - name: Test SPDM Crypt
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_spdm_crypt

      - name: Test Crypt
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_crypt

      - name: Test Secured Message
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_spdm_secured_message

      - name: Test Transport
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_spdm_transport

      # Extended unit test: runs only where its requirement is satisfied.
      - name: Test FIPS
        if: contains(matrix.extra_tests, 'test_spdm_fips')
        shell: bash
        run: ./run_test.sh test_spdm_fips

      # DISABLE_TESTS gates 87 test subdirectories, so this checks that nothing
      # test-shaped was produced, and that libraries still were -- otherwise an
      # empty build tree would satisfy the check vacuously.
      - name: Verify no tests were built
        if: matrix.expect_tests == 'false'
        shell: bash
        run: |
          # build/bin does not exist when tests are disabled. Redirecting find's
          # stderr hides the message but not its exit status, which pipefail
          # propagates and set -e turns into a silent step failure, so test for
          # the directory instead of relying on 2>/dev/null.
          if [ -d build/bin ]; then
            stray=$(find build/bin -maxdepth 1 -name 'test_*' | wc -l)
          else
            stray=0
          fi
          if [ -d build ]; then
            libs=$(find build -type f \( -name '*.a' -o -name '*.lib' \) | wc -l)
          else
            libs=0
          fi
          echo "DISABLE_TESTS check: $stray test artifacts under build/bin, $libs libraries built"
          {
            echo "### ${{ env.JOB_NAME }}"
            echo ""
            echo "DISABLE_TESTS: $stray test artifacts, $libs libraries"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$stray" -ne 0 ]; then
            echo "::error::DISABLE_TESTS was set but build/bin holds $stray test artifacts"
            exit 1
          fi
          if [ "$libs" -eq 0 ]; then
            echo "::error::DISABLE_TESTS build produced no libraries; the check would pass vacuously"
            exit 1
          fi
      # Reproducer, generated from the job's own variables so that it cannot
      # drift from what actually ran. The script restores the source tree but
      # not the toolchain, so the compiler identity is recorded in the header:
      # identical source can produce different diagnostics on different
      # compiler versions.
      - name: Generate reproducer
        if: always()
        shell: bash
        run: |
          mkdir -p repro

          # A failed configure leaves no build tree, and this step runs on
          # always(). "ls ... | head" exits non-zero there, which pipefail and
          # set -e turn into a silent step failure, losing the reproducer in
          # exactly the case that most needs one.
          ccfile=""
          if [ -d build/CMakeFiles ]; then
            ccfile=$(find build/CMakeFiles -name CMakeCCompiler.cmake -print -quit)
          fi
          cid=$(sed -n 's/^set(CMAKE_C_COMPILER_ID "\(.*\)")/\1/p' "$ccfile" 2>/dev/null || true)
          cver=$(sed -n 's/^set(CMAKE_C_COMPILER_VERSION "\(.*\)")/\1/p' "$ccfile" 2>/dev/null || true)
          compiler="${cid:-unknown} ${cver:-unknown}"
          image="${ImageOS:-unknown} ${ImageVersion:-unknown}"

          # The image label identifies the runner build, not what is actually
          # underneath it. Record the distro and kernel too, so a reader can
          # tell how far their machine differs from the one that failed.
          if [ -r /etc/os-release ]; then
            osname=$(grep -m1 '^PRETTY_NAME=' /etc/os-release | cut -d= -f2- | tr -d '"' || true)
          elif command -v sw_vers >/dev/null 2>&1; then
            osname="$(sw_vers -productName) $(sw_vers -productVersion)"
          else
            osname=$(cmd //c ver 2>/dev/null | tr -d '[:cntrl:]' | grep -m1 Windows || true)
          fi
          kernel=$(uname -srm 2>/dev/null)
          url="${{ github.server_url }}/${{ github.repository }}"
          run_url="$url/actions/runs/${{ github.run_id }}"

          # On a pull_request event github.sha is the ephemeral merge commit
          # under refs/pull/N/merge, which a plain clone does not fetch. Fetch
          # that ref explicitly so the script checks out what CI actually built.
          pr="${{ github.event.pull_request.number }}"
          if [ -n "$pr" ]; then
            fetch_ref="git fetch origin refs/pull/$pr/merge"
            checkout_ref="git checkout FETCH_HEAD"
          else
            fetch_ref=""
            checkout_ref="git checkout ${{ github.sha }}"
          fi

          # Informational: the checkout above already pins these, but recording
          # them lets a reader verify the tree is what the job built.
          pins=$(git submodule status 2>/dev/null | awk '{print $2" "$1}' || true)

          header="Reproduces: ${{ env.JOB_NAME }}
          Run:        $run_url
          Runner:     ${{ matrix.os }} (image $image)
          OS:         ${osname:-unknown}
          Kernel:     ${kernel:-unknown}
          Compiler:   $compiler
          NOTE: this restores the source tree, not the toolchain. If your
                compiler differs from the one above, a non-reproduction is
                inconclusive rather than a refutation."

          if [ "${{ runner.os }}" = "Windows" ] && [ -z "${{ matrix.shell }}" ]; then
            f=repro/repro.bat
            { echo "@echo off"
              echo "$header" | sed 's/^/REM /'
              echo "REM Run from a Visual Studio Developer Command Prompt for ${{ matrix.msvc_arch }}."
              echo
              echo "git clone $url.git libspdm-repro || exit /b 1"
              echo "cd libspdm-repro || exit /b 1"
              if [ -n "$fetch_ref" ]; then echo "$fetch_ref || exit /b 1"; fi
              echo "$checkout_ref || exit /b 1"
              echo "git submodule update --init --recursive unit_test/cmockalib/cmocka os_stub/mbedtlslib/mbedtls || exit /b 1"
              if [ "${{ matrix.crypto }}" = "openssl" ]; then
                echo "git submodule update --init --depth 1 os_stub/openssllib/openssl || exit /b 1"
              fi
              echo "$pins" | sed 's/^/REM pinned: /'
              echo
              if [ "${{ matrix.toolchain }}" = "CLANG" ]; then
                echo "set \"PATH=%ProgramFiles%\\LLVM\\bin;%PATH%\""
              fi
              echo "set CFLAGS=${{ env.BASE_CFLAGS }} ${{ matrix.cflags }}"
              echo "cmake -B build -G \"${{ matrix.generator }}\" -DARCH=${{ matrix.arch }} -DTOOLCHAIN=${{ matrix.toolchain }} -DTARGET=${{ matrix.target }} -DCRYPTO=${{ matrix.crypto }} ${{ matrix.cmake_extra }} || exit /b 1"
              echo "cmake --build build --target copy_sample_key"
              echo "cmake --build build || exit /b 1"
              echo
              echo "cd build\\bin"
              for t in $UNIT_TESTS ${{ matrix.extra_tests }}; do echo "if exist $t.exe $t.exe"; done
            } > "$f"
          else
            f=repro/repro.sh
            { echo "#!/usr/bin/env bash"
              echo "$header" | sed 's/^/# /'
              if [ -n "${{ matrix.shell }}" ]; then
                echo "# Run inside an MSYS2 ${{ matrix.msystem }} shell."
              fi
              echo "set -euo pipefail"
              echo
              echo "git clone $url.git libspdm-repro"
              echo "cd libspdm-repro"
              if [ -n "$fetch_ref" ]; then echo "$fetch_ref"; fi
              echo "$checkout_ref"
              echo "git submodule update --init --recursive unit_test/cmockalib/cmocka os_stub/mbedtlslib/mbedtls"
              if [ "${{ matrix.crypto }}" = "openssl" ]; then
                echo "git submodule update --init --depth 1 os_stub/openssllib/openssl"
              fi
              echo "$pins" | sed 's/^/# pinned: /'
              echo
              echo "export CFLAGS='${{ env.BASE_CFLAGS }} ${{ matrix.cflags }}'"
              if [ -n "${{ matrix.generator }}" ]; then
                echo "cmake -B build -G \"${{ matrix.generator }}\" -DARCH=${{ matrix.arch }} -DTOOLCHAIN=${{ matrix.toolchain }} -DTARGET=${{ matrix.target }} -DCRYPTO=${{ matrix.crypto }} ${{ matrix.cmake_extra }}"
              else
                echo "cmake -B build -DARCH=${{ matrix.arch }} -DTOOLCHAIN=${{ matrix.toolchain }} -DTARGET=${{ matrix.target }} -DCRYPTO=${{ matrix.crypto }} ${{ matrix.cmake_extra }}"
              fi
              echo "cmake --build build --target copy_sample_key"
              echo "cmake --build build --parallel \"\$(getconf _NPROCESSORS_ONLN)\""
              echo
              echo "cd build/bin"
              for t in $UNIT_TESTS ${{ matrix.extra_tests }}; do echo "if [ -x ./$t ]; then ./$t; fi"; done
            } > "$f"
            chmod +x "$f"
          fi

          # The step log is the first place anyone looks, and unlike the job
          # summary it is reachable from the API, so echo the platform
          # identity there too.
          echo "$header"

          # Legibility for every run, not just failures: the invocation is
          # visible in the UI without downloading anything.
          { echo "<details><summary>Reproducer</summary>"
            echo
            echo '```'
            cat "$f"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reproducer
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: repro-${{ env.JOB_NAME }}
          path: |
            repro/
            build/CMakeCache.txt
          retention-days: 14

  # Implements the code configuration sweeps of "Tier 2 - Daily Coverage":
  # finer-grained macro values under ASan and UBSan, on the document's reference
  # platform, Linux x64. MSan is not run yet. Only the unit tests are built, as
  # the test_size images link with -nostdlib and cannot carry a sanitizer
  # runtime.
  #
  # Tier 1 runs its configurations without sanitizers, so the ten of them that
  # build tests are swept here too. Three configurations are left out until they
  # pass:
  #   config-cert-parse-off   does not build (#3909).
  #   config-version-count-1  fails version negotiation (#4091).
  #   config-psk-only         the unit tests assume a signing algorithm.
  configs:
    name: ${{ matrix.name }}
    if: github.repository == 'DMTF/libspdm' || github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      JOB_NAME: ${{ matrix.name }}
      # Alignment checks stay off until #3852 is fixed, since its misaligned
      # session ID loads would fail every job.
      SAN_CFLAGS: -fsanitize=address,undefined -fno-sanitize=alignment -fno-omit-frame-pointer
      SAN_LDFLAGS: -fsanitize=address,undefined
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          # == Tier 1's configurations =====================================

          - name: config-fips
            cflags: -DLIBSPDM_FIPS_MODE=1
            extra_tests: test_spdm_fips

          - name: config-fips-openssl
            crypto: openssl
            cflags: -DLIBSPDM_FIPS_MODE=1
            extra_tests: test_spdm_fips

          - name: config-respond-if-ready-off
            cflags: -DLIBSPDM_RESPOND_IF_READY_SUPPORT=0

          - name: config-msg-log-off
            cflags: -DLIBSPDM_ENABLE_MSG_LOG=0

          - name: config-record-transcript
            cflags: -DLIBSPDM_RECORD_TRANSCRIPT_DATA_SUPPORT=1

          - name: config-minimal-caps
            cflags: >-
              -DLIBSPDM_ENABLE_CAPABILITY_PSK_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_HBEAT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_MUT_AUTH_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_ENCAP_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_CSR_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_SET_CERT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_CHUNK_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_MEL_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_EVENT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_GET_KEY_PAIR_INFO_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_SET_KEY_PAIR_INFO_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_ENDPOINT_INFO_CAP=0
              -DLIBSPDM_EVENT_RECIPIENT_SUPPORT=0
              -DLIBSPDM_SEND_GET_ENDPOINT_INFO_SUPPORT=0

          - name: config-x509-relaxed
            cmake_extra: -DX509_IGNORE_TIME=ON -DX509_IGNORE_CRITICAL=ON

          # Compiles every object as position-independent code, the test
          # binaries' included.
          - name: config-shared-lib
            cmake_extra: -DBUILD_LINUX_SHARED_LIB=ON

          - name: config-classical-crypto
            crypto: openssl
            cflags: >-
              -DLIBSPDM_ML_DSA_44_SUPPORT=0 -DLIBSPDM_ML_DSA_65_SUPPORT=0 -DLIBSPDM_ML_DSA_87_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_128S_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_128S_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_128F_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_128F_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_192S_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_192S_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_192F_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_192F_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_256S_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_256S_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_256F_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_256F_SUPPORT=0
              -DLIBSPDM_ML_KEM_512_SUPPORT=0 -DLIBSPDM_ML_KEM_768_SUPPORT=0 -DLIBSPDM_ML_KEM_1024_SUPPORT=0

          - name: config-binary-build
            crypto: openssl
            openssl_binary: 'true'
            cmake_extra: -DBUILD_LINUX_SHARED_LIB=ON

          # == The defaults ================================================
          # The platform jobs run the defaults without sanitizers.

          - name: config-defaults

          - name: config-defaults-openssl
            crypto: openssl

          - name: config-defaults-release
            target: Release

          # == Release =====================================================
          # Tier 1's coarse configurations, optimized, since the optimizer can
          # expose behavior that a Debug build hides.

          - name: config-defaults-openssl-release
            crypto: openssl
            target: Release

          - name: config-fips-release
            target: Release
            cflags: -DLIBSPDM_FIPS_MODE=1
            extra_tests: test_spdm_fips

          - name: config-record-transcript-release
            target: Release
            cflags: -DLIBSPDM_RECORD_TRANSCRIPT_DATA_SUPPORT=1

          - name: config-minimal-caps-release
            target: Release
            cflags: >-
              -DLIBSPDM_ENABLE_CAPABILITY_PSK_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_HBEAT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_MUT_AUTH_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_ENCAP_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_CSR_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_SET_CERT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_CHUNK_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_MEL_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_EVENT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_GET_KEY_PAIR_INFO_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_SET_KEY_PAIR_INFO_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_ENDPOINT_INFO_CAP=0
              -DLIBSPDM_EVENT_RECIPIENT_SUPPORT=0
              -DLIBSPDM_SEND_GET_ENDPOINT_INFO_SUPPORT=0

          # == One capability off ==========================================
          # Where the macro check requires another macro off with it, that
          # one is off too.

          - name: config-cert-off
            cflags: -DLIBSPDM_ENABLE_CAPABILITY_CERT_CAP=0

          - name: config-chal-off
            cflags: -DLIBSPDM_ENABLE_CAPABILITY_CHAL_CAP=0

          - name: config-meas-off
            cflags: -DLIBSPDM_ENABLE_CAPABILITY_MEAS_CAP=0

          - name: config-key-ex-off
            cflags: >-
              -DLIBSPDM_ENABLE_CAPABILITY_KEY_EX_CAP=0
              -DLIBSPDM_FFDHE_2048_SUPPORT=0 -DLIBSPDM_FFDHE_3072_SUPPORT=0 -DLIBSPDM_FFDHE_4096_SUPPORT=0
              -DLIBSPDM_ECDHE_P256_SUPPORT=0 -DLIBSPDM_ECDHE_P384_SUPPORT=0 -DLIBSPDM_ECDHE_P521_SUPPORT=0

          - name: config-psk-off
            cflags: -DLIBSPDM_ENABLE_CAPABILITY_PSK_CAP=0

          - name: config-hbeat-off
            cflags: -DLIBSPDM_ENABLE_CAPABILITY_HBEAT_CAP=0

          - name: config-mut-auth-off
            cflags: -DLIBSPDM_ENABLE_CAPABILITY_MUT_AUTH_CAP=0

          - name: config-encap-off
            cflags: -DLIBSPDM_ENABLE_CAPABILITY_ENCAP_CAP=0 -DLIBSPDM_EVENT_RECIPIENT_SUPPORT=0

          - name: config-csr-off
            cflags: -DLIBSPDM_ENABLE_CAPABILITY_CSR_CAP=0

          - name: config-set-cert-off
            cflags: -DLIBSPDM_ENABLE_CAPABILITY_SET_CERT_CAP=0

          - name: config-chunk-off
            cflags: -DLIBSPDM_ENABLE_CAPABILITY_CHUNK_CAP=0

          - name: config-mel-off
            cflags: -DLIBSPDM_ENABLE_CAPABILITY_MEL_CAP=0

          - name: config-event-off
            cflags: -DLIBSPDM_ENABLE_CAPABILITY_EVENT_CAP=0

          - name: config-get-key-pair-info-off
            cflags: >-
              -DLIBSPDM_ENABLE_CAPABILITY_GET_KEY_PAIR_INFO_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_SET_KEY_PAIR_INFO_CAP=0

          - name: config-set-key-pair-info-off
            cflags: -DLIBSPDM_ENABLE_CAPABILITY_SET_KEY_PAIR_INFO_CAP=0

          - name: config-endpoint-info-off
            cflags: -DLIBSPDM_ENABLE_CAPABILITY_ENDPOINT_INFO_CAP=0

          - name: config-vendor-defined-off
            cflags: -DLIBSPDM_ENABLE_VENDOR_DEFINED_MESSAGES=0

          # == One Requester send option off ===============================
          # Each also removes the encapsulated flows that send the request.

          - name: config-send-get-certificate-off
            cflags: -DLIBSPDM_SEND_GET_CERTIFICATE_SUPPORT=0

          - name: config-send-challenge-off
            cflags: -DLIBSPDM_SEND_CHALLENGE_SUPPORT=0

          - name: config-event-recipient-off
            cflags: -DLIBSPDM_EVENT_RECIPIENT_SUPPORT=0

          - name: config-send-get-endpoint-info-off
            cflags: -DLIBSPDM_SEND_GET_ENDPOINT_INFO_SUPPORT=0

          # == Other toggles ===============================================

          - name: config-check-context-off
            cflags: -DLIBSPDM_CHECK_SPDM_CONTEXT=0

          # LIBSPDM_DEBUG_ENABLE overrides the three debug switches whenever
          # it is defined, so no_debug_enable removes its default from
          # spdm_lib_config.h.
          - name: config-debug-print-only
            no_debug_enable: 'true'
            cflags: >-
              -DLIBSPDM_DEBUG_PRINT_ENABLE=1 -DLIBSPDM_DEBUG_ASSERT_ENABLE=0
              -DLIBSPDM_DEBUG_BLOCK_ENABLE=0

          - name: config-debug-assert-only
            no_debug_enable: 'true'
            cflags: >-
              -DLIBSPDM_DEBUG_PRINT_ENABLE=0 -DLIBSPDM_DEBUG_ASSERT_ENABLE=1
              -DLIBSPDM_DEBUG_BLOCK_ENABLE=0

          # == Algorithm families off ======================================
          # The unit tests negotiate RSASSA-2048, ECDSA P-256, ECDHE P-256,
          # AES-256-GCM, SHA-256 and SHA-384, so those stay on. Mbed TLS pins
          # EdDSA, SM2, SM3 and the PQC algorithms off, so those candidates
          # run against OpenSSL.

          - name: config-rsa-ssa-3072-4096-off
            cflags: -DLIBSPDM_RSA_SSA_3072_SUPPORT=0 -DLIBSPDM_RSA_SSA_4096_SUPPORT=0

          - name: config-rsa-pss-off
            cflags: >-
              -DLIBSPDM_RSA_PSS_2048_SUPPORT=0 -DLIBSPDM_RSA_PSS_3072_SUPPORT=0
              -DLIBSPDM_RSA_PSS_4096_SUPPORT=0

          - name: config-ecdsa-p384-p521-off
            cflags: -DLIBSPDM_ECDSA_P384_SUPPORT=0 -DLIBSPDM_ECDSA_P521_SUPPORT=0

          - name: config-ffdhe-off
            cflags: >-
              -DLIBSPDM_FFDHE_2048_SUPPORT=0 -DLIBSPDM_FFDHE_3072_SUPPORT=0
              -DLIBSPDM_FFDHE_4096_SUPPORT=0

          - name: config-ecdhe-p384-p521-off
            cflags: -DLIBSPDM_ECDHE_P384_SUPPORT=0 -DLIBSPDM_ECDHE_P521_SUPPORT=0

          - name: config-aes-128-gcm-off
            cflags: -DLIBSPDM_AEAD_AES_128_GCM_SUPPORT=0

          - name: config-chacha20-poly1305-off
            cflags: -DLIBSPDM_AEAD_CHACHA20_POLY1305_SUPPORT=0

          - name: config-sha512-off
            cflags: -DLIBSPDM_SHA512_SUPPORT=0

          - name: config-sha3-off
            cflags: >-
              -DLIBSPDM_SHA3_256_SUPPORT=0 -DLIBSPDM_SHA3_384_SUPPORT=0
              -DLIBSPDM_SHA3_512_SUPPORT=0

          # Every algorithm the unit tests do not negotiate, which also makes
          # the derived buffer sizes as small as the tests allow.
          - name: config-test-algorithms-only
            cflags: >-
              -DLIBSPDM_RSA_SSA_3072_SUPPORT=0 -DLIBSPDM_RSA_SSA_4096_SUPPORT=0
              -DLIBSPDM_RSA_PSS_2048_SUPPORT=0 -DLIBSPDM_RSA_PSS_3072_SUPPORT=0 -DLIBSPDM_RSA_PSS_4096_SUPPORT=0
              -DLIBSPDM_ECDSA_P384_SUPPORT=0 -DLIBSPDM_ECDSA_P521_SUPPORT=0
              -DLIBSPDM_FFDHE_2048_SUPPORT=0 -DLIBSPDM_FFDHE_3072_SUPPORT=0 -DLIBSPDM_FFDHE_4096_SUPPORT=0
              -DLIBSPDM_ECDHE_P384_SUPPORT=0 -DLIBSPDM_ECDHE_P521_SUPPORT=0
              -DLIBSPDM_AEAD_AES_128_GCM_SUPPORT=0 -DLIBSPDM_AEAD_CHACHA20_POLY1305_SUPPORT=0
              -DLIBSPDM_SHA512_SUPPORT=0
              -DLIBSPDM_SHA3_256_SUPPORT=0 -DLIBSPDM_SHA3_384_SUPPORT=0 -DLIBSPDM_SHA3_512_SUPPORT=0

          - name: config-eddsa-off
            crypto: openssl
            cflags: -DLIBSPDM_EDDSA_ED25519_SUPPORT=0 -DLIBSPDM_EDDSA_ED448_SUPPORT=0

          - name: config-sm2-dsa-off
            crypto: openssl
            cflags: -DLIBSPDM_SM2_DSA_P256_SUPPORT=0

          - name: config-sm3-off
            crypto: openssl
            cflags: -DLIBSPDM_SM3_256_SUPPORT=0

          - name: config-ml-dsa-off
            crypto: openssl
            cflags: >-
              -DLIBSPDM_ML_DSA_44_SUPPORT=0 -DLIBSPDM_ML_DSA_65_SUPPORT=0
              -DLIBSPDM_ML_DSA_87_SUPPORT=0

          - name: config-slh-dsa-off
            crypto: openssl
            cflags: >-
              -DLIBSPDM_SLH_DSA_SHA2_128S_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_128S_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_128F_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_128F_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_192S_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_192S_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_192F_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_192F_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_256S_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_256S_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_256F_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_256F_SUPPORT=0

          - name: config-ml-kem-off
            crypto: openssl
            cflags: >-
              -DLIBSPDM_ML_KEM_512_SUPPORT=0 -DLIBSPDM_ML_KEM_768_SUPPORT=0
              -DLIBSPDM_ML_KEM_1024_SUPPORT=0

          - name: config-test-algorithms-only-openssl
            crypto: openssl
            cflags: >-
              -DLIBSPDM_RSA_SSA_3072_SUPPORT=0 -DLIBSPDM_RSA_SSA_4096_SUPPORT=0
              -DLIBSPDM_RSA_PSS_2048_SUPPORT=0 -DLIBSPDM_RSA_PSS_3072_SUPPORT=0 -DLIBSPDM_RSA_PSS_4096_SUPPORT=0
              -DLIBSPDM_ECDSA_P384_SUPPORT=0 -DLIBSPDM_ECDSA_P521_SUPPORT=0
              -DLIBSPDM_SM2_DSA_P256_SUPPORT=0
              -DLIBSPDM_EDDSA_ED25519_SUPPORT=0 -DLIBSPDM_EDDSA_ED448_SUPPORT=0
              -DLIBSPDM_FFDHE_2048_SUPPORT=0 -DLIBSPDM_FFDHE_3072_SUPPORT=0 -DLIBSPDM_FFDHE_4096_SUPPORT=0
              -DLIBSPDM_ECDHE_P384_SUPPORT=0 -DLIBSPDM_ECDHE_P521_SUPPORT=0
              -DLIBSPDM_AEAD_AES_128_GCM_SUPPORT=0 -DLIBSPDM_AEAD_CHACHA20_POLY1305_SUPPORT=0
              -DLIBSPDM_SHA512_SUPPORT=0
              -DLIBSPDM_SHA3_256_SUPPORT=0 -DLIBSPDM_SHA3_384_SUPPORT=0 -DLIBSPDM_SHA3_512_SUPPORT=0
              -DLIBSPDM_SM3_256_SUPPORT=0
              -DLIBSPDM_ML_DSA_44_SUPPORT=0 -DLIBSPDM_ML_DSA_65_SUPPORT=0 -DLIBSPDM_ML_DSA_87_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_128S_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_128S_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_128F_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_128F_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_192S_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_192S_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_192F_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_192F_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_256S_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_256S_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_256F_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_256F_SUPPORT=0
              -DLIBSPDM_ML_KEM_512_SUPPORT=0 -DLIBSPDM_ML_KEM_768_SUPPORT=0 -DLIBSPDM_ML_KEM_1024_SUPPORT=0

          # The PQC algorithms as the only signature and key exchange
          # algorithms. The unit tests negotiate ECDSA, so only the library is
          # built.
          - name: config-pqc-only
            crypto: openssl
            cflags: >-
              -DLIBSPDM_RSA_SSA_2048_SUPPORT=0 -DLIBSPDM_RSA_SSA_3072_SUPPORT=0 -DLIBSPDM_RSA_SSA_4096_SUPPORT=0
              -DLIBSPDM_RSA_PSS_2048_SUPPORT=0 -DLIBSPDM_RSA_PSS_3072_SUPPORT=0 -DLIBSPDM_RSA_PSS_4096_SUPPORT=0
              -DLIBSPDM_ECDSA_P256_SUPPORT=0 -DLIBSPDM_ECDSA_P384_SUPPORT=0 -DLIBSPDM_ECDSA_P521_SUPPORT=0
              -DLIBSPDM_SM2_DSA_P256_SUPPORT=0
              -DLIBSPDM_EDDSA_ED25519_SUPPORT=0 -DLIBSPDM_EDDSA_ED448_SUPPORT=0
              -DLIBSPDM_FFDHE_2048_SUPPORT=0 -DLIBSPDM_FFDHE_3072_SUPPORT=0 -DLIBSPDM_FFDHE_4096_SUPPORT=0
              -DLIBSPDM_ECDHE_P256_SUPPORT=0 -DLIBSPDM_ECDHE_P384_SUPPORT=0 -DLIBSPDM_ECDHE_P521_SUPPORT=0
            cmake_extra: -DDISABLE_TESTS=1
            expect_tests: 'false'

          # == Sizes =======================================================

          - name: config-version-count-255
            cflags: -DLIBSPDM_MAX_VERSION_COUNT=255

          - name: config-session-count-1
            cflags: -DLIBSPDM_MAX_SESSION_COUNT=1

          # More session slots than an 8-bit index can address.
          - name: config-session-count-256
            cflags: -DLIBSPDM_MAX_SESSION_COUNT=256

          - name: config-root-cert-1
            cflags: -DLIBSPDM_MAX_ROOT_CERT_SUPPORT=1

          # More trust anchors than an 8-bit index can address.
          - name: config-root-cert-256
            cflags: -DLIBSPDM_MAX_ROOT_CERT_SUPPORT=256

          # The smallest RequesterContext that spdm_lib_config.h allows.
          - name: config-psk-context-32
            cflags: -DLIBSPDM_PSK_CONTEXT_LENGTH=32

          # SLH-DSA makes LIBSPDM_MAX_CERT_CHAIN_SIZE largest with OpenSSL,
          # and the transcript buffers with it.
          - name: config-record-transcript-openssl
            crypto: openssl
            cflags: -DLIBSPDM_RECORD_TRANSCRIPT_DATA_SUPPORT=1

          # == Profiles ====================================================

          # Certificates, CHALLENGE and measurements without secure sessions.
          - name: config-attestation-only
            cflags: >-
              -DLIBSPDM_ENABLE_CAPABILITY_KEY_EX_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_PSK_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_HBEAT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_MUT_AUTH_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_ENCAP_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_CSR_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_SET_CERT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_EVENT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_GET_KEY_PAIR_INFO_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_SET_KEY_PAIR_INFO_CAP=0
              -DLIBSPDM_EVENT_RECIPIENT_SUPPORT=0
              -DLIBSPDM_FFDHE_2048_SUPPORT=0 -DLIBSPDM_FFDHE_3072_SUPPORT=0 -DLIBSPDM_FFDHE_4096_SUPPORT=0
              -DLIBSPDM_ECDHE_P256_SUPPORT=0 -DLIBSPDM_ECDHE_P384_SUPPORT=0 -DLIBSPDM_ECDHE_P521_SUPPORT=0
              -DLIBSPDM_AEAD_AES_128_GCM_SUPPORT=0 -DLIBSPDM_AEAD_AES_256_GCM_SUPPORT=0
              -DLIBSPDM_AEAD_CHACHA20_POLY1305_SUPPORT=0

          # Signatures and sessions without certificates, as with provisioned
          # public keys.
          - name: config-no-certificates
            cflags: >-
              -DLIBSPDM_ENABLE_CAPABILITY_CERT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_CSR_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_SET_CERT_CAP=0
              -DLIBSPDM_SEND_GET_CERTIFICATE_SUPPORT=0

          - name: config-fips-record-transcript
            cflags: -DLIBSPDM_FIPS_MODE=1 -DLIBSPDM_RECORD_TRANSCRIPT_DATA_SUPPORT=1
            extra_tests: test_spdm_fips

          - name: config-fips-classical-openssl
            crypto: openssl
            cflags: >-
              -DLIBSPDM_FIPS_MODE=1
              -DLIBSPDM_ML_DSA_44_SUPPORT=0 -DLIBSPDM_ML_DSA_65_SUPPORT=0 -DLIBSPDM_ML_DSA_87_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_128S_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_128S_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_128F_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_128F_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_192S_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_192S_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_192F_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_192F_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_256S_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_256S_SUPPORT=0
              -DLIBSPDM_SLH_DSA_SHA2_256F_SUPPORT=0 -DLIBSPDM_SLH_DSA_SHAKE_256F_SUPPORT=0
              -DLIBSPDM_ML_KEM_512_SUPPORT=0 -DLIBSPDM_ML_KEM_768_SUPPORT=0 -DLIBSPDM_ML_KEM_1024_SUPPORT=0
            extra_tests: test_spdm_fips

          - name: config-record-transcript-minimal-caps
            cflags: >-
              -DLIBSPDM_RECORD_TRANSCRIPT_DATA_SUPPORT=1
              -DLIBSPDM_ENABLE_CAPABILITY_PSK_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_HBEAT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_MUT_AUTH_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_ENCAP_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_CSR_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_SET_CERT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_CHUNK_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_MEL_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_EVENT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_GET_KEY_PAIR_INFO_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_SET_KEY_PAIR_INFO_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_ENDPOINT_INFO_CAP=0
              -DLIBSPDM_EVENT_RECIPIENT_SUPPORT=0
              -DLIBSPDM_SEND_GET_ENDPOINT_INFO_SUPPORT=0

          # == Pairwise ====================================================
          # The rows above change one toggle at a time. Together these ten set
          # every pair of values of 26 toggles: the 16 capabilities,
          # vendor-defined messages, the four Requester send options,
          # respond-if-ready, the message log, the context check, transcript
          # recording and FIPS mode. Two of the 1,300 pairs cannot occur, since
          # the macro check requires GET_KEY_PAIR_INFO_CAP with
          # SET_KEY_PAIR_INFO_CAP and ENCAP_CAP with EVENT_RECIPIENT_SUPPORT.
          # Every row keeps CERT_CAP, CHAL_CAP or KEY_EX_CAP on, since the unit
          # tests need a signing algorithm, and the DHE algorithms go off with
          # KEY_EX_CAP.

          - name: config-pairwise-01
            cflags: >-
              -DLIBSPDM_ENABLE_CAPABILITY_PSK_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_MUT_AUTH_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_CHUNK_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_MEL_CAP=0
              -DLIBSPDM_ENABLE_VENDOR_DEFINED_MESSAGES=0
              -DLIBSPDM_EVENT_RECIPIENT_SUPPORT=0
              -DLIBSPDM_CHECK_SPDM_CONTEXT=0
              -DLIBSPDM_FIPS_MODE=1
            extra_tests: test_spdm_fips

          - name: config-pairwise-02
            cflags: >-
              -DLIBSPDM_ENABLE_CAPABILITY_CERT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_CHAL_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_MEAS_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_HBEAT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_ENCAP_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_CSR_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_SET_CERT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_EVENT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_GET_KEY_PAIR_INFO_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_SET_KEY_PAIR_INFO_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_ENDPOINT_INFO_CAP=0
              -DLIBSPDM_SEND_GET_CERTIFICATE_SUPPORT=0
              -DLIBSPDM_SEND_CHALLENGE_SUPPORT=0
              -DLIBSPDM_EVENT_RECIPIENT_SUPPORT=0
              -DLIBSPDM_SEND_GET_ENDPOINT_INFO_SUPPORT=0
              -DLIBSPDM_RESPOND_IF_READY_SUPPORT=0
              -DLIBSPDM_ENABLE_MSG_LOG=0
              -DLIBSPDM_RECORD_TRANSCRIPT_DATA_SUPPORT=1

          - name: config-pairwise-03
            cflags: >-
              -DLIBSPDM_ENABLE_CAPABILITY_CHAL_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_KEY_EX_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_PSK_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_HBEAT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_MUT_AUTH_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_CSR_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_SET_CERT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_MEL_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_EVENT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_ENDPOINT_INFO_CAP=0
              -DLIBSPDM_RESPOND_IF_READY_SUPPORT=0
              -DLIBSPDM_ENABLE_MSG_LOG=0
              -DLIBSPDM_CHECK_SPDM_CONTEXT=0
              -DLIBSPDM_RECORD_TRANSCRIPT_DATA_SUPPORT=1
              -DLIBSPDM_FFDHE_2048_SUPPORT=0 -DLIBSPDM_FFDHE_3072_SUPPORT=0 -DLIBSPDM_FFDHE_4096_SUPPORT=0
              -DLIBSPDM_ECDHE_P256_SUPPORT=0 -DLIBSPDM_ECDHE_P384_SUPPORT=0 -DLIBSPDM_ECDHE_P521_SUPPORT=0

          - name: config-pairwise-04
            cflags: >-
              -DLIBSPDM_ENABLE_CAPABILITY_CERT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_MEAS_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_KEY_EX_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_HBEAT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_CHUNK_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_GET_KEY_PAIR_INFO_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_SET_KEY_PAIR_INFO_CAP=0
              -DLIBSPDM_ENABLE_VENDOR_DEFINED_MESSAGES=0
              -DLIBSPDM_SEND_GET_CERTIFICATE_SUPPORT=0
              -DLIBSPDM_SEND_CHALLENGE_SUPPORT=0
              -DLIBSPDM_SEND_GET_ENDPOINT_INFO_SUPPORT=0
              -DLIBSPDM_FIPS_MODE=1
              -DLIBSPDM_FFDHE_2048_SUPPORT=0 -DLIBSPDM_FFDHE_3072_SUPPORT=0 -DLIBSPDM_FFDHE_4096_SUPPORT=0
              -DLIBSPDM_ECDHE_P256_SUPPORT=0 -DLIBSPDM_ECDHE_P384_SUPPORT=0 -DLIBSPDM_ECDHE_P521_SUPPORT=0
            extra_tests: test_spdm_fips

          - name: config-pairwise-05
            cflags: >-
              -DLIBSPDM_ENABLE_CAPABILITY_CHAL_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_MEAS_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_KEY_EX_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_PSK_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_MUT_AUTH_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_ENCAP_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_CSR_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_SET_CERT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_MEL_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_SET_KEY_PAIR_INFO_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_ENDPOINT_INFO_CAP=0
              -DLIBSPDM_ENABLE_VENDOR_DEFINED_MESSAGES=0
              -DLIBSPDM_SEND_GET_CERTIFICATE_SUPPORT=0
              -DLIBSPDM_SEND_CHALLENGE_SUPPORT=0
              -DLIBSPDM_EVENT_RECIPIENT_SUPPORT=0
              -DLIBSPDM_SEND_GET_ENDPOINT_INFO_SUPPORT=0
              -DLIBSPDM_CHECK_SPDM_CONTEXT=0
              -DLIBSPDM_RECORD_TRANSCRIPT_DATA_SUPPORT=1
              -DLIBSPDM_FIPS_MODE=1
              -DLIBSPDM_FFDHE_2048_SUPPORT=0 -DLIBSPDM_FFDHE_3072_SUPPORT=0 -DLIBSPDM_FFDHE_4096_SUPPORT=0
              -DLIBSPDM_ECDHE_P256_SUPPORT=0 -DLIBSPDM_ECDHE_P384_SUPPORT=0 -DLIBSPDM_ECDHE_P521_SUPPORT=0
            extra_tests: test_spdm_fips

          - name: config-pairwise-06
            cflags: >-
              -DLIBSPDM_ENABLE_CAPABILITY_CERT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_KEY_EX_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_ENCAP_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_CSR_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_CHUNK_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_EVENT_CAP=0
              -DLIBSPDM_EVENT_RECIPIENT_SUPPORT=0
              -DLIBSPDM_RESPOND_IF_READY_SUPPORT=0
              -DLIBSPDM_ENABLE_MSG_LOG=0
              -DLIBSPDM_FFDHE_2048_SUPPORT=0 -DLIBSPDM_FFDHE_3072_SUPPORT=0 -DLIBSPDM_FFDHE_4096_SUPPORT=0
              -DLIBSPDM_ECDHE_P256_SUPPORT=0 -DLIBSPDM_ECDHE_P384_SUPPORT=0 -DLIBSPDM_ECDHE_P521_SUPPORT=0

          - name: config-pairwise-07
            cflags: >-
              -DLIBSPDM_ENABLE_CAPABILITY_CHAL_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_SET_CERT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_CHUNK_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_MEL_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_GET_KEY_PAIR_INFO_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_SET_KEY_PAIR_INFO_CAP=0
              -DLIBSPDM_SEND_GET_ENDPOINT_INFO_SUPPORT=0
              -DLIBSPDM_RESPOND_IF_READY_SUPPORT=0
              -DLIBSPDM_CHECK_SPDM_CONTEXT=0
              -DLIBSPDM_RECORD_TRANSCRIPT_DATA_SUPPORT=1

          - name: config-pairwise-08
            cflags: >-
              -DLIBSPDM_ENABLE_CAPABILITY_CERT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_CHAL_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_MEAS_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_PSK_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_MUT_AUTH_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_EVENT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_GET_KEY_PAIR_INFO_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_SET_KEY_PAIR_INFO_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_ENDPOINT_INFO_CAP=0
              -DLIBSPDM_ENABLE_VENDOR_DEFINED_MESSAGES=0
              -DLIBSPDM_SEND_CHALLENGE_SUPPORT=0
              -DLIBSPDM_ENABLE_MSG_LOG=0
              -DLIBSPDM_CHECK_SPDM_CONTEXT=0

          - name: config-pairwise-09
            cflags: >-
              -DLIBSPDM_ENABLE_CAPABILITY_CERT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_PSK_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_HBEAT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_ENCAP_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_MEL_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_EVENT_CAP=0
              -DLIBSPDM_ENABLE_VENDOR_DEFINED_MESSAGES=0
              -DLIBSPDM_SEND_GET_CERTIFICATE_SUPPORT=0
              -DLIBSPDM_SEND_CHALLENGE_SUPPORT=0
              -DLIBSPDM_EVENT_RECIPIENT_SUPPORT=0
              -DLIBSPDM_RESPOND_IF_READY_SUPPORT=0
              -DLIBSPDM_RECORD_TRANSCRIPT_DATA_SUPPORT=1
              -DLIBSPDM_FIPS_MODE=1
            extra_tests: test_spdm_fips

          - name: config-pairwise-10
            cflags: >-
              -DLIBSPDM_ENABLE_CAPABILITY_MEAS_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_HBEAT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_MUT_AUTH_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_CSR_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_SET_CERT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_CHUNK_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_ENDPOINT_INFO_CAP=0
              -DLIBSPDM_SEND_GET_CERTIFICATE_SUPPORT=0
              -DLIBSPDM_SEND_GET_ENDPOINT_INFO_SUPPORT=0
              -DLIBSPDM_ENABLE_MSG_LOG=0
              -DLIBSPDM_FIPS_MODE=1
            extra_tests: test_spdm_fips

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # See the posix family.
          submodules: false
          persist-credentials: false

      - name: cmocka revision
        id: cmocka
        shell: bash
        run: |
          echo "sha=$(git ls-tree HEAD unit_test/cmockalib/cmocka | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: Cache cmocka
        id: cmocka-cache
        uses: actions/cache@v6
        with:
          path: unit_test/cmockalib/cmocka
          key: cmocka-${{ steps.cmocka.outputs.sha }}

      - name: Fetch submodules
        shell: bash
        run: |
          fetch() {
            local path=$1
            shift
            for attempt in 1 2 3; do
              if git submodule update --init "$@" "$path"; then
                return 0
              fi
              echo "fetch of $path failed, attempt $attempt"
              sleep $((attempt * 15))
            done
            return 1
          }

          if [ "${{ steps.cmocka-cache.outputs.cache-hit }}" != "true" ]; then
            fetch unit_test/cmockalib/cmocka --recursive
          else
            # The cached .git file points into .git/modules, which this
            # checkout does not have, and git submodule commands fail on it.
            rm -f unit_test/cmockalib/cmocka/.git
          fi
          fetch os_stub/mbedtlslib/mbedtls --recursive
          # libspdm builds OpenSSL from the pinned commit's source alone, so
          # neither its history nor its own submodules are fetched.
          if [ "${{ matrix.crypto || 'mbedtls' }}" = "openssl" ]; then
            fetch os_stub/openssllib/openssl --depth 1
          fi

      - name: OpenSSL revision
        id: ossl
        shell: bash
        run: |
          echo "sha=$(git -C os_stub/openssllib/openssl rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      # The same key as the posix family's linux-x64-clang jobs: OpenSSL takes
      # neither the macros nor the sanitizer flags, so their trees are
      # interchangeable.
      - name: Cache OpenSSL build
        if: (matrix.crypto || 'mbedtls') == 'openssl' && matrix.openssl_binary != 'true'
        uses: actions/cache@v6
        with:
          path: build/os_stub/openssllib
          key: openssl-ubuntu-24.04-x64-CLANG-${{ steps.ossl.outputs.sha }}-${{ steps.ossl.outputs.image }}
          restore-keys: |
            openssl-ubuntu-24.04-x64-CLANG-${{ steps.ossl.outputs.sha }}-

      - name: Cache OpenSSL binaries
        if: matrix.openssl_binary == 'true'
        uses: actions/cache@v6
        with:
          path: openssl-binary
          key: openssl-binary-ubuntu-24.04-x64-${{ steps.ossl.outputs.sha }}-${{ steps.ossl.outputs.image }}
          restore-keys: |
            openssl-binary-ubuntu-24.04-x64-${{ steps.ossl.outputs.sha }}-

      - name: Build OpenSSL binaries
        if: matrix.openssl_binary == 'true'
        shell: bash
        run: |
          cat > build_openssl_binary.sh <<'OPENSSL'
          # The prefix is not on the linker's search path, so only the libraries
          # given to CMake can satisfy the link.
          export OPENSSL_BINARY="$PWD/openssl-binary"
          if [ ! -e "$OPENSSL_BINARY/lib/libcrypto.so" ]; then
            mkdir -p build-openssl-binary
            (cd build-openssl-binary &&
              ../os_stub/openssllib/openssl/Configure shared no-tests no-docs \
                --prefix="$OPENSSL_BINARY" --libdir=lib &&
              make -j"$(getconf _NPROCESSORS_ONLN)" build_libs &&
              make install_dev)
          fi
          OPENSSL
          . ./build_openssl_binary.sh
          echo "OPENSSL_BINARY=$OPENSSL_BINARY" >> "$GITHUB_ENV"

      # The commands are written to a script so that the reproducer runs exactly
      # what this step ran.
      - name: Remove the LIBSPDM_DEBUG_ENABLE default
        if: matrix.no_debug_enable == 'true'
        shell: bash
        run: |
          cat > no_debug_enable.sh <<'EDIT'
          sed -i '/^#ifndef LIBSPDM_DEBUG_ENABLE$/,/^#endif$/d' include/library/spdm_lib_config.h
          if grep -q 'define LIBSPDM_DEBUG_ENABLE' include/library/spdm_lib_config.h; then
            echo "::error::spdm_lib_config.h still defines LIBSPDM_DEBUG_ENABLE"
            exit 1
          fi
          EDIT
          . ./no_debug_enable.sh

      - name: Configure
        shell: bash
        env:
          CFLAGS: ${{ env.BASE_CFLAGS }} ${{ env.SAN_CFLAGS }} ${{ matrix.cflags }}
          LDFLAGS: ${{ env.SAN_LDFLAGS }}
        run: |
          # A stalled mirror can outlast apt-get's own timeouts, so each attempt
          # is bounded, and a failed one is retried.
          apt_install() {
            for attempt in 1 2 3; do
              if sudo timeout -k 10 300 apt-get update &&
                 sudo timeout -k 10 300 apt-get install --no-install-recommends -y "$@"; then
                return 0
              fi
              echo "apt-get install $* failed, attempt $attempt"
              sleep $((attempt * 15))
            done
            return 1
          }

          # The CLANG toolchain archives static libraries with llvm-ar, which is
          # not present on the stock Linux image. The same package provides
          # llvm-symbolizer, which the sanitizers need for function names.
          apt_install llvm

          binary=()
          if [ "${{ matrix.openssl_binary }}" = "true" ]; then
            CFLAGS="$CFLAGS -I$OPENSSL_BINARY/include"
            binary=(-DENABLE_BINARY_BUILD=1
                    "-DCOMPILED_LIBCRYPTO_PATH=$OPENSSL_BINARY/lib/libcrypto.so"
                    "-DCOMPILED_LIBSSL_PATH=$OPENSSL_BINARY/lib/libssl.so")
          fi

          cmake -B build \
            -DARCH=x64 \
            -DTOOLCHAIN=CLANG \
            -DTARGET=${{ matrix.target || 'Debug' }} \
            -DCRYPTO=${{ matrix.crypto || 'mbedtls' }} \
            ${{ matrix.cmake_extra }} \
            "${binary[@]}"

      - name: Build
        shell: bash
        run: |
          jobs=$(getconf _NPROCESSORS_ONLN 2>/dev/null || nproc 2>/dev/null || echo 2)
          echo "Building with --parallel $jobs"

          if [ "${{ matrix.expect_tests }}" != "false" ]; then
            cmake --build build --target copy_sample_key
              cmake --build build --parallel "$jobs" --target $UNIT_TESTS ${{ matrix.extra_tests }}
          else
            cmake --build build --parallel "$jobs"
          fi

      - name: Prepare test runner
        if: matrix.expect_tests != 'false'
        shell: bash
        run: |
          # Leaks that are already tracked, each until its fix is merged. Any
          # other leak still fails the job.
          cat > lsan.supp <<'SUPPRESSIONS'
          SUPPRESSIONS

          # The suppressions match function names, which needs the symbolizer.
          if ! command -v llvm-symbolizer >/dev/null 2>&1; then
            echo "::error::llvm-symbolizer is not on PATH"
            exit 1
          fi

          # halt_on_error makes a UBSan report fail the test, as ASan's and
          # LSan's reports already do.
          {
            echo "ASAN_OPTIONS=detect_leaks=1"
            echo "LSAN_OPTIONS=suppressions=$PWD/lsan.supp"
            echo "UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1"
          } >> "$GITHUB_ENV"

          cat > run_test.sh <<'RUNNER'
          #!/usr/bin/env bash
          set -uo pipefail
          t="$1"

          if [ ! -x "build/bin/$t" ]; then
            echo "::error::$t was not built"
            echo "- \`$t\`: **not built**" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 1
          fi

          ( cd build/bin && timeout 600 "./$t" )
          rc=$?

          if [ "$rc" -eq 0 ]; then
            echo "- \`$t\`: pass" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          else
            echo "- \`$t\`: **FAIL** (exit $rc)" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            echo "::error::$t failed with exit $rc"
          fi
          exit $rc
          RUNNER
          chmod +x run_test.sh
          echo "### ${{ env.JOB_NAME }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Test Requester
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_spdm_requester

      - name: Test Responder
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_spdm_responder

      - name: Test Common
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_spdm_common

      - name: Test SPDM Crypt
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_spdm_crypt

      - name: Test Crypt
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_crypt

      - name: Test Secured Message
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_spdm_secured_message

      - name: Test Transport
        if: matrix.expect_tests != 'false'
        shell: bash
        run: ./run_test.sh test_spdm_transport

      - name: Test FIPS
        if: contains(matrix.extra_tests, 'test_spdm_fips')
        shell: bash
        run: ./run_test.sh test_spdm_fips

      - name: Verify no tests were built
        if: matrix.expect_tests == 'false'
        shell: bash
        run: |
          if [ -d build/bin ]; then
            stray=$(find build/bin -maxdepth 1 -name 'test_*' | wc -l)
          else
            stray=0
          fi
          if [ -d build ]; then
            libs=$(find build -type f -name '*.a' | wc -l)
          else
            libs=0
          fi
          echo "DISABLE_TESTS check: $stray test artifacts under build/bin, $libs libraries built"
          {
            echo "### ${{ env.JOB_NAME }}"
            echo ""
            echo "DISABLE_TESTS: $stray test artifacts, $libs libraries"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$stray" -ne 0 ]; then
            echo "::error::DISABLE_TESTS was set but build/bin holds $stray test artifacts"
            exit 1
          fi
          if [ "$libs" -eq 0 ]; then
            echo "::error::DISABLE_TESTS build produced no libraries; the check would pass vacuously"
            exit 1
          fi

      # As in the posix family, generated from the job's own variables so that
      # it cannot drift from what ran.
      - name: Generate reproducer
        if: always()
        shell: bash
        run: |
          mkdir -p repro

          ccfile=""
          if [ -d build/CMakeFiles ]; then
            ccfile=$(find build/CMakeFiles -name CMakeCCompiler.cmake -print -quit)
          fi
          cid=$(sed -n 's/^set(CMAKE_C_COMPILER_ID "\(.*\)")/\1/p' "$ccfile" 2>/dev/null || true)
          cver=$(sed -n 's/^set(CMAKE_C_COMPILER_VERSION "\(.*\)")/\1/p' "$ccfile" 2>/dev/null || true)
          compiler="${cid:-unknown} ${cver:-unknown}"
          image="${ImageOS:-unknown} ${ImageVersion:-unknown}"
          osname=$(grep -m1 '^PRETTY_NAME=' /etc/os-release 2>/dev/null | cut -d= -f2- | tr -d '"' || true)
          kernel=$(uname -srm 2>/dev/null)
          url="${{ github.server_url }}/${{ github.repository }}"
          run_url="$url/actions/runs/${{ github.run_id }}"
          pins=$(git submodule status 2>/dev/null | awk '{print $2" "$1}' || true)

          header="Reproduces: ${{ env.JOB_NAME }}
          Run:        $run_url
          Runner:     ubuntu-24.04 (image $image)
          OS:         ${osname:-unknown}
          Kernel:     ${kernel:-unknown}
          Compiler:   $compiler
          NOTE: this restores the source tree, not the toolchain. If your
                compiler differs from the one above, a non-reproduction is
                inconclusive rather than a refutation."

          f=repro/repro.sh
          { echo "#!/usr/bin/env bash"
            echo "$header" | sed 's/^/# /'
            echo "set -euo pipefail"
            echo
            echo "git clone $url.git libspdm-repro"
            echo "cd libspdm-repro"
            echo "git checkout ${{ github.sha }}"
            echo "git submodule update --init --recursive unit_test/cmockalib/cmocka os_stub/mbedtlslib/mbedtls"
            if [ "${{ matrix.crypto || 'mbedtls' }}" = "openssl" ]; then
              echo "git submodule update --init --depth 1 os_stub/openssllib/openssl"
            fi
            echo "$pins" | sed 's/^/# pinned: /'
            echo
            if [ -f no_debug_enable.sh ]; then cat no_debug_enable.sh; fi
            echo "export CFLAGS='${{ env.BASE_CFLAGS }} $SAN_CFLAGS ${{ matrix.cflags }}'"
            echo "export LDFLAGS='$SAN_LDFLAGS'"
            binary=""
            if [ "${{ matrix.openssl_binary }}" = "true" ]; then
              if [ -f build_openssl_binary.sh ]; then cat build_openssl_binary.sh; fi
              echo 'export CFLAGS="$CFLAGS -I$OPENSSL_BINARY/include"'
              binary=' -DENABLE_BINARY_BUILD=1 -DCOMPILED_LIBCRYPTO_PATH="$OPENSSL_BINARY/lib/libcrypto.so" -DCOMPILED_LIBSSL_PATH="$OPENSSL_BINARY/lib/libssl.so"'
            fi
            echo "cmake -B build -DARCH=x64 -DTOOLCHAIN=CLANG -DTARGET=${{ matrix.target || 'Debug' }} -DCRYPTO=${{ matrix.crypto || 'mbedtls' }} ${{ matrix.cmake_extra }}$binary"
            if [ "${{ matrix.expect_tests }}" != "false" ]; then
              echo "cmake --build build --target copy_sample_key"
              echo "cmake --build build --parallel \"\$(getconf _NPROCESSORS_ONLN)\" --target $UNIT_TESTS ${{ matrix.extra_tests }}"
              echo
              if [ -f lsan.supp ]; then
                echo "cat > lsan.supp <<'SUPPRESSIONS'"
                cat lsan.supp
                echo "SUPPRESSIONS"
              fi
              echo "export ASAN_OPTIONS=detect_leaks=1"
              echo 'export LSAN_OPTIONS="suppressions=$PWD/lsan.supp"'
              echo "export UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1"
              echo "cd build/bin"
              for t in $UNIT_TESTS ${{ matrix.extra_tests }}; do echo "./$t"; done
            else
              echo "cmake --build build --parallel \"\$(getconf _NPROCESSORS_ONLN)\""
            fi
          } > "$f"
          chmod +x "$f"

          echo "$header"
          { echo "<details><summary>Reproducer</summary>"
            echo
            echo '```'
            cat "$f"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reproducer
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: repro-${{ env.JOB_NAME }}
          path: |
            repro/
            build/CMakeCache.txt
          retention-days: 14

  # Sanitizer runs that configs does not make: MemorySanitizer, which cannot
  # share a build with ASan, on the defaults, on Tier 1's coarse configurations
  # and on the pairwise rows of configs, and ASan and UBSan with GCC and on
  # aarch64. The jobs start once versions and mingw have finished, whether or
  # not they passed, and run in the runners that those families used, so Tier
  # 2 never runs more jobs at once. The steps are configs', without those that
  # no job here needs, plus Select sanitizer.
  sanitizers:
    name: ${{ matrix.name }}
    needs: [versions, mingw]
    if: >-
      !cancelled() && (github.repository == 'DMTF/libspdm'
      || github.event_name != 'schedule')
    runs-on: ${{ matrix.os || 'ubuntu-24.04' }}
    timeout-minutes: 45
    env:
      JOB_NAME: ${{ matrix.name }}
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          # == MemorySanitizer =============================================
          # Every object must be instrumented, so these use Mbed TLS, which
          # CMake builds, rather than OpenSSL.

          - name: msan-defaults
            sanitizer: memory

          - name: msan-defaults-release
            sanitizer: memory
            target: Release

          - name: msan-fips
            sanitizer: memory
            cflags: -DLIBSPDM_FIPS_MODE=1
            extra_tests: test_spdm_fips

          - name: msan-record-transcript
            sanitizer: memory
            cflags: -DLIBSPDM_RECORD_TRANSCRIPT_DATA_SUPPORT=1

          - name: msan-minimal-caps
            sanitizer: memory
            cflags: >-
              -DLIBSPDM_ENABLE_CAPABILITY_PSK_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_HBEAT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_MUT_AUTH_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_ENCAP_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_CSR_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_SET_CERT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_CHUNK_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_MEL_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_EVENT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_GET_KEY_PAIR_INFO_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_SET_KEY_PAIR_INFO_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_ENDPOINT_INFO_CAP=0
              -DLIBSPDM_EVENT_RECIPIENT_SUPPORT=0
              -DLIBSPDM_SEND_GET_ENDPOINT_INFO_SUPPORT=0

          # The pairwise rows of configs.

          - name: msan-pairwise-01
            sanitizer: memory
            cflags: >-
              -DLIBSPDM_ENABLE_CAPABILITY_PSK_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_MUT_AUTH_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_CHUNK_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_MEL_CAP=0
              -DLIBSPDM_ENABLE_VENDOR_DEFINED_MESSAGES=0
              -DLIBSPDM_EVENT_RECIPIENT_SUPPORT=0
              -DLIBSPDM_CHECK_SPDM_CONTEXT=0
              -DLIBSPDM_FIPS_MODE=1
            extra_tests: test_spdm_fips

          - name: msan-pairwise-02
            sanitizer: memory
            cflags: >-
              -DLIBSPDM_ENABLE_CAPABILITY_CERT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_CHAL_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_MEAS_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_HBEAT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_ENCAP_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_CSR_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_SET_CERT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_EVENT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_GET_KEY_PAIR_INFO_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_SET_KEY_PAIR_INFO_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_ENDPOINT_INFO_CAP=0
              -DLIBSPDM_SEND_GET_CERTIFICATE_SUPPORT=0
              -DLIBSPDM_SEND_CHALLENGE_SUPPORT=0
              -DLIBSPDM_EVENT_RECIPIENT_SUPPORT=0
              -DLIBSPDM_SEND_GET_ENDPOINT_INFO_SUPPORT=0
              -DLIBSPDM_RESPOND_IF_READY_SUPPORT=0
              -DLIBSPDM_ENABLE_MSG_LOG=0
              -DLIBSPDM_RECORD_TRANSCRIPT_DATA_SUPPORT=1

          - name: msan-pairwise-03
            sanitizer: memory
            cflags: >-
              -DLIBSPDM_ENABLE_CAPABILITY_CHAL_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_KEY_EX_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_PSK_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_HBEAT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_MUT_AUTH_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_CSR_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_SET_CERT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_MEL_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_EVENT_CAP=0
              -DLIBSPDM_ENABLE_CAPABILITY_ENDPOINT_INFO_CAP=0
              -DLIBSPDM_RESPOND_IF_READY_SUPPORT=0
              -DLIBSPDM_ENABLE_MSG_LOG=0
              -DLIBSPDM_CHECK_SPDM_CONTEXT=0
              -DLIBSPDM_RECORD_TRANSCRIPT_DATA_SUPPORT=1
              -DLIBSPDM_FFDHE_2048_SUPPORT=0 -DLIBSPDM_FFDHE_3072_SUPPORT=0 -DLIBSPDM_FFDHE_4096_SUPPORT=0
              -DLIBSPDM_ECDHE_P256_SUPPORT=0 -DLIBSPDM_ECDHE_P384_SUPPORT=0 -DLIBSPDM_ECDHE_P521_SUPPORT=0

