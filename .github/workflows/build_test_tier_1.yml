    env:
      # Budgets from doc/internal/continuous_integration.md, Tier 1: total wall clock under 30
      # minutes, worst case single job 20 minutes. Exceeding either is reported
      # as a warning rather than a failure, because wall clock also depends on
      # runner contention, which is not something a pull request can control.
      MAX_RUN_MINUTES: 30
      MAX_JOB_MINUTES: 20
      SELF_JOB_NAME: Tier 1 complete
    steps:
      - name: Report timing against the budget
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # per_page=100 covers the current matrix; revisit beyond 100 jobs.
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" > run.json
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" > jobs.json
          python3 - run.json jobs.json <<'TIMING'
          import json, os, sys, datetime

          UTC = datetime.timezone.utc
          FMT = "%Y-%m-%dT%H:%M:%SZ"


          def ts(s):
              return datetime.datetime.strptime(s, FMT).replace(tzinfo=UTC)


          run = json.load(open(sys.argv[1]))
          jobs = json.load(open(sys.argv[2]))["jobs"]

          # Allow tests to pin "now"; the workflow leaves it unset.
          now = ts(sys.argv[3]) if len(sys.argv) > 3 else datetime.datetime.now(UTC)

          max_run = int(os.environ.get("MAX_RUN_MINUTES", "30"))
          max_job = int(os.environ.get("MAX_JOB_MINUTES", "20"))
          me = os.environ.get("SELF_JOB_NAME", "Tier 1 complete")

          queue = (ts(run["run_started_at"]) - ts(run["created_at"])).total_seconds()
          elapsed = (now - ts(run["run_started_at"])).total_seconds()

          durs = [
              ((ts(j["completed_at"]) - ts(j["started_at"])).total_seconds(), j["name"])
              for j in jobs
              if j.get("completed_at") and j["name"] != me
          ]
          slow_d, slow_n = max(durs) if durs else (0, "(none)")
          total = sum(d for d, _ in durs)

          lines = [
              "### Tier 1 timing",
              "",
              "| metric | value | budget |",
              "|---|---|---|",
              "| wall clock | %.1f min | %d min |" % (elapsed / 60, max_run),
              "| slowest job | %.1f min (%s) | %d min |" % (slow_d / 60, slow_n, max_job),
              "| queued before start | %.1f min | - |" % (queue / 60),
              "| sum of job time | %.1f min | - |" % (total / 60),
              "| jobs | %d | - |" % len(durs),
          ]

          warn = []
          if elapsed > max_run * 60:
              warn.append(
                  "Tier 1 wall clock %.1f min exceeds the %d min budget in doc/internal/continuous_integration.md"
                  % (elapsed / 60, max_run)
              )
          if slow_d > max_job * 60:
              warn.append(
                  "Job '%s' took %.1f min, over the %d min worst-case-job assumption"
                  % (slow_n, slow_d / 60, max_job)
              )

          for w in warn:
              print("::warning::" + w)
              lines += ["", "> [!WARNING]", "> " + w]

          print("\n".join(lines))
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a") as f:
                  f.write("\n".join(lines) + "\n")
          TIMING

      - name: Check result
        run: |
          posix="${{ needs.posix.result }}"
          msvc="${{ needs['windows-msvc'].result }}"
          mingw="${{ needs.mingw.result }}"
          echo "posix=$posix windows-msvc=$msvc mingw=$mingw"
          if [ "$posix" != "success" ] || [ "$msvc" != "success" ] || [ "$mingw" != "success" ]; then
            echo "::error::Tier 1 did not pass (posix=$posix windows-msvc=$msvc mingw=$mingw)"
            exit 1
          fi

