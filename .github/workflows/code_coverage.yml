name: Code Coverage

on:
  schedule:
    # Off the hour, when GitHub is less likely to delay or drop scheduled runs.
    - cron: '25 8 * * 0'
  workflow_dispatch:

# Runs on one ref wait for each other rather than race the force-push to
# github_pages.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # As in Tier 1. CHECK_MACRO rejects an illegal configuration at compile time,
  # and ASSERT_CONFIG=3 makes a failing assert exit rather than deadloop.
  BASE_CFLAGS: -DLIBSPDM_CHECK_MACRO=1 -DLIBSPDM_DEBUG_LIBSPDM_ASSERT_CONFIG=3

jobs:
  build:
    # Pinned so that the lcov version, which affects the report, changes only
    # when this file does.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Only the publish job writes to the repository.
          persist-credentials: false

      - name: Fetch submodules
        run: |
          # Retry rather than fail the run on a transient fetch error.
          fetch() {
            local path=$1
            shift
            for attempt in 1 2 3; do
              if git submodule update --init "$@" "$path"; then
                return 0
              fi
              echo "fetch of $path failed, attempt $attempt"
              sleep $((attempt * 15))
            done
            return 1
          }

          fetch unit_test/cmockalib/cmocka --depth 1 --recursive
          fetch os_stub/mbedtlslib/mbedtls --depth 1 --recursive

      - name: Build - Linux
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y lcov
          mkdir build
          cd build
          cmake -E env CFLAGS="${{ env.BASE_CFLAGS }} -DLIBSPDM_FIPS_MODE=1" cmake -DTOOLCHAIN=GCC -DTARGET=Debug -DCRYPTO=mbedtls -DGCOV=ON ..
          make -j`nproc`
          make copy_sample_key
          make copy_seed

      - name: Test
        run: |
          cd build/bin
          ./test_spdm_requester
          ./test_spdm_responder
          ./test_spdm_common
          ./test_spdm_crypt
          ./test_crypt
          ./test_spdm_secured_message
          ./test_spdm_fips
          # The unit tests link spdm_transport_test_lib, so the transport
          # libraries are only executed by the fuzzing harnesses.
          ./run_initial_seed.sh

      - name: Generate Coverage
        run: |
          mkdir /tmp/coverage_log
          # Leave out the branches of LIBSPDM_ASSERT lines, whose failure side a
          # passing run never takes. genhtml ignores lcov_excl_br_line, so both
          # captures set it.
          lcov --rc branch_coverage=1 --rc geninfo_gcov_all_blocks=1 \
            --rc lcov_excl_br_line='LCOV_EXCL_BR_LINE|LIBSPDM_ASSERT' \
            --capture --initial --directory ./build --output-file coverage_base.info
          lcov --rc branch_coverage=1 --rc geninfo_gcov_all_blocks=1 \
            --rc lcov_excl_br_line='LCOV_EXCL_BR_LINE|LIBSPDM_ASSERT' \
            --capture --directory ./build --output-file coverage_test.info
          lcov --rc branch_coverage=1 \
            --add-tracefile coverage_base.info --add-tracefile coverage_test.info \
            --output-file coverage_all.info
          lcov --rc branch_coverage=1 --extract coverage_all.info \
            "${GITHUB_WORKSPACE}/include/*" \
            "${GITHUB_WORKSPACE}/library/*" \
            --output-file coverage.info
          # Without --prefix, genhtml drops library/ from the page paths and
          # shows include/ under the runner's absolute path. genhtml escapes
          # --title but writes --header-title as HTML, so the link to the
          # measured commit goes in the banner.
          tree_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${GITHUB_SHA}"
          genhtml --rc branch_coverage=1 \
            --title "${GITHUB_SHA}" --prefix "${GITHUB_WORKSPACE}" \
            --header-title "Code coverage report for <a href=\"${tree_url}\">${GITHUB_REPOSITORY}</a>" \
            coverage.info --output-directory /tmp/coverage_log

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage_log
          path: /tmp/coverage_log
          # The artifact only carries the report to the publish job.
          retention-days: 7

  # A run on any other branch measures coverage but does not publish it.
  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout github_pages
        uses: actions/checkout@v7
        with:
          ref: github_pages

      - name: Remove previous report
        run: rm -rf coverage_log

      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: coverage_log
          path: coverage_log

      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f coverage_log
          # github_pages holds a single parentless commit, so its history does
          # not grow.
          commit=$(git commit-tree "$(git write-tree)" -m "Publish code coverage.")
          git push --force origin "$commit:refs/heads/github_pages"
