name: Code Coverage

on:
  schedule:
    - cron:  '0 8 * * 0'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build - Linux
        run: |
          sudo apt-get update
          sudo apt-get install lcov
          mkdir build
          cd build
          cmake -E env CFLAGS="-DLIBSPDM_FIPS_MODE=1" cmake -DTOOLCHAIN=GCC -DTARGET=Debug -DCRYPTO=mbedtls -DGCOV=ON ..
          make -j`nproc`
          make copy_sample_key
          make copy_seed

      - name: Test
        run: |
          cd build/bin
          ./test_spdm_requester
          ./test_spdm_responder
          ./test_spdm_common
          ./test_spdm_crypt
          ./test_crypt
          ./test_spdm_secured_message
          ./test_spdm_fips
          # The unit tests link spdm_transport_test_lib, so the transport
          # libraries are only executed by the fuzzing harnesses.
          ./run_initial_seed.sh

      - name: Generate Coverage
        env:
          CI_COMMIT_MESSAGE: Publish code coverage.
          CI_COMMIT_AUTHOR: Continuous Integration
        run: |
          mkdir /tmp/coverage_log
          lcov --rc branch_coverage=1 --rc geninfo_gcov_all_blocks=1 \
            --capture --initial --directory ./build --output-file coverage_base.info
          lcov --rc branch_coverage=1 --rc geninfo_gcov_all_blocks=1 \
            --capture --directory ./build --output-file coverage_test.info
          lcov --rc branch_coverage=1 \
            --add-tracefile coverage_base.info --add-tracefile coverage_test.info \
            --output-file coverage_all.info
          lcov --rc branch_coverage=1 --extract coverage_all.info \
            "${GITHUB_WORKSPACE}/include/*" \
            "${GITHUB_WORKSPACE}/library/*" \
            --output-file coverage.info
          genhtml --rc branch_coverage=1 coverage.info --output-directory /tmp/coverage_log
          git fetch origin
          git checkout github_pages
          rm -rf ./coverage_log
          mv /tmp/coverage_log ./
          git config --global user.name "${{ env.CI_COMMIT_AUTHOR }}"
          git config --global user.email "void@void.net"
          git add -f coverage_log/\*
          git commit -am "${{ env.CI_COMMIT_MESSAGE }}"
          git reset $(git commit-tree HEAD^{tree} -m "${{ env.CI_COMMIT_MESSAGE }}")
          git push --force origin github_pages
