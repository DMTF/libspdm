# libspdm: requester only, MCTP transport over libmctp.
CONFIG_LIBSPDM=y
CONFIG_LIBSPDM_REQUESTER=y
CONFIG_LIBSPDM_RESPONDER=n
CONFIG_LIBSPDM_CRYPTO_MBEDTLS=y
CONFIG_LIBSPDM_TRANSPORT_MCTP=y
CONFIG_LIBSPDM_TRANSPORT_MCTP_LIBMCTP=y
CONFIG_LIBSPDM_SECRET_LIB_SAMPLE=y
CONFIG_LIBSPDM_DEBUG_ENABLE=n

# Sized for GET_CERTIFICATE with a ~1.5 KiB ECDSA-P256 chain
CONFIG_LIBSPDM_MCTP_BUFFER_SIZE=2048
CONFIG_LIBSPDM_MCTP_RX_QUEUE_DEPTH=1

# Zephyr libmctp core. The concrete bus binding (MCTP over I3C on
# npcx4m8f_evb, or MCTP over I2C+GPIO on frdm_mcxn947) is board
# specific and is selected in boards/<board>.conf.
CONFIG_MCTP=y

# Should be enough for SPDM_CERTIFICATE response.
CONFIG_MCTP_MAX_MESSAGE_SIZE=2048
CONFIG_MCTP_HEAP_SIZE=6144

CONFIG_TEST_RANDOM_GENERATOR=y

# Allocation budget.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=0
CONFIG_COMMON_LIBC_MALLOC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=40960

CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_PRINTK=y
